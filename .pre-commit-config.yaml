repos:
  - repo: local
    hooks:
      - id: rust-check
        name: rustfmt and clippy
        entry: ./scripts/check-rust.sh check
        language: script
        pass_filenames: false
        files: \.rs$

      - id: binary-sizes
        name: check binary sizes against memory layout
        entry: ./scripts/check-binary-sizes.sh
        language: script
        pass_filenames: false
        files: ^src/

      # The two devcontainer images must pin the same Rust nightly.
      # bump-rust-nightly.sh enforces this too, but only weekly; here it
      # catches a hand-edit before it lands.
      - id: nightly-pins
        name: devcontainer Rust nightly pins agree
        entry: ./tools/ci/check-nightly-pins.sh
        language: script
        pass_filenames: false
        files: ^src/\.devcontainer/.*Dockerfile$

  # Lints the agent context (AGENTS.md, CLAUDE.md, .claude/ and
  # anything else an agent is handed) for malformed structure,
  # smuggled instructions and the like. Renovate's pre-commit manager
  # keeps the rev current.
  - repo: https://github.com/stbenjam/skillsaw
    rev: v0.19.0
    hooks:
      - id: skillsaw

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ['-config-file', '.github/actionlint.yaml']

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^(scripts|tools)/
        types_or: [sh, bash, shell]
        args: ['-x']
