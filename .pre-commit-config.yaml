repos:
  - repo: local
    hooks:
      - id: rust-check
        name: rustfmt and clippy
        entry: ./scripts/check-rust.sh check
        language: script
        pass_filenames: false
        files: \.rs$

      - id: binary-sizes
        name: check binary sizes against memory layout
        entry: ./scripts/check-binary-sizes.sh
        language: script
        pass_filenames: false
        files: ^src/

      # The two devcontainer images must agree on every pin they share:
      # the Rust nightly and the versions of the cargo tools both
      # install. bump-rust-nightly.sh enforces the nightly half too, but
      # only weekly; here it catches a hand-edit before it lands. The
      # same script also asserts that every `cargo install` keeps its
      # --locked and that every pin stays matchable by the Renovate
      # customManager, both of which fail silently in production.
      #
      # renovate.json and the guard's own two files are in the filter as
      # well as the Dockerfiles: the check runs the customManager regex
      # as it is actually written today over both images, so an edit to
      # either half can break the pairing without touching a Dockerfile.
      - id: devcontainer-pins
        name: devcontainer pins agree, are --locked and Renovate-visible
        entry: ./tools/ci/check-devcontainer-pins.sh
        language: script
        pass_filenames: false
        files: ^(src/\.devcontainer/.*Dockerfile|renovate\.json|tools/ci/check-(devcontainer-pins\.sh|renovate-manager\.py))$

      # A test must not make a LUKS image at runtime: qemu-img's
      # pre-create key-derivation timing fails about one time in three on
      # some builds, and that flake ejected three PRs from the merge
      # queue (#905). Use the prebuilt qcow2-luks fixture. The check is a
      # script rather than a pygrep pattern so that the ci-tooling job
      # runs it too, and so it can carry a self-test; the reasoning,
      # including what it matches and the one exempt file, is in its
      # header.
      - id: no-runtime-luks-create
        name: Tests use the qcow2-luks fixture, not a runtime LUKS create
        entry: ./tools/ci/check-no-runtime-luks-create.sh
        language: script
        pass_filenames: false
        files: ^(tests/.*\.(py|sh)|tools/ci/check-no-runtime-luks-create\.sh)$

      # A test must not use tempfile.NamedTemporaryFile: a failed convert
      # removes an output it left empty (#849), and on Python 3.10 and
      # 3.11 a NamedTemporaryFile whose file is gone raises from its
      # cleanup. Only the merge queue's older-Python legs can see that,
      # and it ejected every queued PR (#959). Use ScratchFile from
      # tests/helpers/scratch.py; the guard's header has the reasoning.
      - id: no-named-temporary-file
        name: Tests use ScratchFile, not tempfile.NamedTemporaryFile
        entry: ./tools/ci/check-no-named-temporary-file.sh
        language: script
        pass_filenames: false
        files: ^(tests/.*\.py|tools/ci/check-no-named-temporary-file\.sh)$

      # A test must not build a path into the repository outside tests/:
      # the package matrix copies tests/ alone to /tmp and runs it there
      # against an installed package, so the path resolves against /tmp
      # and raises. The PR gate runs the suite from the checkout and
      # cannot see it; two such tests ejected #968. Source-level checks
      # belong in tools/ci, as check-vmdk-split-pins.py now is.
      - id: tests-relocatable
        name: Tests build no path outside tests/
        entry: ./tools/ci/check-tests-relocatable.sh
        language: script
        pass_filenames: false
        files: ^(tests/.*\.py|tools/ci/check-tests-relocatable\.sh)$

      # The vmdk crate holds qemu's split descriptors as Rust literals,
      # because the Rust workspace has no JSON parser to read the pin
      # with. Only a text comparison outside Rust can check that copy.
      - id: vmdk-split-pins
        name: Split VMDK descriptor literals match the qemu pin
        entry: ./tools/ci/check-vmdk-split-pins.py --no-fixture
        language: script
        pass_filenames: false
        files: ^(src/crates/vmdk/src/lib\.rs|tests/golden/qemu-create-pins\.json|tools/ci/check-vmdk-split-pins\.py)$

      # A line number in documentation goes stale on the next edit to the
      # code it points into, in a change that never touches the document;
      # name the function or class instead. The files are the ones the
      # consistency audit's docs-line-references criterion covers, plus
      # the skills under .claude/: an agent following a stale pointer
      # from one lands on unrelated lines just the same. Unlike the
      # audit, this hook cannot see fenced blocks, so quoted tool
      # output in a fence can trip it; the audit remains the backstop.
      #
      # Both spellings are matched. `file.rs:123` is the obvious one;
      # the prose forms -- "(line 123)", "lines 754-755", "at line 1092",
      # "(ln 1624)" -- say exactly the same thing and rot exactly the
      # same way, and a regex for the first form alone passes them.
      #
      # The examples above are here, and not in the page that documents
      # the convention, because this hook reads markdown only: a
      # markdown page cannot show the forms it forbids without tripping
      # the hook that reads it, so docs/development.md describes them in
      # prose and the specimens live beside the pattern.
      #
      # Most alternations need the line to be named deliberately -- "at
      # line 30", "(line 30)" -- so prose about a log window or tool
      # output is left alone. The bare range form is the exception: it
      # matches "lines 10-20" wherever it appears, including of a
      # captured log. Rephrase such a sentence rather than widening the
      # pattern, which is what would let a real citation through.
      - id: docs-line-references
        name: No source line-number references in documentation
        language: pygrep
        entry: >-
          \b[\w./-]+\.(py|pyi|rs|go|sh|proto|js|ts|c|h|cc|cpp|toml|ya?ml|j2|html):\d+(?:[-,]\d+)*(?![\d:])|/blob/(?![0-9a-f]{40}/)[^\s)#]+#L\d+|\b(?:at|see|from|in)\s+lines?\s+\d+|\((?:ln\.?|lines?)\s+\d+|\blines\s+\d+\s*[-,]\s*\d+|\bln\.?\s+\d+
        types: [markdown]
        files: ^(docs/|\.claude/|README\.md$|AGENTS\.md$|ARCHITECTURE\.md$)
        exclude: (^|/)plans/

      # instar keeps no CHANGELOG.md: every pull request appended to it,
      # so every pair of pull requests in flight conflicted there, and
      # the record it kept is the commit messages and docs/ already.
      # Release notes are written on the GitHub release instead. Older
      # plans in docs/plans/ still say to add an entry, so this stops an
      # agent following one from bringing the file back, at the root or
      # anywhere else. See "Releases" in docs/development.md. A script
      # over `git ls-files` rather than a `files:` pattern, so it sees a
      # file that is already in the tree as well as one being added, and
      # so functional-tests.yml's check_paths job runs the same check.
      - id: no-changelog
        name: No CHANGELOG.md (release notes go on the GitHub release)
        entry: ./tools/ci/check-no-changelog.sh
        language: script
        pass_filenames: false
        always_run: true

  # Lints the agent context (AGENTS.md, CLAUDE.md, .claude/ and
  # anything else an agent is handed) for malformed structure,
  # smuggled instructions and the like. Renovate's pre-commit manager
  # keeps the rev current.
  - repo: https://github.com/stbenjam/skillsaw
    rev: v0.23.0
    hooks:
      - id: skillsaw

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ['-config-file', '.github/actionlint.yaml']

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^(scripts|tools)/
        types_or: [sh, bash, shell]
        args: ['-x']
