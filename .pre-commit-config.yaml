repos:
  - repo: local
    hooks:
      - id: rust-check
        name: rustfmt and clippy
        entry: ./scripts/check-rust.sh check
        language: script
        pass_filenames: false
        files: \.rs$

      - id: binary-sizes
        name: check binary sizes against memory layout
        entry: ./scripts/check-binary-sizes.sh
        language: script
        pass_filenames: false
        files: ^src/

      # The two devcontainer images must agree on every pin they share:
      # the Rust nightly and the versions of the cargo tools both
      # install. bump-rust-nightly.sh enforces the nightly half too, but
      # only weekly; here it catches a hand-edit before it lands. The
      # same script also asserts that every `cargo install` keeps its
      # --locked and that every pin stays matchable by the Renovate
      # customManager, both of which fail silently in production.
      #
      # renovate.json and the guard's own two files are in the filter as
      # well as the Dockerfiles: the check runs the customManager regex
      # as it is actually written today over both images, so an edit to
      # either half can break the pairing without touching a Dockerfile.
      - id: devcontainer-pins
        name: devcontainer pins agree, are --locked and Renovate-visible
        entry: ./tools/ci/check-devcontainer-pins.sh
        language: script
        pass_filenames: false
        files: ^(src/\.devcontainer/.*Dockerfile|renovate\.json|tools/ci/check-(devcontainer-pins\.sh|renovate-manager\.py))$

      # A line number in documentation goes stale on the next edit to the
      # code it points into, in a change that never touches the document;
      # name the function or class instead. The files are the ones the
      # consistency audit's docs-line-references criterion covers. Unlike
      # the audit, this hook cannot see fenced blocks, so quoted tool
      # output in a fence can trip it; the audit remains the backstop.
      - id: docs-line-references
        name: No source line-number references in documentation
        language: pygrep
        entry: >-
          \b[\w./-]+\.(py|pyi|rs|go|sh|proto|js|ts|c|h|cc|cpp|toml|ya?ml|j2|html):\d+(?:[-,]\d+)*(?![\d:])|/blob/(?![0-9a-f]{40}/)[^\s)#]+#L\d+
        types: [markdown]
        files: ^(docs/|README\.md$|AGENTS\.md$|ARCHITECTURE\.md$)
        exclude: (^|/)plans/

  # Lints the agent context (AGENTS.md, CLAUDE.md, .claude/ and
  # anything else an agent is handed) for malformed structure,
  # smuggled instructions and the like. Renovate's pre-commit manager
  # keeps the rev current.
  - repo: https://github.com/stbenjam/skillsaw
    rev: v0.22.0
    hooks:
      - id: skillsaw

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ['-config-file', '.github/actionlint.yaml']

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^(scripts|tools)/
        types_or: [sh, bash, shell]
        args: ['-x']
