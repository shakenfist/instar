[package]
name = "guest"
version = "0.1.0"
edition = "2021"
description = "Bare-metal guest with pluggable operations for virtio-block devices"
license = "Apache-2.0"

[dependencies]
guest-protocol = { path = "../../../crates/guest-protocol" }
