[package]
name = "instar"
version = "0.1.0"
edition = "2021"
description = "Safe, sandboxed disk image operations"
license = "Apache-2.0"

[[bin]]
name = "instar"
path = "src/main.rs"

[dependencies]
kvm-ioctls = "0.24"
kvm-bindings = "0.14"
vm-memory = { version = "0.15", features = ["backend-mmap"] }
virtio-queue = "0.17"
virtio-bindings = "0.2"
vmm-sys-util = "0.12"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
guest-protocol = { path = "../../../crates/guest-protocol", features = ["std"] }
