[package]
name = "vmm"
version = "0.1.0"
edition = "2021"
description = "Minimal KVM VMM with virtio-block device support and I/O optimizations"
license = "Apache-2.0"

[dependencies]
kvm-ioctls = "0.24"
kvm-bindings = "0.14"
vm-memory = { version = "0.18", features = ["backend-mmap"] }
virtio-queue = "0.17"
virtio-bindings = "0.2"
vmm-sys-util = "0.15"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
memmap2 = "0.9"
guest-protocol = { path = "../../../crates/guest-protocol", features = ["std"] }
