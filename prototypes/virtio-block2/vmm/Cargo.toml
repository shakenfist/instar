[package]
name = "vmm"
version = "0.1.0"
edition = "2021"
description = "Minimal KVM VMM with virtio-block device support"
license = "Apache-2.0"

[dependencies]
kvm-ioctls = "0.25"
kvm-bindings = "0.14"
vm-memory = { version = "0.18", features = ["backend-mmap"] }
virtio-queue = "0.18"
virtio-bindings = "0.2"
clap = { version = "4.5", features = ["derive"] }
guest-protocol = { path = "../../../crates/guest-protocol", features = ["std"] }

[lints.clippy]
unwrap_used = "warn"
