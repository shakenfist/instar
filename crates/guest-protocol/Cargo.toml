[package]
name = "guest-protocol"
version = "0.1.0"
edition = "2021"
description = "Protocol Buffers-based serial protocol for guest-to-VMM communication"
license = "Apache-2.0"
publish = false

[features]
default = []
std = []  # Enable for VMM parsing support

[dependencies]
micropb = { version = "0.6", features = ["container-heapless-0-8"] }
heapless = "0.9"

[build-dependencies]
micropb-gen = "0.6"
