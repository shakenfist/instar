[package]
name = "guest-protocol"
version = "0.2.0"
edition = "2021"
description = "Protocol Buffers-based serial protocol for guest-to-VMM communication"
license = "Apache-2.0"
publish = false

# This crate is standalone (not a member of the src/ workspace), so it
# declares the unwrap lint directly rather than inheriting workspace
# lints (rust-unwrap-lint audit).
[lints.clippy]
unwrap_used = "warn"

[features]
default = []
std = []  # Enable for VMM parsing support

[dependencies]
micropb = { version = "0.6", features = ["container-heapless-0-9"] }
heapless = "0.9"

[build-dependencies]
micropb-gen = "0.6"
