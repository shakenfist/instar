syntax = "proto3";
package guest;

// Log level for messages
enum Level {
  DEBUG = 0;
  INFO = 1;
  PROGRESS = 2;
  ERROR = 3;
  COMPLETE = 4;
}

// =============================================================================
// VMM -> Guest Messages (configuration sent at startup)
// =============================================================================

// Configuration for a single device
message DeviceConfig {
  string name = 1;           // "input" or "output"
  uint32 sector_size = 2;    // Sector size in bytes (512, 1024, 2048, 4096)
}

// Configuration message sent from VMM to guest at startup
message VmmConfig {
  repeated DeviceConfig devices = 1;  // Configuration for each device
  uint32 progress_percent = 2;        // Progress update interval (0=none, 1=every 1%, etc.)
}

// =============================================================================
// Guest -> VMM Messages (status and progress)
// =============================================================================

// Initialization stage message
message InitMessage {
  string stage = 1;      // "probe", "features", "queue"
  string device = 2;     // "input", "output"
  uint64 address = 3;    // MMIO address or feature bits
}

// Device capacity information
message CapacityMessage {
  string device = 1;
  uint64 sectors = 2;
  uint64 bytes = 3;
}

// Progress update during operations
message ProgressMessage {
  string operation = 1;  // "copy"
  uint64 current = 2;
  uint64 total = 3;
  uint32 percent = 4;
}

// Error information
message ErrorMessage {
  string operation = 1;  // "read", "write"
  string device = 2;
  uint64 sector = 3;
  uint32 status = 4;
}

// Operation completion
message CompleteMessage {
  string operation = 1;
  uint64 count = 2;      // sectors copied
  bool success = 3;
}

// QCOW2 format-specific information
message Qcow2Info {
  string compat = 1;           // "0.10" or "1.1"
  string compression_type = 2; // "zlib" or "zstd"
  bool lazy_refcounts = 3;
  uint32 refcount_bits = 4;
  bool corrupt = 5;
  bool extended_l2 = 6;
  string backing_format = 7;   // Backing file format (from header extension)
  bool dirty = 8;              // Image not cleanly closed
  uint32 nb_snapshots = 9;     // Number of snapshots in snapshot table
}

// VMDK format-specific information
message VmdkInfo {
  uint32 cid = 1;
  uint32 parent_cid = 2;
  string create_type = 3;
}

// VDI (VirtualBox) format-specific information
message VdiInfo {
  uint32 image_type = 1;        // 1=dynamic, 2=fixed
  uint32 block_size = 2;        // Block size in bytes
  uint32 blocks_in_image = 3;   // Total number of blocks
  uint32 blocks_allocated = 4;  // Number of allocated blocks
  string uuid = 5;              // Image UUID
}

// LUKS (Linux Unified Key Setup) format-specific information
message LuksInfo {
  string cipher = 1;            // Cipher name (e.g., "aes")
  string cipher_mode = 2;       // Cipher mode (e.g., "xts-plain64")
  string hash = 3;              // Hash spec (e.g., "sha256")
  string uuid = 4;              // Volume UUID
  uint32 payload_offset = 5;    // Payload offset in 512-byte sectors (v1)
  uint32 master_key_length = 6; // Master key length in bytes
  uint32 active_key_slots = 7;  // Number of active key slots
  string inner_format = 8;      // Detected inner format after decryption (e.g., "qcow2", "raw")
  uint64 inner_virtual_size = 9; // Virtual size of inner format (if detected)
}

// Image format detection result (from info operation)
message InfoResultMessage {
  // Detected format: "unknown", "raw", "qcow2", "vmdk", "vmdk3", "vhd", "vhdx", "qcow1", "vdi"
  string format = 1;
  // Format version (e.g., 2 or 3 for QCOW2)
  uint32 version = 2;
  // Virtual size in bytes (from image header)
  uint64 virtual_size = 3;
  // Actual file size in bytes
  uint64 actual_size = 4;
  // Cluster/grain size in bytes (format-specific)
  uint32 cluster_size = 5;
  // Feature flags (bitfield):
  //   bit 0: has_backing_file
  //   bit 1: has_external_data
  //   bit 2: encrypted
  //   bit 3: compressed
  //   bit 4: has_snapshots
  //   bit 5: dirty
  //   bit 6: corrupt
  uint32 flags = 6;
  // Backing file path (if present in image header)
  string backing_file = 7;
  // External data file path (if present, QCOW2 v3)
  string external_data_file = 8;
  // Format-specific information (optional)
  Qcow2Info qcow2_info = 9;
  VmdkInfo vmdk_info = 10;
  VdiInfo vdi_info = 11;
  LuksInfo luks_info = 12;
}

// Image integrity check result (from check operation)
message CheckResultMessage {
  // Detected format: "unknown", "raw", "qcow2", "vmdk", etc.
  string format = 1;
  // Total number of errors found
  uint32 total_errors = 2;
  // Number of corruptions (data integrity issues)
  uint32 corruptions = 3;
  // Number of leaks (unreferenced allocated clusters)
  uint32 leaks = 4;
  // Number of refcount inconsistencies
  uint32 refcount_errors = 5;
  // Image end offset (highest byte offset in use)
  uint64 image_end_offset = 6;
  // Total clusters checked
  uint64 clusters_checked = 7;
  // Total allocated clusters
  uint64 clusters_allocated = 8;
  // Fragmentation percentage (0-100)
  uint32 fragmentation = 9;
  // Status flags:
  //   bit 0: valid (no errors)
  //   bit 1: has_leaks
  //   bit 2: has_corruptions
  //   bit 3: dirty
  //   bit 4: corrupt_bit (in header)
  //   bit 5: incomplete check
  //   bit 6: not_supported (format doesn't support check)
  //   bit 7: chain_errors (backing chain validation errors)
  uint32 flags = 10;
  // Number of backing chain validation errors
  uint32 chain_errors = 11;
  // Number of subcluster bitmap validation errors (extended L2)
  uint32 subcluster_errors = 12;
}

// Image comparison result (from compare operation)
message CompareResultMessage {
  // Whether the images are logically identical
  bool identical = 1;
  // Byte offset of first content mismatch (only valid if not identical)
  uint64 first_mismatch_offset = 2;
  // Total bytes compared
  uint64 total_bytes_compared = 3;
  // Status flags:
  //   bit 0: size_mismatch (images have different sizes)
  uint32 flags = 4;
}

// Image size measurement result (from measure operation).
message MeasureResultMessage {
  // Target output format echoed back (e.g. "raw", "qcow2", "vmdk",
  // "vhd", "vhdx").
  string target_format = 1;
  // Bytes required when only allocated extents are written.
  uint64 required = 2;
  // Bytes required when every cluster/grain/block is allocated.
  uint64 fully_allocated = 3;
  // Cluster / grain / block size actually used. 0 for raw output.
  uint32 resolved_unit_size = 4;
  // Error code: 0 = ok, 1 = overflow, 2 = invalid option, 3 = invalid size.
  // Matches MeasureResult::ERROR_* in src/shared/src/lib.rs.
  uint32 error = 5;
}

// Image creation result (from create operation).
message CreateResultMessage {
  // Target output format echoed back (e.g. "raw", "qcow2", "vmdk",
  // "vhd", "vhdx").
  string target_format = 1;
  // Resolved virtual disk size in bytes. Equal to the requested size
  // when the host supplied an explicit virtual_size, or the backing
  // file's virtual size when the size was inferred from the backing.
  uint64 resolved_virtual_size = 2;
  // Bytes the guest actually wrote to the output device (sum of
  // MetadataWrite lengths in the plan).
  uint64 metadata_bytes_written = 3;
  // File size after the guest finishes (max byte_offset + len across
  // the plan). The host may grow the file beyond this for
  // preallocation in phase 6.
  uint64 file_size_after = 4;
  // Cluster / grain / block size actually used. 0 for raw output.
  uint32 resolved_unit_size = 5;
  // Error code: 0 = ok, non-zero mirrors CreateResult::ERROR_* in
  // src/shared/src/lib.rs (1=invalid_option, 2=invalid_size,
  // 3=scratch_too_small, 4=backing_read_failed,
  // 5=backing_parse_failed, 6=backing_too_long, 7=write_failed,
  // 8=unsupported_format).
  uint32 error = 6;
}

// Image resize result (from resize operation).
message ResizeResultMessage {
  // Target output format echoed back (e.g. "raw", "qcow2",
  // "vmdk", "vhd", "vhdx").
  string target_format = 1;
  // Resolved new virtual disk size in bytes.
  uint64 resolved_new_virtual_size = 2;
  // File size before the host's post-pass `set_len` (the
  // pre-resize EOF).
  uint64 file_size_before = 3;
  // File size after the guest's last patch (before the host
  // post-pass).
  uint64 file_size_after = 4;
  // Action taken: "noop" | "grow" | "shrink". Matches
  // ResizeResult::ACTION_* in src/shared/src/lib.rs.
  string action = 5;
  // Error code: 0 = ok, non-zero mirrors ResizeResult::ERROR_*
  // in src/shared/src/lib.rs.
  uint32 error = 6;
}

// Image rebase result (from rebase operation).
message RebaseResultMessage {
  // Overlay format echoed back (e.g. "qcow2", "vmdk").
  string overlay_format = 1;
  // Mode taken: "safe" | "unsafe". Matches RebaseResult::MODE_*
  // in src/shared/src/lib.rs.
  string mode = 2;
  // Number of clusters copied from the old chain into the
  // overlay (safe mode only; zero in unsafe mode).
  uint64 clusters_copied = 3;
  // Total bytes copied from the old chain into the overlay
  // (safe mode only; zero in unsafe mode).
  uint64 bytes_copied = 4;
  // Error code: 0 = ok, non-zero mirrors RebaseResult::ERROR_*
  // in src/shared/src/lib.rs.
  uint32 error = 5;
}

// Image commit result (from commit operation).
message CommitResultMessage {
  // Overlay format echoed back (e.g. "qcow2", "vmdk").
  string overlay_format = 1;
  // Backing format echoed back (e.g. "qcow2", "vmdk").
  string backing_format = 2;
  // Number of overlay clusters whose data was written into the
  // backing.
  uint64 clusters_committed = 3;
  // Total bytes written into the backing.
  uint64 bytes_committed = 4;
  // Number of overlay L2 entries cleared as part of the
  // overlay-clear pass.
  uint64 overlay_clusters_cleared = 5;
  // Error code: 0 = ok, non-zero mirrors CommitResult::ERROR_*
  // in src/shared/src/lib.rs.
  uint32 error = 6;
}

// Single coalesced map extent (from map operation). Sent once
// per emitted extent; followed by a MapResultMessage terminator
// after the last extent. The host accumulates these into the
// rendered human / JSON output in phase 4.
message MapExtentMessage {
  // Virtual offset of the extent's first byte.
  uint64 start = 1;
  // Extent length in bytes. Never zero.
  uint64 length = 2;
  // State: "hole" | "zero" | "data". Mirrors
  // MapExtentRecord::STATE_* in src/shared/src/lib.rs.
  string state = 3;
  // Source file offset; only meaningful when state == "data".
  // Host renderer omits the JSON field when state != "data".
  uint64 file_offset = 4;
}

// Map operation summary (sent after the last MapExtentMessage).
message MapResultMessage {
  // Source format echoed back (e.g. "raw", "qcow2", "vmdk",
  // "vhd", "vhdx").
  string source_format = 1;
  // Number of MapExtentMessage records sent during this
  // invocation. The host can sanity-check the receive count.
  uint64 extents_emitted = 2;
  // Virtual size of the source image, in bytes.
  uint64 virtual_size = 3;
  // Error code: 0 = ok, non-zero mirrors MapResult::ERROR_*
  // in src/shared/src/lib.rs (1=invalid_source, 2=invalid_option,
  // 3=has_backing, 4=io).
  uint32 error = 4;
}

// Single snapshot record (from the snapshot list mode). Sent
// once per snapshot, followed by a SnapshotResultMessage
// terminator after the last entry. The host renders these into
// the qemu-img-compatible column-aligned table or the
// instar-extension JSON array in PLAN-snapshot phase 4.
message SnapshotEntryMessage {
  // Snapshot ID (qemu's decimal string: "0", "1", ...).
  string id = 1;
  // Snapshot tag/name (UTF-8).
  string name = 2;
  // Location of the snapshot's L1 table on disk.
  uint64 l1_table_offset = 3;
  // Snapshot L1 size in entries.
  uint32 l1_size = 4;
  // Creation date split as qcow2 stores it on disk (two
  // big-endian u32s in the snapshot header).
  uint32 date_sec_hi = 5;
  uint32 date_sec_lo = 6;
  uint32 date_nsec = 7;
  // VM clock at snapshot creation (nanoseconds).
  uint64 vm_clock_nsec = 8;
  // 64-bit VM state size (qcow2 v3 extra-data offset 0).
  uint64 vm_state_size = 9;
  // Virtual disk size at snapshot creation (qcow2 v3 extra-data
  // offset 8).
  uint64 disk_size = 10;
  // qemu record/replay icount; u64::MAX means absent (matches
  // SnapshotEntryRecord::ICOUNT_ABSENT in src/shared/src/lib.rs).
  uint64 icount = 11;
  // Length of the source extra-data section; reported for
  // forward-compat diagnostics.
  uint32 extra_data_size = 12;
}

// Snapshot operation summary (sent after the last
// SnapshotEntryMessage, or as the only message for the mutating
// modes).
message SnapshotResultMessage {
  // Echo of the requested mode (0=list, 1=apply, 2=create,
  // 3=delete). Mirrors SnapshotConfig::MODE_* in
  // src/shared/src/lib.rs.
  uint32 mode = 1;
  // Error code: 0 = ok, non-zero mirrors
  // SnapshotResult::ERROR_* in src/shared/src/lib.rs.
  uint32 error = 2;
  // Number of SnapshotEntryMessage records emitted (list
  // mode only; 0 otherwise).
  uint32 snapshots_emitted = 3;
  // Auto-assigned snapshot ID returned by MODE_CREATE; empty
  // string for the other modes.
  string assigned_id = 4;
}

// Main message wrapper with level and payload
message GuestMessage {
  Level level = 1;
  oneof payload {
    InitMessage init = 2;
    CapacityMessage capacity = 3;
    ProgressMessage progress = 4;
    ErrorMessage error = 5;
    CompleteMessage complete = 6;
    InfoResultMessage info_result = 7;
    CheckResultMessage check_result = 8;
    CompareResultMessage compare_result = 9;
    MeasureResultMessage measure_result = 10;
    CreateResultMessage create_result = 11;
    ResizeResultMessage resize_result = 12;
    RebaseResultMessage rebase_result = 13;
    CommitResultMessage commit_result = 14;
    MapExtentMessage map_extent = 15;
    MapResultMessage map_result = 16;
    SnapshotEntryMessage snapshot_entry = 17;
    SnapshotResultMessage snapshot_result = 18;
  }
}
