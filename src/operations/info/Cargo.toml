[package]
name = "info"
version = "0.3.0"
edition = "2021"
description = "Info operation: detect image format and report metadata"
license = "Apache-2.0"
publish = false

[dependencies]
shared = { path = "../../shared" }
qcow2 = { path = "../../crates/qcow2" }
qcow1 = { path = "../../crates/qcow1" }
raw = { path = "../../crates/raw" }
vmdk = { path = "../../crates/vmdk" }
luks = { path = "../../crates/luks", features = ["decrypt", "kdf-argon2"] }
# Both are used only to report a differencing image's parent. VHDX reuses
# crates/vhdx's staging/decoding pipeline (`parse_metadata`,
# `VhdxParentLocatorState`); VHD reuses crates/vhd's `VhdDynamicHeader::parse`
# for its `cxsparse` cookie check and its DYN_* offsets. Neither is
# re-derived locally: an `info` that decodes a header the parser crates would
# have rejected is exactly how untrusted bytes reach a user-facing field.
vhd = { path = "../../crates/vhd" }
vhdx = { path = "../../crates/vhdx" }

# Argon2 crate still needed directly for Block type in memory allocation
argon2 = { version = "0.6", default-features = false }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true

[lints]
workspace = true
