[package]
name = "info"
version = "0.3.0"
edition = "2021"
description = "Info operation: detect image format and report metadata"
license = "Apache-2.0"
publish = false

[dependencies]
shared = { path = "../../shared" }
qcow2 = { path = "../../crates/qcow2" }
qcow1 = { path = "../../crates/qcow1" }
raw = { path = "../../crates/raw" }
vmdk = { path = "../../crates/vmdk" }
luks = { path = "../../crates/luks", features = ["decrypt", "kdf-argon2"] }
# Used only to detect a differencing VHDX's parent locator (`parse_metadata`,
# `VhdxParentLocatorState`), reusing crates/vhdx's staging/decoding pipeline
# rather than re-deriving it locally. `info` still does not link `crates/vhd`
# -- the VHD side is small enough to parse locally, see
# src/operations/info/src/main.rs's VHD_DYN_* constants. See
# docs/plans/PLAN-differencing-phase-04-read-policy.md decision 4.
vhdx = { path = "../../crates/vhdx" }

# Argon2 crate still needed directly for Block type in memory allocation
argon2 = { version = "0.6", default-features = false }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true

[lints]
workspace = true
