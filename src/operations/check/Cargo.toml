[package]
name = "check-op"
version = "0.3.0"
edition = "2021"
description = "Check operation: validate image structural integrity"
license = "Apache-2.0"
publish = false

[[bin]]
name = "check"
path = "src/main.rs"

[dependencies]
shared = { path = "../../shared" }
check = { path = "../../crates/check", default-features = false }
qcow2 = { path = "../../crates/qcow2" }
vmdk = { path = "../../crates/vmdk" }
vhd = { path = "../../crates/vhd" }
vhdx = { path = "../../crates/vhdx" }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true

[lints]
workspace = true
