[package]
name = "convert"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[dependencies]
shared = { path = "../../shared" }
qcow2 = { path = "../../crates/qcow2", features = ["decompress", "decompress-zstd", "compress", "aes-decrypt", "luks-decrypt", "vmdk-decompress", "vhd-input", "vhdx-input"] }
vmdk = { path = "../../crates/vmdk" }
vhd = { path = "../../crates/vhd" }
vhdx = { path = "../../crates/vhdx" }

# RustCrypto crates for LUKS-in-QCOW2 key derivation (crypt_method=2)
aes = { version = "0.8", default-features = false }
xts-mode = { version = "0.5", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = { version = "0.12", default-features = false }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
