[package]
name = "convert"
version = "0.2.0"
edition = "2021"
description = "Convert operation: transform between disk image formats"
license = "Apache-2.0"
publish = false

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[dependencies]
shared = { path = "../../shared" }
qcow2 = { path = "../../crates/qcow2", features = [
    "decompress", "decompress-zstd", "compress", "aes-decrypt",
    "luks-decrypt", "vmdk-decompress", "vhd-input", "vhdx-input",
    "vdi-input",
] }
vmdk = { path = "../../crates/vmdk" }
vhd = { path = "../../crates/vhd" }
vhdx = { path = "../../crates/vhdx" }
luks = { path = "../../crates/luks", features = ["decrypt", "encrypt", "kdf-argon2"] }

# Argon2 crate still needed directly for Block type in memory allocation
argon2 = { version = "0.5", default-features = false }

[lints]
workspace = true
