[package]
name = "commit-op"
version = "0.3.0"
edition = "2021"
description = "Commit operation: merge overlay clusters into the backing image"
license = "Apache-2.0"
publish = false

[[bin]]
name = "commit"
path = "src/main.rs"

[dependencies]
shared = { path = "../../shared" }
commit = { path = "../../crates/commit" }
qcow2 = { path = "../../crates/qcow2", features = ["create"] }
qcow2-write = { path = "../../crates/qcow2-write" }
qcow2-write-exec = { path = "../../crates/qcow2-write-exec" }
vmdk = { path = "../../crates/vmdk" }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true

[lints]
workspace = true
