[package]
name = "rebase-op"
version = "0.3.0"
edition = "2021"
description = "Rebase operation: change overlay's backing-file reference"
license = "Apache-2.0"
publish = false

[[bin]]
name = "rebase"
path = "src/main.rs"

[dependencies]
shared = { path = "../../shared" }
rebase = { path = "../../crates/rebase" }
qcow2 = { path = "../../crates/qcow2", features = ["create", "vdi-input", "parallels-input", "qcow1-input", "dmg-input"] }
qcow2-write = { path = "../../crates/qcow2-write" }
qcow2-write-exec = { path = "../../crates/qcow2-write-exec" }
vmdk = { path = "../../crates/vmdk" }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true

[lints]
workspace = true
