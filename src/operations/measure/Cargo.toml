[package]
name = "measure-op"
version = "0.2.0"
edition = "2021"
description = "Measure operation: predict output file size for a target format"
license = "Apache-2.0"
publish = false

[[bin]]
name = "measure"
path = "src/main.rs"

[dependencies]
shared = { path = "../../shared" }
measure = { path = "../../crates/measure" }
qcow2 = { path = "../../crates/qcow2" }
raw = { path = "../../crates/raw" }
vmdk = { path = "../../crates/vmdk" }
vhd = { path = "../../crates/vhd" }
vhdx = { path = "../../crates/vhdx" }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true

[lints]
workspace = true
