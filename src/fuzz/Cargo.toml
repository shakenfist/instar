[package]
name = "instar-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
shared = { path = "../shared" }
qcow2 = { path = "../crates/qcow2", features = ["decompress", "decompress-zstd"] }
vmdk = { path = "../crates/vmdk", features = ["decompress"] }
vhd = { path = "../crates/vhd" }
vhdx = { path = "../crates/vhdx" }
vdi = { path = "../crates/vdi" }
raw = { path = "../crates/raw" }
luks = { path = "../crates/luks" }
measure = { path = "../crates/measure" }
create = { path = "../crates/create" }
resize = { path = "../crates/resize" }
rebase = { path = "../crates/rebase" }
commit = { path = "../crates/commit" }
snapshot = { path = "../crates/snapshot" }
check = { path = "../crates/check" }
amend = { path = "../crates/amend" }
bitmap = { path = "../crates/bitmap" }
dd = { path = "../crates/dd" }
bench = { path = "../crates/bench" }
qcow2-write = { path = "../crates/qcow2-write", features = ["sim"] }

[profile.release]
debug = true

# Buffer-based targets (no CallTable needed)

[[bin]]
name = "fuzz_format_detect"
path = "fuzz_targets/fuzz_format_detect.rs"
doc = false
test = false

