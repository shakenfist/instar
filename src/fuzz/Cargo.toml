[package]
name = "instar-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
shared = { path = "../shared" }
qcow2 = { path = "../crates/qcow2", features = ["decompress", "decompress-zstd"] }
vmdk = { path = "../crates/vmdk", features = ["decompress"] }
vhd = { path = "../crates/vhd" }
vhdx = { path = "../crates/vhdx" }
raw = { path = "../crates/raw" }
luks = { path = "../crates/luks" }
measure = { path = "../crates/measure" }
create = { path = "../crates/create" }
resize = { path = "../crates/resize" }
rebase = { path = "../crates/rebase" }
commit = { path = "../crates/commit" }

[profile.release]
debug = true

# Buffer-based targets (no CallTable needed)

[[bin]]
name = "fuzz_format_detect"
path = "fuzz_targets/fuzz_format_detect.rs"
doc = false
test = false

[[bin]]
name = "fuzz_qcow2_header"
path = "fuzz_targets/fuzz_qcow2_header.rs"
doc = false
test = false

