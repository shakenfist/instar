[package]
name = "instar"
version = "0.2.0"
edition = "2021"
description = "Safe, sandboxed disk image operations using KVM isolation"
license = "Apache-2.0"
repository = "https://github.com/shakenfist/instar"
homepage = "https://github.com/shakenfist/instar"
readme = "../../README.md"
authors = ["Michael Still <mikal@stillhq.com>"]
keywords = ["disk-image", "qcow2", "kvm", "vmdk", "vhd"]
categories = ["command-line-utilities", "virtualization"]

[[bin]]
name = "instar"
path = "src/main.rs"

[dependencies]
kvm-ioctls = "0.25"
kvm-bindings = "0.14"
vm-memory = { version = "0.18", features = ["backend-mmap"] }
virtio-queue = "0.18"
virtio-bindings = "0.2"
vmm-sys-util = "0.15"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
guest-protocol = { path = "../../crates/guest-protocol", features = ["std"] }
shared = { path = "../shared" }
vmdk = { path = "../crates/vmdk" }
qcow2 = { path = "../crates/qcow2" }
dd = { path = "../crates/dd" }
bench = { path = "../crates/bench" }
vhd = { path = "../crates/vhd" }
vhdx = { path = "../crates/vhdx" }
toml = "1.0"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
rand = "0.10"

[dev-dependencies]
tempfile = "3"

# Debian package metadata. The binary lives at /usr/bin/instar and the
# six guest .bin files (loaded into KVM at runtime) live in the private
# libdir /usr/lib/instar/. The runtime resolver in src/main.rs probes
# the executable directory first (developer mode) and falls back to
# /usr/lib/instar/, so both layouts work without code changes per
# install.
#
# Built with `cargo deb --no-build -p instar` from the workspace root
# (src/) after `make instar` has produced the binaries. $auto scans
# the VMM binary's NEEDED entries to populate runtime dependencies.
[package.metadata.deb]
maintainer = "Michael Still <mikal@stillhq.com>"
section = "otherosfs"
priority = "optional"
depends = "$auto"
extended-description = """\
instar performs disk image operations (info, copy, check, compare,
convert) inside a KVM-sandboxed guest. The host-side VMM is isolated
from format-parsing code by the hardware virtualization boundary,
limiting the impact of bugs in qcow2/vmdk/vhd/vhdx/luks parsers.
Supports raw, QCOW2, VMDK, VHD, VHDX, and LUKS inputs.
"""
assets = [
    ["target/release/instar", "usr/bin/", "755"],
    ["target/release/core.bin", "usr/lib/instar/", "644"],
    ["target/release/info.bin", "usr/lib/instar/", "644"],
    ["target/release/copy.bin", "usr/lib/instar/", "644"],
    ["target/release/check.bin", "usr/lib/instar/", "644"],
    ["target/release/compare.bin", "usr/lib/instar/", "644"],
    ["target/release/convert.bin", "usr/lib/instar/", "644"],
    ["../../README.md", "usr/share/doc/instar/README", "644"],
    ["../../LICENSE", "usr/share/doc/instar/copyright", "644"],
]

# RPM package metadata. Same layout as the .deb. auto-req = "auto"
# (the cargo-generate-rpm default) uses ldd-based detection on the
# VMM binary to populate Requires entries.
[package.metadata.generate-rpm]
auto-req = "auto"
assets = [
    { source = "target/release/instar",      dest = "/usr/bin/instar",            mode = "0755" },
    { source = "target/release/core.bin",    dest = "/usr/lib/instar/core.bin",   mode = "0644" },
    { source = "target/release/info.bin",    dest = "/usr/lib/instar/info.bin",   mode = "0644" },
    { source = "target/release/copy.bin",    dest = "/usr/lib/instar/copy.bin",   mode = "0644" },
    { source = "target/release/check.bin",   dest = "/usr/lib/instar/check.bin",  mode = "0644" },
    { source = "target/release/compare.bin", dest = "/usr/lib/instar/compare.bin", mode = "0644" },
    { source = "target/release/convert.bin", dest = "/usr/lib/instar/convert.bin", mode = "0644" },
    { source = "../../README.md", dest = "/usr/share/doc/instar/README",    mode = "0644" },
    { source = "../../LICENSE",   dest = "/usr/share/doc/instar/copyright", mode = "0644" },
]
