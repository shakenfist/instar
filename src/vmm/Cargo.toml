[package]
name = "instar"
version = "0.3.0"
edition = "2021"
description = "Safe, sandboxed disk image operations using KVM isolation"
license = "Apache-2.0"
repository = "https://github.com/shakenfist/instar"
homepage = "https://github.com/shakenfist/instar"
readme = "../../README.md"
authors = ["Michael Still <mikal@stillhq.com>"]
keywords = ["disk-image", "qcow2", "kvm", "vmdk", "vhd"]
categories = ["command-line-utilities", "virtualization"]

[[bin]]
name = "instar"
path = "src/main.rs"

[dependencies]
kvm-ioctls = "0.25"
kvm-bindings = "0.14"
vm-memory = { version = "0.18", features = ["backend-mmap"] }
virtio-queue = "0.18"
virtio-bindings = "0.2"
vmm-sys-util = "0.15"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
guest-protocol = { path = "../../crates/guest-protocol", features = ["std"] }
shared = { path = "../shared" }
vmdk = { path = "../crates/vmdk" }
qcow2 = { path = "../crates/qcow2" }
dd = { path = "../crates/dd" }
bench = { path = "../crates/bench" }
vhd = { path = "../crates/vhd" }
vhdx = { path = "../crates/vhdx" }
toml = "1.0"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
rand = "0.10"

[dev-dependencies]
tempfile = "3"

# Debian package metadata. The binary lives at /usr/bin/instar and the
# six guest .bin files (loaded into KVM at runtime) live in the private
# libdir /usr/lib/instar/. The runtime resolver in src/main.rs probes
# the executable directory first (developer mode) and falls back to
# /usr/lib/instar/, so both layouts work without code changes per
# install.
#
# Built with `cargo deb --no-build -p instar` from the workspace root
# (src/) after `make instar` has produced the binaries. $auto scans
# the VMM binary's NEEDED entries to populate runtime dependencies.
[package.metadata.deb]
maintainer = "Michael Still <mikal@stillhq.com>"
section = "otherosfs"
priority = "optional"
depends = "$auto"
extended-description = """\
instar performs disk image operations (info, check, compare, convert,
create, resize, rebase, commit, map, measure, snapshot, amend, dd,
bitmap, bench, copy) inside a KVM-sandboxed guest. The host-side VMM
is isolated from format-parsing code by the hardware virtualization
boundary, limiting the impact of bugs in the format parsers. Reads
raw, QCOW2, QCOW1, VMDK, VHD, VHDX, VDI, Parallels, DMG, and LUKS
images.
"""
assets = [
    ["target/release/instar", "usr/bin/", "755"],
    ["target/release/core.bin", "usr/lib/instar/", "644"],
    ["target/release/amend.bin", "usr/lib/instar/", "644"],
    ["target/release/bench.bin", "usr/lib/instar/", "644"],
    ["target/release/bitmap.bin", "usr/lib/instar/", "644"],
    ["target/release/check.bin", "usr/lib/instar/", "644"],
    ["target/release/commit.bin", "usr/lib/instar/", "644"],
    ["target/release/compare.bin", "usr/lib/instar/", "644"],
    ["target/release/convert.bin", "usr/lib/instar/", "644"],
    ["target/release/copy.bin", "usr/lib/instar/", "644"],
    ["target/release/create.bin", "usr/lib/instar/", "644"],
    ["target/release/info.bin", "usr/lib/instar/", "644"],
    ["target/release/map.bin", "usr/lib/instar/", "644"],
    ["target/release/measure.bin", "usr/lib/instar/", "644"],
    ["target/release/rebase.bin", "usr/lib/instar/", "644"],
    ["target/release/resize.bin", "usr/lib/instar/", "644"],
    ["target/release/snapshot.bin", "usr/lib/instar/", "644"],
    ["../../README.md", "usr/share/doc/instar/README", "644"],
    ["../../LICENSE", "usr/share/doc/instar/copyright", "644"],
]

# RPM package metadata. Same layout as the .deb. auto-req = "auto"
# populates Requires from the VMM binary, but "auto" is two different
# implementations: it uses /usr/lib/rpm/find-requires when that exists
# and otherwise falls back to a builtin `ldd -v` parser that mangles
# WEAK version references into uninstallable "[WEAK]" dependencies. The
# build image therefore installs rpm so the first path is always taken
# -- do not drop it. See docs/development.md, "RPM dependency
# generation".
[package.metadata.generate-rpm]
auto-req = "auto"
assets = [
    { source = "target/release/instar",       dest = "/usr/bin/instar",             mode = "0755" },
    { source = "target/release/core.bin",     dest = "/usr/lib/instar/core.bin",    mode = "0644" },
    { source = "target/release/amend.bin",    dest = "/usr/lib/instar/amend.bin",   mode = "0644" },
    { source = "target/release/bench.bin",    dest = "/usr/lib/instar/bench.bin",   mode = "0644" },
    { source = "target/release/bitmap.bin",   dest = "/usr/lib/instar/bitmap.bin",  mode = "0644" },
    { source = "target/release/check.bin",    dest = "/usr/lib/instar/check.bin",   mode = "0644" },
    { source = "target/release/commit.bin",   dest = "/usr/lib/instar/commit.bin",  mode = "0644" },
    { source = "target/release/compare.bin",  dest = "/usr/lib/instar/compare.bin", mode = "0644" },
    { source = "target/release/convert.bin",  dest = "/usr/lib/instar/convert.bin", mode = "0644" },
    { source = "target/release/copy.bin",     dest = "/usr/lib/instar/copy.bin",    mode = "0644" },
    { source = "target/release/create.bin",   dest = "/usr/lib/instar/create.bin",  mode = "0644" },
    { source = "target/release/info.bin",     dest = "/usr/lib/instar/info.bin",    mode = "0644" },
    { source = "target/release/map.bin",      dest = "/usr/lib/instar/map.bin",     mode = "0644" },
    { source = "target/release/measure.bin",  dest = "/usr/lib/instar/measure.bin", mode = "0644" },
    { source = "target/release/rebase.bin",   dest = "/usr/lib/instar/rebase.bin",  mode = "0644" },
    { source = "target/release/resize.bin",   dest = "/usr/lib/instar/resize.bin",  mode = "0644" },
    { source = "target/release/snapshot.bin", dest = "/usr/lib/instar/snapshot.bin", mode = "0644" },
    { source = "../../README.md", dest = "/usr/share/doc/instar/README",    mode = "0644" },
    { source = "../../LICENSE",   dest = "/usr/share/doc/instar/copyright", mode = "0644" },
]

[lints]
workspace = true
