[package]
name = "instar-fetch"
version = "0.3.0"
edition = "2021"
description = "Serves the bytes of one already-open file to instar over the fetch protocol"
license = "Apache-2.0"
repository = "https://github.com/shakenfist/instar"
authors = ["Michael Still <mikal@stillhq.com>"]
keywords = ["ipc", "seqpacket", "disk-image"]
categories = ["os::unix-apis"]
# Not published to crates.io: it is instar's own helper, not a library.
publish = false

# The wire format, and libc for the syscalls and kernel types std does
# not expose -- the confinement calls among them. Nothing else: this process is the untrusted half of the
# partition, and every dependency it takes is code running next to the
# bytes an attacker controls.
[dependencies]
fetch-protocol = { path = "../crates/fetch-protocol" }
libc = "0.2"

# Test-only, and not linked into the shipped binary: a temporary file with a
# random name created `O_EXCL`, which the rest of the suite already uses.
[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
