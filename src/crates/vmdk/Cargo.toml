[package]
name = "vmdk"
version = "0.1.0"
edition = "2021"
description = "VMDK format parsing for bare-metal guest operations"
license = "Apache-2.0"
repository = "https://github.com/shakenfist/imago"
authors = ["Michael Still <mikal@stillhq.com>"]
keywords = ["vmdk", "disk-image", "no-std", "parser"]
categories = ["no-std", "parser-implementations"]

[features]
decompress = ["miniz_oxide"]

[dependencies]
shared = { path = "../../shared" }
miniz_oxide = { version = "0.8", default-features = false, optional = true }

[lib]
# No std, this is used by bare-metal code
