[package]
name = "dmg"
version = "0.1.0"
edition = "2021"
description = "DMG (Apple UDIF) disk image format parsing for bare-metal guest operations"
license = "Apache-2.0"
repository = "https://github.com/shakenfist/instar"
authors = ["Michael Still <mikal@stillhq.com>"]
keywords = ["dmg", "udif", "disk-image", "no-std", "parser"]
categories = ["no-std", "parser-implementations"]
