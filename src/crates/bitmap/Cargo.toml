[package]
name = "bitmap"
version = "0.1.0"
edition = "2021"
description = "Pure planner crate for qcow2 persistent dirty bitmap mutator primitives (no I/O)"
license = "Apache-2.0"
publish = false

[dependencies]
shared = { path = "../../shared" }
qcow2  = { path = "../qcow2", default-features = false }
snapshot = { path = "../snapshot" }

[dev-dependencies]
shared = { path = "../../shared" }
qcow2  = { path = "../qcow2", default-features = false }
snapshot = { path = "../snapshot" }

[lints]
workspace = true
