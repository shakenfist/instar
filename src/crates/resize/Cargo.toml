[package]
name = "resize"
version = "0.3.0"
edition = "2021"
description = "Plan in-place metadata mutations to resize disk images (no I/O)"
license = "Apache-2.0"
publish = false

[dependencies]
shared   = { path = "../../shared" }
qcow2    = { path = "../qcow2", features = ["create"], default-features = false }
snapshot = { path = "../snapshot" }
vhd      = { path = "../vhd", default-features = false }
vhdx     = { path = "../vhdx", default-features = false }
vmdk     = { path = "../vmdk", default-features = false }

[dev-dependencies]
create = { path = "../create" }
qcow2  = { path = "../qcow2", features = ["create"], default-features = false }
shared = { path = "../../shared" }
vhd    = { path = "../vhd", default-features = false }
vhdx   = { path = "../vhdx", default-features = false }
vmdk   = { path = "../vmdk", default-features = false }

[lints]
workspace = true
