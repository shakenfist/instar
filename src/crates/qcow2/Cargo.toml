[package]
name = "qcow2"
version = "0.2.0"
edition = "2021"
description = "QCOW2 format parsing for bare-metal guest operations"
license = "Apache-2.0"
repository = "https://github.com/shakenfist/instar"
authors = ["Michael Still <mikal@stillhq.com>"]
keywords = ["qcow2", "disk-image", "no-std", "parser"]
categories = ["no-std", "parser-implementations"]
# Not published to crates.io: internal to instar's bare-metal sandbox.
publish = false

[features]
decompress = ["miniz_oxide"]
decompress-zstd = ["ruzstd"]
compress = ["miniz_oxide", "miniz_oxide/with-alloc"]
aes-decrypt = ["aes"]
luks-decrypt = ["aes", "xts-mode"]
vmdk-input = ["vmdk"]
vmdk-decompress = ["vmdk-input", "vmdk/decompress"]
vhd-input = ["vhd"]
vhdx-input = ["vhdx"]
vdi-input = ["vdi"]
parallels-input = ["parallels"]
# QCOW1 read support pulls in the qcow1 parser crate and the `decompress`
# feature: the reader arm inflates compressed (raw-DEFLATE) clusters via
# miniz_oxide, the same dependency the qcow2 `decompress` feature provides.
qcow1-input = ["dep:qcow1", "decompress"]
# DMG (Apple UDIF) read support pulls in the dmg parser crate and the
# `decompress` feature: the reader arm inflates zlib-WRAPPED (UDZO) chunks
# via miniz_oxide, the same dependency the qcow2 `decompress` feature
# provides.
dmg-input = ["dep:dmg", "decompress"]
create = []

[dependencies]
shared = { path = "../../shared" }
miniz_oxide = { version = "0.9", default-features = false, optional = true }
ruzstd = { version = "0.8", default-features = false, optional = true }
aes = { version = "0.9", default-features = false, optional = true }
xts-mode = { version = "0.6", default-features = false, optional = true }
vmdk = { path = "../vmdk", optional = true }
vhd = { path = "../vhd", optional = true }
vhdx = { path = "../vhdx", optional = true }
vdi = { path = "../vdi", optional = true }
parallels = { path = "../parallels", optional = true }
qcow1 = { path = "../qcow1", optional = true }
dmg = { path = "../dmg", optional = true }

# Tests only: the qcow1-input compressed-cluster arm test builds a real
# raw-DEFLATE blob with miniz_oxide's compressor (`with-alloc`). The guest
# binaries never see this — dev-dependencies do not affect the lib or its
# downstream consumers, so the shipped decompress feature stays no-alloc.
[dev-dependencies]
miniz_oxide = { version = "0.9", features = ["with-alloc"] }

[lib]
# No std, this is used by bare-metal code

[lints]
workspace = true
