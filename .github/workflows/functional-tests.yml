name: Functional Tests

on:
  # Deliberately NO `paths:` filter on any trigger. This workflow
  # produces the `Can enqueue` and `Can merge` contexts that branch
  # protection requires, and a required check is only satisfied by a
  # check that *reports*. A trigger-level `paths:` filter does not make
  # the check skip -- it stops the workflow running at all, so the
  # context never appears and GitHub leaves it Pending forever. That is
  # a permanent block, not a skip. (A skipped *job* reports success,
  # which is why `can_merge` skipping on pull requests is fine; a
  # workflow that never runs is a different thing entirely.)
  #
  # Docs-only changes are cheap instead of untested: the `check_paths`
  # job below computes whether any code changed, and the expensive jobs
  # gate on its output. They skip, `can_enqueue` still reports, and the
  # PR is mergeable.
  pull_request:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read
  pull-requests: write
  issues: write

# What runs where, and why.
#
# Pull requests run the jobs below against the in-tree build: the
# partition guard, build-and-test, package-smoke, the three integration
# jobs, and the snapshot harnesses.
#
# The merge queue runs `package-build` + `package-matrix` (and the
# `can_merge` gate), and NOT the PR integration jobs. That is a coverage
# argument, not just a cost one: every matrix entry runs the *full*
# Python suite against the installed package on its own distro, using
# that distro's qemu-img as the oracle. So the queue's coverage is a
# superset of the PR integration jobs, on seven distros instead of one.
# Re-running the PR jobs in the queue would buy a second copy of a
# strictly weaker signal. build-and-test is the deliberate exception --
# it runs in both as the cheap fast-fail, and package-build needs it.
#
# Orthogonally, every expensive job also gates on check_paths, so a
# docs-only pull request skips them all and is gated only by the
# aggregates.
#
# If you are here to "fix" the gating so everything runs everywhere,
# read docs/plans/PLAN-distro-matrix-ci-phase-04-workflow.md first.
jobs:
  # Detect docs-only changes so the heavy jobs can skip them. This
  # replaces the trigger-level `paths:` filter this workflow used to
  # carry -- see the comment on `on:` for why that filter was a merge
  # blocker once `Can enqueue` became a required check.
  #
  # For anything other than a pull request the filter step is skipped
  # and the output falls back to `code_changed=true`, so the merge queue
  # and manual dispatches always run everything. A merge group that
  # contains only docs therefore still pays for the matrix; that is the
  # safe direction, and cheap to revisit if it proves annoying.
  check_paths:
    name: "Check paths"
    runs-on: [self-hosted, static]
    timeout-minutes: 10
    outputs:
      code_changed: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # By default a file matches if it matches ANY listed pattern,
          # which makes '**' match everything and silently defeats the
          # exclusions. 'every' requires a file to match ALL patterns,
          # which is the correct semantics for "everything except docs".
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!.github/exported-config/**'

  # Guards over CI's own tooling: cheap enough (pure Python, bash and
  # jq -- no /dev/kvm, no testdata, no build) to share one small runner
  # and give fast feedback.
  #
  # The partition check asserts every Python integration test is claimed
  # by at least one of the integration jobs below, so a test module
  # cannot silently drop out of CI -- e.g. if integration-core's
  # exclude-list were ever refactored into an include-list. See
  # tools/ci/check-test-partition.py.
  #
  # The coverage-fuzz helpers only run when a target actually crashes,
  # so nothing else here exercises them -- which is how they managed to
  # break every nightly fuzz run for a month. See "Crash reporting" in
  # docs/testing.md.
  ci-tooling:
    name: "CI tooling guards"
    needs: check_paths
    if: >-
      github.event_name == 'pull_request'
      && needs.check_paths.outputs.code_changed != 'false'
    runs-on: [self-hosted, debian-12, s]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Ensure Python venv support
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-pip

      - name: Ensure jq is available
        run: command -v jq || sudo apt-get install -y jq

      - name: Check CI test partition
        run: tools/ci/check-test-partition.sh

      # Steps of this job rather than a job of their own: together they
      # take under two seconds, and a separate job would claim a second
      # runner slot and repeat the checkout and the apt refresh to run
      # them.
      - name: Test the fuzz crash reporter
        run: tools/ci/test-report-fuzz-crash.sh

      - name: Test the fuzz artifact picker
        run: tools/ci/test-pick-fuzz-artifact.sh

      - name: Test the glibc floor check
        run: tools/ci/test-check-glibc-floor.sh

      - name: Test the autofix stager
        run: tools/ci/test-stage-autofix-changes.sh

  build-and-test:
    needs: check_paths
    if: needs.check_paths.outputs.code_changed != 'false'
    runs-on: [self-hosted, debian-12, s]
    timeout-minutes: 30

    env:
      DOCKER_BUILDKIT: 1
      # Limit parallelism to reduce memory usage (s worker has 4GB RAM)
      CARGO_BUILD_JOBS: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo chmod 666 /var/run/docker.sock

      - name: Remove previous devcontainers, if any
        run: |
          docker image rm -f instar-build instar-release 2>/dev/null || true

      - name: Build and test via devcontainer
        run: |
          # Build the dev/test image (the cargo test steps below run in
          # it) and the release binary. make instar builds the release
          # image (instar-release); make instar-devcontainer builds the
          # dev/test image (instar-build) the docker-run steps use.
          make instar
          # Immediately, before anything else can touch the binary. The
          # cargo test run below builds bin targets into the same
          # src/target/release/ from the dev image, so checking after it
          # would risk reading a binary that image relinked and blaming
          # the release Dockerfile for it.
          tools/ci/check-glibc-floor.sh
          make instar-devcontainer
          # Run unit tests inside the container (all workspace crates
          # except no_main guest binaries)
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/build \
            -e CARGO_HOME=/build/.cargo \
            -e CARGO_BUILD_JOBS=2 \
            -v "$(pwd):/workspace" \
            -v "$(pwd)/.cargo-cache/registry:/build/.cargo/registry" \
            -v "$(pwd)/.cargo-cache/git:/build/.cargo/git" \
            -w "/workspace/src" \
            instar-build \
            cargo test --release --workspace \
              --exclude core \
              --exclude info \
              --exclude copy \
              --exclude check-op \
              --exclude compare \
              --exclude convert \
              --exclude measure-op \
              --exclude create-op \
              --exclude resize-op \
              --exclude rebase-op \
              --exclude commit-op \
              --exclude map-op \
              --exclude snapshot-op \
              --exclude amend-op \
              --exclude bitmap-op \
              --exclude bench-op

      - name: Check devcontainer Rust nightly pins agree
        run: tools/ci/check-nightly-pins.sh

      - name: Feature-gated crate tests in container
        # Mirrors the feature-gated tail of the Makefile's test-rust
        # target (luks crypto, qcow2 create, the qcow2 chain-reader
        # arms, the create crate) -- the workspace invocation above
        # runs default features only and silently skips all of them.
        run: tools/ci/rust-feature-tests.sh

      - name: Test config commands in container
        run: |
          # Run all config tests inside the container to avoid glibc mismatch
          docker run --rm \
            -v "$(pwd):/workspace" \
            -w "/workspace" \
            instar-build \
            bash -c '
              set -e

              # Setup system config directory
              mkdir -p /etc/instar
              cat > /etc/instar/config << EOF
          # System-wide instar configuration for CI testing

          [global]
          verbose = false
          output = "human"

          [security]
          backing-path-allowlist = [
              "\$IMAGE_DIR",
              "/var/lib/libvirt/images",
          ]
          max-chain-depth = 16

          [convert]
          sparse = true
          progress = false

          [copy]
          skip-zeros = false
          verify = false
          EOF

              # Setup user config directory
              mkdir -p ~/.config/instar
              cat > ~/.config/instar/config << EOF
          # User instar configuration for CI testing

          [global]
          verbose = true

          [security]
          backing-path-allowlist = [
              "\$IMAGE_DIR",
              "\$CWD",
              "/tmp/test-images",
          ]

          [copy]
          skip-zeros = true
          EOF

              echo "=== Testing: instar config ==="
              ./src/target/release/instar config

              echo ""
              echo "=== Testing: instar config --show-sources ==="
              ./src/target/release/instar config --show-sources

              echo ""
              echo "=== Testing: instar config --validate ==="
              ./src/target/release/instar config --validate

              echo ""
              echo "=== Verifying config layering ==="
              OUTPUT=$(./src/target/release/instar config --show-sources)

              # Verify verbose=true comes from user config (overrides system false)
              if echo "$OUTPUT" | grep -q "verbose = true.*~/.config/instar/config"; then
                echo "PASS: User config overrides system config for verbose"
              else
                echo "FAIL: Expected verbose=true from user config"
                echo "$OUTPUT"
                exit 1
              fi

              # Verify backing-path-allowlist comes from user config
              if echo "$OUTPUT" | grep -q "backing-path-allowlist.*~/.config/instar/config"; then
                echo "PASS: User config overrides system config for backing-path-allowlist"
              else
                echo "FAIL: Expected backing-path-allowlist from user config"
                echo "$OUTPUT"
                exit 1
              fi

              # Verify skip-zeros comes from user config
              if echo "$OUTPUT" | grep -q "skip-zeros = true.*~/.config/instar/config"; then
                echo "PASS: User config overrides system config for skip-zeros"
              else
                echo "FAIL: Expected skip-zeros=true from user config"
                echo "$OUTPUT"
                exit 1
              fi

              # Verify sparse comes from system config (not overridden by user)
              if echo "$OUTPUT" | grep -q "sparse = true.*/etc/instar/config"; then
                echo "PASS: System config value preserved when not overridden"
              else
                echo "FAIL: Expected sparse=true from system config"
                echo "$OUTPUT"
                exit 1
              fi

              echo "All layering tests passed!"

              echo ""
              echo "=== Testing invalid config detection ==="
              cat > /tmp/bad-config << EOF
          [global
          verbose = true
          EOF

              mv ~/.config/instar/config ~/.config/instar/config.bak
              cp /tmp/bad-config ~/.config/instar/config

              set +e
              ./src/target/release/instar config --validate
              EXIT_CODE=$?
              set -e

              mv ~/.config/instar/config.bak ~/.config/instar/config

              if [ $EXIT_CODE -ne 0 ]; then
                echo "PASS: Invalid config correctly detected"
              else
                echo "FAIL: Invalid config was not detected"
                exit 1
              fi

              echo ""
              echo "All config tests passed!"
            '

  # Smoke-test the .deb package: install in a clean Debian container,
  # verify the file layout, and exercise an actual KVM operation. This
  # catches packaging regressions (asset paths, runtime deps, mode
  # bits, the /usr/lib/instar/ resolver fallback) on every PR.
  #
  # Only the .deb on debian:trixie is exercised here. Broader distro
  # coverage (Ubuntu, Fedora, Rocky 9/10, .rpm) lives in the merge
  # queue matrix; see docs/plans/PLAN-distro-matrix-ci.md for the
  # full design.
  package-smoke:
    needs: [check_paths, build-and-test]
    if: >-
      github.event_name != 'merge_group'
      && needs.check_paths.outputs.code_changed != 'false'
    runs-on: [self-hosted, debian-12, xl]
    timeout-minutes: 30

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Docker and qemu-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io qemu-utils
          sudo systemctl start docker
          sudo chmod 666 /var/run/docker.sock

      - name: Remove previous devcontainers, if any
        run: |
          docker image rm -f instar-build instar-release 2>/dev/null || true

      - name: Build instar and the .deb package
        run: |
          make instar
          make deb

      - name: Run install smoke test on debian:trixie
        run: |
          tools/test-package-install.sh \
            src/target/debian/instar_*.deb \
            debian:trixie

  # Build the .deb and .rpm ONCE for the whole matrix below.
  #
  # This is only valid because the release binary is built on
  # debian:bullseye (glibc 2.31, symbol floor GLIBC_2.30), so a single
  # artifact set installs on every distro in the matrix -- down to Rocky
  # 9's glibc 2.34. That was the entire point of the build/dev container
  # split; see docs/plans/PLAN-distro-matrix-ci-phase-01-glibc-build.md.
  #
  # Consequence worth knowing when reading a red matrix: if an entry
  # fails while *installing* the package, that is a glibc-floor
  # regression in the build image, not a test failure.
  package-build:
    needs: build-and-test
    if: >-
      github.event_name == 'merge_group' ||
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, debian-12, xl]
    timeout-minutes: 45

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo chmod 666 /var/run/docker.sock

      - name: Remove previous devcontainers, if any
        run: |
          docker image rm -f instar-build instar-release 2>/dev/null || true

      - name: Build instar and both packages
        run: |
          make instar
          make package

      # Flatten both packages into one directory so the matrix entries
      # can glob with a fixed depth. resolve-package.sh also asserts
      # exactly one of each kind exists, which fails here rather than
      # seven times over in the matrix.
      - name: Stage packages
        run: |
          mkdir -p dist
          cp "$(tools/ci/resolve-package.sh deb)" dist/
          cp "$(tools/ci/resolve-package.sh rpm)" dist/
          ls -la dist/

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: instar-packages
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The distro matrix: install the shared package on each distro and run
  # the FULL Python suite against that distro's own qemu-img.
  #
  # No max-parallel. The xl runners are started on demand, so each entry
  # gets its own VM and the entries do not contend for KVM with each
  # other; capping the fan-out would only serialise independent VMs and
  # multiply merge-queue latency.
  package-matrix:
    needs: package-build
    if: >-
      github.event_name == 'merge_group' ||
      github.event_name == 'workflow_dispatch'
    name: "Matrix: ${{ matrix.distro.name }}"
    runs-on: [self-hosted, debian-12, xl]
    # Generous on purpose: the suite is ~3250 tests at concurrency 4 in
    # a container, and a timeout firing mid-suite is indistinguishable
    # from a flaky distro in the summary. Tighten once the first runs
    # give real numbers.
    timeout-minutes: 120
    # Quarantine hatch (master-plan flake policy): an entry that fails
    # twice consecutively for an established environmental reason gets
    # `allow_failure: true` added below, with a linked issue, and loses
    # it when that issue closes. Nothing is quarantined today.
    #
    # Sharp edge: continue-on-error makes the job report SUCCESS to the
    # `needs` context, so a quarantined entry stops gating merges
    # entirely -- it does not merely tolerate its own failure. Never
    # leave a flag behind after its issue is fixed.
    continue-on-error: ${{ matrix.distro.allow_failure }}

    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: 'Debian 12'
            image: 'debian:12'
            pkg_kind: 'deb'
            allow_failure: false
          - name: 'Debian 13'
            image: 'debian:13'
            pkg_kind: 'deb'
            allow_failure: false
          - name: 'Ubuntu 22.04'
            image: 'ubuntu:22.04'
            pkg_kind: 'deb'
            allow_failure: false
          - name: 'Ubuntu 24.04'
            image: 'ubuntu:24.04'
            pkg_kind: 'deb'
            allow_failure: false
          - name: 'Fedora latest'
            image: 'fedora:latest'
            pkg_kind: 'rpm'
            allow_failure: false
          - name: 'Rocky 9'
            image: 'rockylinux:9'
            pkg_kind: 'rpm'
            allow_failure: false
          # Rocky 10 is not in the Docker Official `rockylinux` library,
          # which stops at 9; it lives under the vendor namespace.
          - name: 'Rocky 10'
            image: 'rockylinux/rockylinux:10'
            pkg_kind: 'rpm'
            allow_failure: false

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout instar
        uses: actions/checkout@v7
        with:
          path: instar
          fetch-depth: 0

      - name: Prepare instar-testdata
        env:
          TESTDATA_TOKEN: ${{ secrets.GITLAB_TESTDATA_TOKEN }}
        run: ${GITHUB_WORKSPACE}/instar/tools/ci/prepare-testdata.sh

      - name: Resparsify test images
        run: |
          cd ${TESTDATA_PATH}
          find downloaded/ -type f \( \
            -name "*.qcow2" -o \
            -name "*.vmdk" -o \
            -name "*.vhd" -o \
            -name "*.vhdx" -o \
            -name "*.img" \
          \) -print0 | while IFS= read -r -d '' file; do
            cp --sparse=always "$file" "$file.sparse"
            mv "$file.sparse" "$file"
          done

      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo chmod 666 /var/run/docker.sock

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: instar-packages
          path: ${{ github.workspace }}/packages

      - name: Run the suite on ${{ matrix.distro.image }}
        env:
          PACKAGE_DIR: ${{ github.workspace }}/packages
          MATRIX_LOG: ${{ github.workspace }}/matrix.log
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          tools/ci/run-matrix-entry.sh \
            "${{ matrix.distro.name }}" \
            "${{ matrix.distro.image }}" \
            "${{ matrix.distro.pkg_kind }}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matrix-${{ matrix.distro.pkg_kind }}-${{ strategy.job-index }}-logs
          path: ${{ github.workspace }}/matrix.log
          retention-days: 7
          if-no-files-found: warn

  # Core integration tests: info, check, security, version-detection, oslo-crossval
  # These are fast (header-parsing only, no full image conversion)
  integration-core:
    needs: [check_paths, build-and-test]
    if: >-
      github.event_name != 'merge_group'
      && needs.check_paths.outputs.code_changed != 'false'
    runs-on: [self-hosted, debian-12, xl]
    timeout-minutes: 45

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout instar
        uses: actions/checkout@v7
        with:
          path: instar
          fetch-depth: 0

      - name: Prepare instar-testdata
        env:
          TESTDATA_TOKEN: ${{ secrets.GITLAB_TESTDATA_TOKEN }}
        run: ${GITHUB_WORKSPACE}/instar/tools/ci/prepare-testdata.sh

      - name: Resparsify test images
        run: |
          cd ${TESTDATA_PATH}
          find downloaded/ -type f \( \
            -name "*.qcow2" -o \
            -name "*.vmdk" -o \
            -name "*.vhd" -o \
            -name "*.vhdx" -o \
            -name "*.img" \
          \) -print0 | while IFS= read -r -d '' file; do
            cp --sparse=always "$file" "$file.sparse"
            mv "$file.sparse" "$file"
          done

      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo chmod 666 /var/run/docker.sock

      - name: Remove previous devcontainers, if any
        run: |
          docker image rm -f instar-build instar-release 2>/dev/null || true

      - name: Build instar
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          set +e
          make instar 2>&1 | tee ${GITHUB_WORKSPACE}/build-log.txt
          build_exit_code=${PIPESTATUS[0]}
          set -e
          if [ ${build_exit_code} -ne 0 ]; then
            echo "Build failed with exit code ${build_exit_code}"
            exit ${build_exit_code}
          fi

      - name: Run core integration tests
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          set +e
          make test-container-core TESTDATA_PATH=${TESTDATA_PATH} 2>&1 | tee ${GITHUB_WORKSPACE}/test-output.txt
          test_exit_code=${PIPESTATUS[0]}
          set -e
          if [ ${test_exit_code} -ne 0 ]; then
            echo "Core integration tests failed with exit code ${test_exit_code}"
            exit ${test_exit_code}
          fi

      - name: Test --chain flag (backing chain discovery)
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          TESTDATA=${TESTDATA_PATH}

          # Helper function to run instar and capture output regardless of exit code
          # We mount the entire release directory because instar needs core.bin and info.bin
          # in the same directory as the instar binary for chain discovery
          run_chain_test() {
            local image_path="$1"
            local mount_path="$2"
            set +e
            OUTPUT=$(docker run --rm \
              --device /dev/kvm \
              -v "$(pwd)/src/target/release:/opt/instar:ro" \
              -v "${mount_path}:/images:ro" \
              instar-build \
              /opt/instar/instar info --chain "$image_path" 2>&1)
            local exit_code=$?
            set -e
            echo "$OUTPUT"
            if [ $exit_code -ne 0 ]; then
              echo "WARNING: instar exited with code $exit_code"
            fi
          }

          echo "=== Testing --chain with 2-level chain (shakenfist/vda) ==="
          OUTPUT=$(run_chain_test /images/vda "${TESTDATA}/downloaded/shakenfist")

          # Verify chain has 2 images (output format: "  [0] path (format)")
          COUNT=$(echo "$OUTPUT" | grep -cE '^\s+\[[0-9]+\]' || true)
          if [ "$COUNT" -eq 2 ]; then
            echo "PASS: 2-level chain detected correctly"
          else
            echo "FAIL: Expected 2 images in chain, got $COUNT"
            echo "Full output was:"
            echo "$OUTPUT"
            exit 1
          fi

          # Verify backing file is reported (format: "path (format) -> backing")
          if echo "$OUTPUT" | grep -q " -> "; then
            echo "PASS: backing-file field present"
          else
            echo "FAIL: backing-file field missing"
            exit 1
          fi

          echo ""
          echo "=== Testing --chain with 2-level chain (edge-cases/overlay) ==="
          OUTPUT=$(run_chain_test /images/overlay_chain.qcow2 "${TESTDATA}/downloaded/edge-cases")

          COUNT=$(echo "$OUTPUT" | grep -cE '^\s+\[[0-9]+\]' || true)
          if [ "$COUNT" -eq 2 ]; then
            echo "PASS: 2-level chain detected correctly"
          else
            echo "FAIL: Expected 2 images in chain, got $COUNT"
            echo "Full output was:"
            echo "$OUTPUT"
            exit 1
          fi

          echo ""
          echo "=== Testing --chain with 3-level mixed-format chain ==="
          OUTPUT=$(run_chain_test /images/top.qcow2 "${TESTDATA}/custom/backing-layers-format-change")

          COUNT=$(echo "$OUTPUT" | grep -cE '^\s+\[[0-9]+\]' || true)
          if [ "$COUNT" -eq 3 ]; then
            echo "PASS: 3-level chain detected correctly"
          else
            echo "FAIL: Expected 3 images in chain, got $COUNT"
            echo "Full output was:"
            echo "$OUTPUT"
            exit 1
          fi

          # Verify format changes are reported (qcow2 -> qcow2 -> vmdk)
          if echo "$OUTPUT" | grep -q "(vmdk)"; then
            echo "PASS: VMDK base format detected in mixed chain"
          else
            echo "FAIL: VMDK base format not detected"
            exit 1
          fi

          echo ""
          echo "=== Testing --chain with single image (no backing) ==="
          OUTPUT=$(run_chain_test /images/debian-12-genericcloud-amd64.qcow2 "${TESTDATA}/downloaded/public-clouds")

          COUNT=$(echo "$OUTPUT" | grep -cE '^\s+\[[0-9]+\]' || true)
          if [ "$COUNT" -eq 1 ]; then
            echo "PASS: Single image chain (no backing) detected correctly"
          else
            echo "FAIL: Expected 1 image in chain, got $COUNT"
            echo "Full output was:"
            echo "$OUTPUT"
            exit 1
          fi

          echo ""
          echo "All --chain tests passed!"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-core-logs
          path: |
            ${{ github.workspace }}/build-log.txt
            ${{ github.workspace }}/test-output.txt
          retention-days: 7

  # QCOW2/VMDK/RAW conversion and comparison tests
  integration-convert-qcow2:
    needs: [check_paths, build-and-test]
    if: >-
      github.event_name != 'merge_group'
      && needs.check_paths.outputs.code_changed != 'false'
    runs-on: [self-hosted, debian-12, xl]
    timeout-minutes: 60

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout instar
        uses: actions/checkout@v7
        with:
          path: instar
          fetch-depth: 0

      - name: Prepare instar-testdata
        env:
          TESTDATA_TOKEN: ${{ secrets.GITLAB_TESTDATA_TOKEN }}
        run: ${GITHUB_WORKSPACE}/instar/tools/ci/prepare-testdata.sh

      - name: Resparsify test images
        run: |
          cd ${TESTDATA_PATH}
          find downloaded/ -type f \( \
            -name "*.qcow2" -o \
            -name "*.vmdk" -o \
            -name "*.vhd" -o \
            -name "*.vhdx" -o \
            -name "*.img" \
          \) -print0 | while IFS= read -r -d '' file; do
            cp --sparse=always "$file" "$file.sparse"
            mv "$file.sparse" "$file"
          done

      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo chmod 666 /var/run/docker.sock

      - name: Remove previous devcontainers, if any
        run: |
          docker image rm -f instar-build instar-release 2>/dev/null || true

      - name: Build instar
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          set +e
          make instar 2>&1 | tee ${GITHUB_WORKSPACE}/build-log.txt
          build_exit_code=${PIPESTATUS[0]}
          set -e
          if [ ${build_exit_code} -ne 0 ]; then
            echo "Build failed with exit code ${build_exit_code}"
            exit ${build_exit_code}
          fi

      - name: Run QCOW2/VMDK/RAW convert + compare tests
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          set +e
          make test-container-convert-qcow2 TESTDATA_PATH=${TESTDATA_PATH} 2>&1 | tee ${GITHUB_WORKSPACE}/test-output.txt
          test_exit_code=${PIPESTATUS[0]}
          set -e
          if [ ${test_exit_code} -ne 0 ]; then
            echo "QCOW2/VMDK/RAW convert tests failed with exit code ${test_exit_code}"
            exit ${test_exit_code}
          fi

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-convert-qcow2-logs
          path: |
            ${{ github.workspace }}/build-log.txt
            ${{ github.workspace }}/test-output.txt
          retention-days: 7

  # VHD/VHDX conversion tests (slowest format family)
  integration-convert-vhd:
    needs: [check_paths, build-and-test]
    if: >-
      github.event_name != 'merge_group'
      && needs.check_paths.outputs.code_changed != 'false'
    runs-on: [self-hosted, debian-12, xl]
    timeout-minutes: 90

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout instar
        uses: actions/checkout@v7
        with:
          path: instar
          fetch-depth: 0

      - name: Prepare instar-testdata
        env:
          TESTDATA_TOKEN: ${{ secrets.GITLAB_TESTDATA_TOKEN }}
        run: ${GITHUB_WORKSPACE}/instar/tools/ci/prepare-testdata.sh

      - name: Resparsify test images
        run: |
          cd ${TESTDATA_PATH}
          find downloaded/ -type f \( \
            -name "*.qcow2" -o \
            -name "*.vmdk" -o \
            -name "*.vhd" -o \
            -name "*.vhdx" -o \
            -name "*.img" \
          \) -print0 | while IFS= read -r -d '' file; do
            cp --sparse=always "$file" "$file.sparse"
            mv "$file.sparse" "$file"
          done

      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo chmod 666 /var/run/docker.sock

      - name: Remove previous devcontainers, if any
        run: |
          docker image rm -f instar-build instar-release 2>/dev/null || true

      - name: Build instar
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          set +e
          make instar 2>&1 | tee ${GITHUB_WORKSPACE}/build-log.txt
          build_exit_code=${PIPESTATUS[0]}
          set -e
          if [ ${build_exit_code} -ne 0 ]; then
            echo "Build failed with exit code ${build_exit_code}"
            exit ${build_exit_code}
          fi

      - name: Run VHD/VHDX convert tests
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          set +e
          make test-container-convert-vhd TESTDATA_PATH=${TESTDATA_PATH} 2>&1 | tee ${GITHUB_WORKSPACE}/test-output.txt
          test_exit_code=${PIPESTATUS[0]}
          set -e
          if [ ${test_exit_code} -ne 0 ]; then
            echo "VHD/VHDX convert tests failed with exit code ${test_exit_code}"
            exit ${test_exit_code}
          fi

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-convert-vhd-logs
          path: |
            ${{ github.workspace }}/build-log.txt
            ${{ github.workspace }}/test-output.txt
          retention-days: 7

  # Snapshot shell harnesses: live byte-parity verification of
  # `instar snapshot` against qemu-img (241 assertions across the
  # seven tools/snapshot-*.sh scripts). A separate job rather
  # than a step in an integration job: the harnesses are
  # self-fixturing (qemu-img create + qemu-io inside the
  # devcontainer), so they need no testdata clone and can run in
  # parallel with the testdata-bound jobs. `make
  # snapshot-harnesses` runs the scripts inside the devcontainer
  # with /dev/kvm passed through, the same execution model as
  # the differential-fuzz workflow.
  snapshot-harnesses:
    needs: [check_paths, build-and-test]
    if: >-
      github.event_name != 'merge_group'
      && needs.check_paths.outputs.code_changed != 'false'
    runs-on: [self-hosted, debian-12, xl]
    timeout-minutes: 30

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo chmod 666 /var/run/docker.sock

      - name: Remove previous devcontainers, if any
        run: |
          docker image rm -f instar-build instar-release 2>/dev/null || true

      - name: Build instar
        run: |
          make instar

      - name: Run snapshot harnesses
        run: |
          set +e
          make snapshot-harnesses 2>&1 | tee harness-output.txt
          harness_exit_code=${PIPESTATUS[0]}
          set -e
          exit ${harness_exit_code}

      - name: Upload harness output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-harness-logs
          path: harness-output.txt
          retention-days: 7

  # Cross-validate instar against oslo.utils git master.
  # This catches drift from oslo.utils development before
  # it reaches PyPI. Allowed to fail (informational).
  oslo-crossval-master:
    needs: [check_paths, build-and-test]
    if: >-
      github.event_name != 'merge_group'
      && needs.check_paths.outputs.code_changed != 'false'
    runs-on: [self-hosted, debian-12, xl]
    timeout-minutes: 30
    continue-on-error: true

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout instar
        uses: actions/checkout@v7
        with:
          path: instar
          fetch-depth: 0

      - name: Prepare instar-testdata
        env:
          TESTDATA_TOKEN: ${{ secrets.GITLAB_TESTDATA_TOKEN }}
        run: ${GITHUB_WORKSPACE}/instar/tools/ci/prepare-testdata.sh

      - name: Resparsify test images
        run: |
          # Git operations (clone or pull) fill sparse holes with zeros,
          # affecting qemu-img disk_size output. Restore sparseness with
          # cp --sparse=always. This is fast and idempotent on already-sparse
          # files from the cache.
          cd ${TESTDATA_PATH}
          find downloaded/ -type f \( \
            -name "*.qcow2" -o \
            -name "*.vmdk" -o \
            -name "*.vhd" -o \
            -name "*.vhdx" -o \
            -name "*.img" \
          \) -print0 | while IFS= read -r -d '' file; do
            cp --sparse=always "$file" "$file.sparse"
            mv "$file.sparse" "$file"
          done

      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo chmod 666 /var/run/docker.sock

      - name: Remove previous devcontainers, if any
        run: |
          docker image rm -f instar-build instar-release 2>/dev/null || true

      - name: Build instar
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          # The crossval step runs in the dev/test image (instar-build)
          # via a raw docker run, so build it here alongside the release
          # binary.
          make instar
          make instar-devcontainer

      - name: Run oslo crossval with oslo.utils master
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          docker run --rm \
            --device=/dev/kvm \
            -u "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /dev/kvm)" \
            -e HOME=/build \
            -e INSTAR_TESTDATA_PATH=/testdata \
            -v "$(pwd):/workspace" \
            -v "${TESTDATA_PATH}:/testdata:ro" \
            -w "/workspace" \
            instar-build \
            bash -c '
              python3 -m venv /build/test-venv &&
              /build/test-venv/bin/pip install -q \
                -r tests/requirements.txt &&
              /build/test-venv/bin/pip install -q \
                git+https://github.com/openstack/oslo.utils.git \
                cryptography &&
              cd tests &&
              /build/test-venv/bin/stestr run test_oslo_crossval
            '

  automated_reviewer:
    name: "Automated reviewer"
    # The needs: list is the "review only once CI has passed" gate:
    # a job skipped because a dependency failed never starts the
    # reusable workflow. Everything else about the reviewer --
    # runner, timeout, fork restriction, bot-commit check --
    # lives in the shared workflow so it stays in step with the
    # rest of the fleet.
    #
    # Every job which can fail the PR is named here, so the gate means
    # what the sentence above says. The one deliberate omission is
    # oslo-crossval-master, which is continue-on-error: true and so
    # could never gate anything.
    needs:
      - ci-tooling
      - build-and-test
      - package-smoke
      - integration-core
      - integration-convert-qcow2
      - integration-convert-vhd
      - snapshot-harnesses
    # Every job in that needs: list is now gated out of the merge queue,
    # so on a merge_group event they all skip and this job would skip
    # with them. Say so explicitly rather than relying on that chain:
    # there is nothing for a PR reviewer to review in a merge queue.
    # (Deliberately `!= merge_group` rather than `== pull_request`, so
    # workflow_dispatch behaviour is unchanged.)
    if: github.event_name != 'merge_group'
    # A cross-repository reusable workflow cannot grant itself more
    # token scope than its caller has, so the permissions go here.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    # No secrets: block. The shared workflow and the review-pr-with-claude
    # action it calls reference no secrets at all -- they authenticate with
    # github.token, which a reusable workflow gets from the permissions
    # above. "secrets: inherit" would hand every secret this repository has
    # to another repository's workflow tracked at @main, for nothing.
    uses: shakenfist/actions/.github/workflows/pr-auto-review.yml@main

  # The pull-request-side gate: "is this PR allowed into the queue?"
  #
  # Twin of can_merge below, and required for the same reason its
  # counterpart is: branch protection needs a stable context name to
  # require, and the individual job names churn. This one aggregates the
  # jobs that actually run on a pull request.
  #
  # It exists so that requiring a merge-queue-only check does not leave
  # the PR side with nothing to satisfy -- the queue decides whether a
  # merge group is good, this decides whether a PR may enter it.
  can_enqueue:
    name: "Can enqueue"
    needs:
      - check_paths
      - ci-tooling
      - build-and-test
      - package-smoke
      - integration-core
      - integration-convert-qcow2
      - integration-convert-vhd
      - snapshot-harnesses
    # Deliberately not gated to pull_request alone: workflow_dispatch
    # runs most of these jobs too, and reporting the aggregate there is
    # useful. oslo-crossval-master is omitted on purpose -- it is
    # continue-on-error and so could never gate anything.
    if: always() && github.event_name != 'merge_group'
    permissions:
      actions: read
    runs-on: [self-hosted, static]
    timeout-minutes: 5
    steps:
      - env:
          NEEDS_JSON: "${{ toJSON(needs) }}"
        name: Transform outcomes
        run: |
          echo "ALL_SUCCESS=$(echo "$NEEDS_JSON" | jq '. | to_entries | map([.value.result == "success", .value.result == "skipped"] | any) | all')" >>$GITHUB_ENV

      - name: Check outcomes
        run: "[ $ALL_SUCCESS == true ]"

  # The merge queue's required check. THIS is the job name to configure
  # in branch protection -- not the individual matrix entries, whose
  # names change whenever the distro list does.
  #
  # It must use `always()`, because a `needs:` dependency that is skipped
  # would otherwise skip this job too, and a required check that never
  # reports leaves the queue waiting forever. `always()` makes it run
  # regardless, and the jq expression below decides the verdict:
  # every dependency must have ended `success` or `skipped`.
  #
  # Do NOT add these jobs to automated_reviewer's needs: list instead.
  # That job is the PR reviewer, not a gate; making it depend on
  # merge-queue-only jobs would skip the reviewer on every PR.
  can_merge:
    name: "Can merge"
    needs:
      - build-and-test
      - package-build
      - package-matrix
    if: always() && github.event_name == 'merge_group'
    permissions:
      actions: read
    runs-on: [self-hosted, static]
    timeout-minutes: 5
    steps:
      - env:
          NEEDS_JSON: "${{ toJSON(needs) }}"
        name: Transform outcomes
        run: |
          echo "ALL_SUCCESS=$(echo "$NEEDS_JSON" | jq '. | to_entries | map([.value.result == "success", .value.result == "skipped"] | any) | all')" >>$GITHUB_ENV

      - name: Check outcomes
        run: "[ $ALL_SUCCESS == true ]"
