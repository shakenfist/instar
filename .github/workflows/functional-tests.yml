name: Functional Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'crates/**'
      - 'tests/**'
      - 'scripts/**'
      - 'tools/**'
      - 'Makefile'
      - '.github/workflows/functional-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Guards over CI's own tooling: cheap enough (pure Python, bash and
  # jq -- no /dev/kvm, no testdata, no build) to share one small runner
  # and give fast feedback.
  #
  # The partition check asserts every Python integration test is claimed
  # by at least one of the integration jobs below, so a test module
  # cannot silently drop out of CI -- e.g. if integration-core's
  # exclude-list were ever refactored into an include-list. See
  # tools/ci/check-test-partition.py.
  #
  # The coverage-fuzz helpers only run when a target actually crashes,
  # so nothing else here exercises them -- which is how they managed to
  # break every nightly fuzz run for a month. See "Crash reporting" in
  # docs/testing.md.
  ci-tooling:
    name: "CI tooling guards"
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, debian-12, s]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Ensure Python venv support
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-pip

      - name: Ensure jq is available
        run: command -v jq || sudo apt-get install -y jq

      - name: Check CI test partition
        run: tools/ci/check-test-partition.sh

      # Steps of this job rather than a job of their own: together they
      # take under two seconds, and a separate job would claim a second
      # runner slot and repeat the checkout and the apt refresh to run
      # them.
      - name: Test the fuzz crash reporter
        run: tools/ci/test-report-fuzz-crash.sh

      - name: Test the fuzz artifact picker
        run: tools/ci/test-pick-fuzz-artifact.sh

  build-and-test:
    runs-on: [self-hosted, debian-12, s]
    timeout-minutes: 30

    env:
      DOCKER_BUILDKIT: 1
      # Limit parallelism to reduce memory usage (s worker has 4GB RAM)
      CARGO_BUILD_JOBS: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo chmod 666 /var/run/docker.sock

      - name: Remove previous devcontainers, if any
        run: |
          docker image rm -f instar-build 2>/dev/null || true

      - name: Build and test via devcontainer
        run: |
          # Build the devcontainer and run cargo build + test inside it
          make instar
          # Run unit tests inside the container (all workspace crates
          # except no_main guest binaries)
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/build \
            -e CARGO_HOME=/build/.cargo \
            -e CARGO_BUILD_JOBS=2 \
            -v "$(pwd):/workspace" \
            -v "$(pwd)/.cargo-cache/registry:/build/.cargo/registry" \
            -v "$(pwd)/.cargo-cache/git:/build/.cargo/git" \
            -w "/workspace/src" \
            instar-build \
            cargo test --release --workspace \
              --exclude core \
              --exclude info \
              --exclude copy \
              --exclude check-op \
              --exclude compare \
              --exclude convert \
              --exclude measure-op \
              --exclude create-op \
              --exclude resize-op \
              --exclude rebase-op \
              --exclude commit-op \
              --exclude map-op \
              --exclude snapshot-op \
              --exclude amend-op \
              --exclude bitmap-op \
              --exclude bench-op

      - name: Feature-gated crate tests in container
        # Mirrors the feature-gated tail of the Makefile's test-rust
        # target (luks crypto, qcow2 create, the qcow2 chain-reader
        # arms, the create crate) -- the workspace invocation above
        # runs default features only and silently skips all of them.
        run: tools/ci/rust-feature-tests.sh

      - name: Test config commands in container
        run: |
          # Run all config tests inside the container to avoid glibc mismatch
          docker run --rm \
            -v "$(pwd):/workspace" \
            -w "/workspace" \
            instar-build \
            bash -c '
              set -e

              # Setup system config directory
              mkdir -p /etc/instar
              cat > /etc/instar/config << EOF
          # System-wide instar configuration for CI testing

          [global]
          verbose = false
          output = "human"

          [security]
          backing-path-allowlist = [
              "\$IMAGE_DIR",
              "/var/lib/libvirt/images",
          ]
          max-chain-depth = 16

          [convert]
          sparse = true
          progress = false

          [copy]
          skip-zeros = false
          verify = false
          EOF

              # Setup user config directory
              mkdir -p ~/.config/instar
              cat > ~/.config/instar/config << EOF
          # User instar configuration for CI testing

          [global]
          verbose = true

          [security]
          backing-path-allowlist = [
              "\$IMAGE_DIR",
              "\$CWD",
              "/tmp/test-images",
          ]

          [copy]
          skip-zeros = true
          EOF

              echo "=== Testing: instar config ==="
              ./src/target/release/instar config

              echo ""
              echo "=== Testing: instar config --show-sources ==="
              ./src/target/release/instar config --show-sources

              echo ""
              echo "=== Testing: instar config --validate ==="
              ./src/target/release/instar config --validate

              echo ""
              echo "=== Verifying config layering ==="
              OUTPUT=$(./src/target/release/instar config --show-sources)

              # Verify verbose=true comes from user config (overrides system false)
              if echo "$OUTPUT" | grep -q "verbose = true.*~/.config/instar/config"; then
                echo "PASS: User config overrides system config for verbose"
              else
                echo "FAIL: Expected verbose=true from user config"
                echo "$OUTPUT"
                exit 1
              fi

              # Verify backing-path-allowlist comes from user config
              if echo "$OUTPUT" | grep -q "backing-path-allowlist.*~/.config/instar/config"; then
                echo "PASS: User config overrides system config for backing-path-allowlist"
              else
                echo "FAIL: Expected backing-path-allowlist from user config"
                echo "$OUTPUT"
                exit 1
              fi

              # Verify skip-zeros comes from user config
              if echo "$OUTPUT" | grep -q "skip-zeros = true.*~/.config/instar/config"; then
                echo "PASS: User config overrides system config for skip-zeros"
              else
                echo "FAIL: Expected skip-zeros=true from user config"
                echo "$OUTPUT"
                exit 1
              fi

              # Verify sparse comes from system config (not overridden by user)
              if echo "$OUTPUT" | grep -q "sparse = true.*/etc/instar/config"; then
                echo "PASS: System config value preserved when not overridden"
              else
                echo "FAIL: Expected sparse=true from system config"
                echo "$OUTPUT"
                exit 1
              fi

              echo "All layering tests passed!"

              echo ""
              echo "=== Testing invalid config detection ==="
              cat > /tmp/bad-config << EOF
          [global
          verbose = true
          EOF

              mv ~/.config/instar/config ~/.config/instar/config.bak
              cp /tmp/bad-config ~/.config/instar/config

              set +e
              ./src/target/release/instar config --validate
              EXIT_CODE=$?
              set -e

              mv ~/.config/instar/config.bak ~/.config/instar/config

              if [ $EXIT_CODE -ne 0 ]; then
                echo "PASS: Invalid config correctly detected"
              else
                echo "FAIL: Invalid config was not detected"
                exit 1
              fi

              echo ""
              echo "All config tests passed!"
            '

  # Smoke-test the .deb package: install in a clean Debian container,
  # verify the file layout, and exercise an actual KVM operation. This
  # catches packaging regressions (asset paths, runtime deps, mode
  # bits, the /usr/lib/instar/ resolver fallback) on every PR.
  #
  # Only the .deb on debian:trixie is exercised here. Broader distro
  # coverage (Ubuntu, Fedora, Rocky 9/10, .rpm) lives in the merge
  # queue matrix; see docs/plans/PLAN-distro-matrix-ci.md for the
  # full design.
  package-smoke:
    needs: build-and-test
    runs-on: [self-hosted, debian-12, xl]
    timeout-minutes: 30

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Docker and qemu-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io qemu-utils
          sudo systemctl start docker
          sudo chmod 666 /var/run/docker.sock

      - name: Remove previous devcontainers, if any
        run: |
          docker image rm -f instar-build 2>/dev/null || true

      - name: Build instar and the .deb package
        run: |
          make instar
          make deb

      - name: Run install smoke test on debian:trixie
        run: |
          tools/test-package-install.sh \
            src/target/debian/instar_*.deb \
            debian:trixie

  # Core integration tests: info, check, security, version-detection, oslo-crossval
  # These are fast (header-parsing only, no full image conversion)
  integration-core:
    needs: build-and-test
    runs-on: [self-hosted, debian-12, xl]
    timeout-minutes: 45

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout instar
        uses: actions/checkout@v7
        with:
          path: instar
          fetch-depth: 0

      - name: Prepare instar-testdata
        env:
          TESTDATA_TOKEN: ${{ secrets.GITLAB_TESTDATA_TOKEN }}
        run: ${GITHUB_WORKSPACE}/instar/tools/ci/prepare-testdata.sh

      - name: Resparsify test images
        run: |
          cd ${TESTDATA_PATH}
          find downloaded/ -type f \( \
            -name "*.qcow2" -o \
            -name "*.vmdk" -o \
            -name "*.vhd" -o \
            -name "*.vhdx" -o \
            -name "*.img" \
          \) -print0 | while IFS= read -r -d '' file; do
            cp --sparse=always "$file" "$file.sparse"
            mv "$file.sparse" "$file"
          done

      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo chmod 666 /var/run/docker.sock

      - name: Remove previous devcontainers, if any
        run: |
          docker image rm -f instar-build 2>/dev/null || true

      - name: Build instar
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          set +e
          make instar 2>&1 | tee ${GITHUB_WORKSPACE}/build-log.txt
          build_exit_code=${PIPESTATUS[0]}
          set -e
          if [ ${build_exit_code} -ne 0 ]; then
            echo "Build failed with exit code ${build_exit_code}"
            exit ${build_exit_code}
          fi

      - name: Run core integration tests
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          set +e
          make test-container-core TESTDATA_PATH=${TESTDATA_PATH} 2>&1 | tee ${GITHUB_WORKSPACE}/test-output.txt
          test_exit_code=${PIPESTATUS[0]}
          set -e
          if [ ${test_exit_code} -ne 0 ]; then
            echo "Core integration tests failed with exit code ${test_exit_code}"
            exit ${test_exit_code}
          fi

      - name: Test --chain flag (backing chain discovery)
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          TESTDATA=${TESTDATA_PATH}

          # Helper function to run instar and capture output regardless of exit code
          # We mount the entire release directory because instar needs core.bin and info.bin
          # in the same directory as the instar binary for chain discovery
          run_chain_test() {
            local image_path="$1"
            local mount_path="$2"
            set +e
            OUTPUT=$(docker run --rm \
              --device /dev/kvm \
              -v "$(pwd)/src/target/release:/opt/instar:ro" \
              -v "${mount_path}:/images:ro" \
              instar-build \
              /opt/instar/instar info --chain "$image_path" 2>&1)
            local exit_code=$?
            set -e
            echo "$OUTPUT"
            if [ $exit_code -ne 0 ]; then
              echo "WARNING: instar exited with code $exit_code"
            fi
          }

          echo "=== Testing --chain with 2-level chain (shakenfist/vda) ==="
          OUTPUT=$(run_chain_test /images/vda "${TESTDATA}/downloaded/shakenfist")

          # Verify chain has 2 images (output format: "  [0] path (format)")
          COUNT=$(echo "$OUTPUT" | grep -cE '^\s+\[[0-9]+\]' || true)
          if [ "$COUNT" -eq 2 ]; then
            echo "PASS: 2-level chain detected correctly"
          else
            echo "FAIL: Expected 2 images in chain, got $COUNT"
            echo "Full output was:"
            echo "$OUTPUT"
            exit 1
          fi

          # Verify backing file is reported (format: "path (format) -> backing")
          if echo "$OUTPUT" | grep -q " -> "; then
            echo "PASS: backing-file field present"
          else
            echo "FAIL: backing-file field missing"
            exit 1
          fi

          echo ""
          echo "=== Testing --chain with 2-level chain (edge-cases/overlay) ==="
          OUTPUT=$(run_chain_test /images/overlay_chain.qcow2 "${TESTDATA}/downloaded/edge-cases")

          COUNT=$(echo "$OUTPUT" | grep -cE '^\s+\[[0-9]+\]' || true)
          if [ "$COUNT" -eq 2 ]; then
            echo "PASS: 2-level chain detected correctly"
          else
            echo "FAIL: Expected 2 images in chain, got $COUNT"
            echo "Full output was:"
            echo "$OUTPUT"
            exit 1
          fi

          echo ""
          echo "=== Testing --chain with 3-level mixed-format chain ==="
          OUTPUT=$(run_chain_test /images/top.qcow2 "${TESTDATA}/custom/backing-layers-format-change")

          COUNT=$(echo "$OUTPUT" | grep -cE '^\s+\[[0-9]+\]' || true)
          if [ "$COUNT" -eq 3 ]; then
            echo "PASS: 3-level chain detected correctly"
          else
            echo "FAIL: Expected 3 images in chain, got $COUNT"
            echo "Full output was:"
            echo "$OUTPUT"
            exit 1
          fi

          # Verify format changes are reported (qcow2 -> qcow2 -> vmdk)
          if echo "$OUTPUT" | grep -q "(vmdk)"; then
            echo "PASS: VMDK base format detected in mixed chain"
          else
            echo "FAIL: VMDK base format not detected"
            exit 1
          fi

          echo ""
          echo "=== Testing --chain with single image (no backing) ==="
          OUTPUT=$(run_chain_test /images/debian-12-genericcloud-amd64.qcow2 "${TESTDATA}/downloaded/public-clouds")

          COUNT=$(echo "$OUTPUT" | grep -cE '^\s+\[[0-9]+\]' || true)
          if [ "$COUNT" -eq 1 ]; then
            echo "PASS: Single image chain (no backing) detected correctly"
          else
            echo "FAIL: Expected 1 image in chain, got $COUNT"
            echo "Full output was:"
            echo "$OUTPUT"
            exit 1
          fi

          echo ""
          echo "All --chain tests passed!"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-core-logs
          path: |
            ${{ github.workspace }}/build-log.txt
            ${{ github.workspace }}/test-output.txt
          retention-days: 7

  # QCOW2/VMDK/RAW conversion and comparison tests
  integration-convert-qcow2:
    needs: build-and-test
    runs-on: [self-hosted, debian-12, xl]
    timeout-minutes: 60

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout instar
        uses: actions/checkout@v7
        with:
          path: instar
          fetch-depth: 0

      - name: Prepare instar-testdata
        env:
          TESTDATA_TOKEN: ${{ secrets.GITLAB_TESTDATA_TOKEN }}
        run: ${GITHUB_WORKSPACE}/instar/tools/ci/prepare-testdata.sh

      - name: Resparsify test images
        run: |
          cd ${TESTDATA_PATH}
          find downloaded/ -type f \( \
            -name "*.qcow2" -o \
            -name "*.vmdk" -o \
            -name "*.vhd" -o \
            -name "*.vhdx" -o \
            -name "*.img" \
          \) -print0 | while IFS= read -r -d '' file; do
            cp --sparse=always "$file" "$file.sparse"
            mv "$file.sparse" "$file"
          done

      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo chmod 666 /var/run/docker.sock

      - name: Remove previous devcontainers, if any
        run: |
          docker image rm -f instar-build 2>/dev/null || true

      - name: Build instar
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          set +e
          make instar 2>&1 | tee ${GITHUB_WORKSPACE}/build-log.txt
          build_exit_code=${PIPESTATUS[0]}
          set -e
          if [ ${build_exit_code} -ne 0 ]; then
            echo "Build failed with exit code ${build_exit_code}"
            exit ${build_exit_code}
          fi

      - name: Run QCOW2/VMDK/RAW convert + compare tests
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          set +e
          make test-container-convert-qcow2 TESTDATA_PATH=${TESTDATA_PATH} 2>&1 | tee ${GITHUB_WORKSPACE}/test-output.txt
          test_exit_code=${PIPESTATUS[0]}
          set -e
          if [ ${test_exit_code} -ne 0 ]; then
            echo "QCOW2/VMDK/RAW convert tests failed with exit code ${test_exit_code}"
            exit ${test_exit_code}
          fi

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-convert-qcow2-logs
          path: |
            ${{ github.workspace }}/build-log.txt
            ${{ github.workspace }}/test-output.txt
          retention-days: 7

  # VHD/VHDX conversion tests (slowest format family)
  integration-convert-vhd:
    needs: build-and-test
    runs-on: [self-hosted, debian-12, xl]
    timeout-minutes: 90

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout instar
        uses: actions/checkout@v7
        with:
          path: instar
          fetch-depth: 0

      - name: Prepare instar-testdata
        env:
          TESTDATA_TOKEN: ${{ secrets.GITLAB_TESTDATA_TOKEN }}
        run: ${GITHUB_WORKSPACE}/instar/tools/ci/prepare-testdata.sh

      - name: Resparsify test images
        run: |
          cd ${TESTDATA_PATH}
          find downloaded/ -type f \( \
            -name "*.qcow2" -o \
            -name "*.vmdk" -o \
            -name "*.vhd" -o \
            -name "*.vhdx" -o \
            -name "*.img" \
          \) -print0 | while IFS= read -r -d '' file; do
            cp --sparse=always "$file" "$file.sparse"
            mv "$file.sparse" "$file"
          done

      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo chmod 666 /var/run/docker.sock

      - name: Remove previous devcontainers, if any
        run: |
          docker image rm -f instar-build 2>/dev/null || true

      - name: Build instar
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          set +e
          make instar 2>&1 | tee ${GITHUB_WORKSPACE}/build-log.txt
          build_exit_code=${PIPESTATUS[0]}
          set -e
          if [ ${build_exit_code} -ne 0 ]; then
            echo "Build failed with exit code ${build_exit_code}"
            exit ${build_exit_code}
          fi

      - name: Run VHD/VHDX convert tests
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          set +e
          make test-container-convert-vhd TESTDATA_PATH=${TESTDATA_PATH} 2>&1 | tee ${GITHUB_WORKSPACE}/test-output.txt
          test_exit_code=${PIPESTATUS[0]}
          set -e
          if [ ${test_exit_code} -ne 0 ]; then
            echo "VHD/VHDX convert tests failed with exit code ${test_exit_code}"
            exit ${test_exit_code}
          fi

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-convert-vhd-logs
          path: |
            ${{ github.workspace }}/build-log.txt
            ${{ github.workspace }}/test-output.txt
          retention-days: 7

  # Snapshot shell harnesses: live byte-parity verification of
  # `instar snapshot` against qemu-img (241 assertions across the
  # seven tools/snapshot-*.sh scripts). A separate job rather
  # than a step in an integration job: the harnesses are
  # self-fixturing (qemu-img create + qemu-io inside the
  # devcontainer), so they need no testdata clone and can run in
  # parallel with the testdata-bound jobs. `make
  # snapshot-harnesses` runs the scripts inside the devcontainer
  # with /dev/kvm passed through, the same execution model as
  # the differential-fuzz workflow.
  snapshot-harnesses:
    needs: build-and-test
    runs-on: [self-hosted, debian-12, xl]
    timeout-minutes: 30

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo chmod 666 /var/run/docker.sock

      - name: Remove previous devcontainers, if any
        run: |
          docker image rm -f instar-build 2>/dev/null || true

      - name: Build instar
        run: |
          make instar

      - name: Run snapshot harnesses
        run: |
          set +e
          make snapshot-harnesses 2>&1 | tee harness-output.txt
          harness_exit_code=${PIPESTATUS[0]}
          set -e
          exit ${harness_exit_code}

      - name: Upload harness output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-harness-logs
          path: harness-output.txt
          retention-days: 7

  # Cross-validate instar against oslo.utils git master.
  # This catches drift from oslo.utils development before
  # it reaches PyPI. Allowed to fail (informational).
  oslo-crossval-master:
    needs: build-and-test
    runs-on: [self-hosted, debian-12, xl]
    timeout-minutes: 30
    continue-on-error: true

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout instar
        uses: actions/checkout@v7
        with:
          path: instar
          fetch-depth: 0

      - name: Prepare instar-testdata
        env:
          TESTDATA_TOKEN: ${{ secrets.GITLAB_TESTDATA_TOKEN }}
        run: ${GITHUB_WORKSPACE}/instar/tools/ci/prepare-testdata.sh

      - name: Resparsify test images
        run: |
          # Git operations (clone or pull) fill sparse holes with zeros,
          # affecting qemu-img disk_size output. Restore sparseness with
          # cp --sparse=always. This is fast and idempotent on already-sparse
          # files from the cache.
          cd ${TESTDATA_PATH}
          find downloaded/ -type f \( \
            -name "*.qcow2" -o \
            -name "*.vmdk" -o \
            -name "*.vhd" -o \
            -name "*.vhdx" -o \
            -name "*.img" \
          \) -print0 | while IFS= read -r -d '' file; do
            cp --sparse=always "$file" "$file.sparse"
            mv "$file.sparse" "$file"
          done

      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo chmod 666 /var/run/docker.sock

      - name: Remove previous devcontainers, if any
        run: |
          docker image rm -f instar-build 2>/dev/null || true

      - name: Build instar
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          make instar

      - name: Run oslo crossval with oslo.utils master
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          docker run --rm \
            --device=/dev/kvm \
            -u "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /dev/kvm)" \
            -e HOME=/build \
            -e INSTAR_TESTDATA_PATH=/testdata \
            -v "$(pwd):/workspace" \
            -v "${TESTDATA_PATH}:/testdata:ro" \
            -w "/workspace" \
            instar-build \
            bash -c '
              python3 -m venv /build/test-venv &&
              /build/test-venv/bin/pip install -q \
                -r tests/requirements.txt &&
              /build/test-venv/bin/pip install -q \
                git+https://github.com/openstack/oslo.utils.git \
                cryptography &&
              cd tests &&
              /build/test-venv/bin/stestr run test_oslo_crossval
            '

  automated_reviewer:
    name: "Automated reviewer"
    # The needs: list is the "review only once CI has passed" gate:
    # a job skipped because a dependency failed never starts the
    # reusable workflow. Everything else about the reviewer --
    # runner, timeout, fork restriction, bot-commit check --
    # lives in the shared workflow so it stays in step with the
    # rest of the fleet.
    #
    # Every job which can fail the PR is named here, so the gate means
    # what the sentence above says. The one deliberate omission is
    # oslo-crossval-master, which is continue-on-error: true and so
    # could never gate anything.
    needs:
      - ci-tooling
      - build-and-test
      - package-smoke
      - integration-core
      - integration-convert-qcow2
      - integration-convert-vhd
      - snapshot-harnesses
    # A cross-repository reusable workflow cannot grant itself more
    # token scope than its caller has, so the permissions go here.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    # No secrets: block. The shared workflow and the review-pr-with-claude
    # action it calls reference no secrets at all -- they authenticate with
    # github.token, which a reusable workflow gets from the permissions
    # above. "secrets: inherit" would hand every secret this repository has
    # to another repository's workflow tracked at @main, for nothing.
    uses: shakenfist/actions/.github/workflows/pr-auto-review.yml@main
