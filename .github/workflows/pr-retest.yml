name: PR Retest

# Triggers a re-run of functional tests when an authorized user comments
# "@shakenfist-bot please retest"
#
# This is useful after bot commits (which don't trigger CI) or when you
# want to re-run checks without pushing a new commit.

on:
  issue_comment:
    types: [created]

jobs:
  trigger-retest:
    # Only run on PR comments (not issue comments)
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@shakenfist-bot please retest')
    runs-on: ubuntu-latest
    name: "Trigger retest"

    steps:
      - name: Check commenter permissions
        id: check_permission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the commenter's permission level for this repository
          permission=$(gh api \
            repos/${{ github.repository }}/collaborators/${{ github.event.comment.user.login }}/permission \
            --jq '.permission' 2>/dev/null || echo "none")

          echo "User ${{ github.event.comment.user.login }} has permission: ${permission}"

          # Check if user has write or admin permission
          if [[ "${permission}" == "admin" || "${permission}" == "write" ]]; then
            echo "authorized=true" >> $GITHUB_OUTPUT
            echo "User is authorized to request retest"
          else
            echo "authorized=false" >> $GITHUB_OUTPUT
            echo "User is not authorized to request retest"
          fi

      - name: React to comment
        if: steps.check_permission.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Add a rocket reaction to acknowledge the request
          gh api \
            repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content='rocket' \
            --silent || true

      - name: Post unauthorized message
        if: steps.check_permission.outputs.authorized == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "Sorry @${{ github.event.comment.user.login }}, only repository collaborators with write access can request a retest."

      - name: Get PR branch
        if: steps.check_permission.outputs.authorized == 'true'
        id: pr_details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_REF=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }} --jq '.head.ref')
          echo "pr_ref=${PR_REF}" >> $GITHUB_OUTPUT
          echo "PR branch: ${PR_REF}"

      - name: Trigger functional tests
        if: steps.check_permission.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering functional tests on branch: ${{ steps.pr_details.outputs.pr_ref }}"

          # Trigger the functional-tests workflow on the PR branch
          gh workflow run functional-tests.yml \
            --repo ${{ github.repository }} \
            --ref "${{ steps.pr_details.outputs.pr_ref }}"

          echo "Functional tests triggered successfully"

      - name: Post confirmation
        if: steps.check_permission.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "Triggered functional tests on branch \`${{ steps.pr_details.outputs.pr_ref }}\`.

          [View workflow runs](https://github.com/${{ github.repository }}/actions/workflows/functional-tests.yml)"
