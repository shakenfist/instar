name: Auto-fix fuzzer findings

# Picks up open GitHub Issues with the security-audit label (filed by
# the coverage-guided and differential fuzzers), attempts to fix the
# crash with Claude Code, verifies the fix, and creates a PR.
#
# Two attempts per issue. Complexity guardrails prevent runaway fixes.
# See PLAN-fuzz-autofix.md for full design rationale.
#
# TRUST MODEL: Issue body content is included in the Claude prompt.
# The security-audit label requires repository write access, so only
# trusted contributors can create eligible issues. Claude runs with
# --dangerously-skip-permissions (required for file edits in CI).
# The shared prompt template (tools/autofix-prompt-base.txt) contains
# the authoritative instructions; issue body provides context only.
#
# That last point matters more than "only trusted contributors" makes
# it sound. Coverage-fuzz issues are filed by CI, not by a person, and
# two of the fields interpolated below -- .signature and .log_excerpt
# -- are verbatim bytes off a fuzzer-mutated input's panic path, which
# a mutated input can in principle steer. They are bounded, NUL-
# stripped and re-encoded to valid UTF-8 by
# tools/ci/report-fuzz-crash.sh before they ever reach an issue body,
# and only the named fields are read out again here. The prompt
# template, not the issue, is the instruction source.

on:
  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Specific issue number (empty = oldest eligible)'
        required: false
        default: ''
        type: string
      max_turns:
        description: 'Max Claude turns per attempt'
        required: false
        default: '30'
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  autofix:
    runs-on: [self-hosted, claude-code]
    timeout-minutes: 120

    concurrency:
      group: fuzz-autofix
      cancel-in-progress: false

    env:
      DOCKER_BUILDKIT: 1
      MAX_TURNS: ${{ inputs.max_turns || '30' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          path: instar

      - name: Configure git
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          git config user.name "shakenfist-bot"
          git config user.email "bot@shakenfist.com"

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          gh label create "security-audit" \
            --description "Findings from security audit and fuzzing" \
            --color "D93F0B" 2>/dev/null || true
          gh label create "autofix-failed" \
            --description "Automated fix failed after two attempts" \
            --color "FBCA04" 2>/dev/null || true
          gh label create "autofix-complex" \
            --description "Fix exceeds complexity guardrails" \
            --color "C5DEF5" 2>/dev/null || true
          gh label create "autofix-attempted" \
            --description "Automated fix in progress" \
            --color "BFD4F2" 2>/dev/null || true

      - name: Find eligible issue
        id: find_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
        run: |
          cd ${GITHUB_WORKSPACE}/instar

          # Helper: check if issue body is valid fuzzer JSON.
          # Returns 0 if the body parses as JSON with required fields.
          is_valid_fuzzer_json() {
            local body="$1"
            echo "$body" | jq -e '
              .source and .target and .signature and .reproducer
            ' >/dev/null 2>&1
          }

          if [ -n "$INPUT_ISSUE" ]; then
            # Manual dispatch with specific issue
            ISSUE_JSON=$(gh issue view "$INPUT_ISSUE" \
              --json number,title,body,labels)
            ISSUE_NUMBER=$(echo "$ISSUE_JSON" | jq -r '.number')
            ISSUE_TITLE=$(echo "$ISSUE_JSON" | jq -r '.title')
            BODY=$(echo "$ISSUE_JSON" | jq -r '.body')

            if ! is_valid_fuzzer_json "$BODY"; then
              echo "Issue #${ISSUE_NUMBER} body is not valid fuzzer JSON"
              echo "found=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "$BODY" > ${GITHUB_WORKSPACE}/issue-body.json
            echo "issue_number=${ISSUE_NUMBER}" >> $GITHUB_OUTPUT
            echo "issue_title=${ISSUE_TITLE}" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Find oldest eligible issue
          ISSUES=$(gh issue list \
            --label "security-audit" \
            --state open \
            --json number,title,body,labels \
            --limit 20)

          # Filter out issues with blocking labels or existing PRs
          OPEN_PRS=$(gh pr list --state open --json body \
            --limit 50 | jq -r '.[].body')

          # Process substitution keeps the loop in the main shell so
          # GITHUB_OUTPUT writes and exit work correctly (unlike a pipe
          # which runs the loop in a subshell).
          while read -r ISSUE; do
            NUM=$(echo "$ISSUE" | jq -r '.number')
            TITLE=$(echo "$ISSUE" | jq -r '.title')
            BODY=$(echo "$ISSUE" | jq -r '.body')
            LABELS=$(echo "$ISSUE" | jq -r \
              '.labels[].name' 2>/dev/null)

            # Skip if has blocking labels
            if echo "$LABELS" | grep -qE \
                '^(autofix-failed|autofix-complex|autofix-attempted)$'; then
              continue
            fi

            # Skip if an open PR already references this issue
            if echo "$OPEN_PRS" | grep -qF "Fixes #${NUM}"; then
              continue
            fi

            # Must have valid structured JSON body from our fuzzers
            if ! is_valid_fuzzer_json "$BODY"; then
              continue
            fi

            # Found an eligible issue
            echo "$BODY" > ${GITHUB_WORKSPACE}/issue-body.json
            echo "issue_number=${NUM}" >> $GITHUB_OUTPUT
            echo "issue_title=${TITLE}" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
            exit 0
          done < <(echo "$ISSUES" | jq -c '.[]')

          # No eligible issue found
          echo "found=false" >> $GITHUB_OUTPUT
          echo "No eligible security-audit issues found"

      - name: Mark issue as in-progress
        if: steps.find_issue.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.issue_number }}
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          gh issue edit "$ISSUE_NUMBER" --add-label "autofix-attempted"

      - name: Create working branch
        if: steps.find_issue.outputs.found == 'true'
        env:
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.issue_number }}
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          git checkout -b "autofix/issue-${ISSUE_NUMBER}" origin/develop

      - name: Build instar
        if: steps.find_issue.outputs.found == 'true'
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          docker image rm -f instar-build instar-release 2>/dev/null || true
          make instar 2>&1 | tee ${GITHUB_WORKSPACE}/build-log.txt

      - name: Construct prompt (attempt 1)
        if: steps.find_issue.outputs.found == 'true'
        env:
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.find_issue.outputs.issue_title }}
        run: |
          cd ${GITHUB_WORKSPACE}/instar

          # Shared prompt template (rules, task, output format)
          cp tools/autofix-prompt-base.txt \
            ${GITHUB_WORKSPACE}/autofix-prompt.txt

          # Extract validated fields from the structured JSON body.
          # Only specific fields are included — raw body text is never
          # passed to the prompt, preventing prompt injection.
          IJSON=${GITHUB_WORKSPACE}/issue-body.json
          F_TARGET=$(jq -r '.target' "$IJSON")
          F_SIG=$(jq -r '.signature' "$IJSON")
          F_REPRO=$(jq -r '.reproducer' "$IJSON")
          F_LOG=$(jq -r '.log_excerpt // empty' "$IJSON")
          F_SIZE=$(jq -r '.crash_input_size // empty' "$IJSON")

          {
            echo ""
            echo "## Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
            echo ""
            echo "Fuzz target: ${F_TARGET}"
            echo "Crash signature: ${F_SIG}"
            echo "Crash input size: ${F_SIZE}"
            echo ""
            echo "Reproduction command:"
            echo "    ${F_REPRO}"
            if [ -n "$F_LOG" ]; then
              echo ""
              echo "Log excerpt:"
              echo "$F_LOG" | sed 's/^/    /'
            fi
          } >> ${GITHUB_WORKSPACE}/autofix-prompt.txt

      - name: Run Claude Code (attempt 1)
        id: attempt1
        if: steps.find_issue.outputs.found == 'true'
        continue-on-error: true
        run: |
          cd ${GITHUB_WORKSPACE}/instar

          if ! command -v claude &> /dev/null; then
            echo "Error: Claude Code CLI not found"
            exit 1
          fi

          start_time=$(date +%s)

          # Record what the tree looked like before the attempt. The
          # stager needs the ignored listing to tell a fixture Claude
          # created from build output that was already there --
          # .gitignore hides both, and refusing on the latter would
          # refuse every run. Only the ignored listing is snapshotted:
          # a human reading a failure report gets the tracked side from
          # the `=== Git Status ===` block already in
          # claude-changes-N.txt.
          # actions/checkout uses `path: instar`, so it cleans only
          # the checkout -- everything written at the workspace root
          # survives into the next scheduled run on this self-hosted
          # runner. A stale rc of 3 would refuse a fresh attempt and
          # report the previous run's files into the issue comment,
          # and a stale claude stream would be parsed as this run's --
          # reporting the previous run's text into the issue and
          # deriving the commit trailer from the previous run's model.
          rm -f ${GITHUB_WORKSPACE}/stager-*.txt \
                ${GITHUB_WORKSPACE}/pre-run-ignored.txt \
                ${GITHUB_WORKSPACE}/pre-retry-ignored.txt \
                ${GITHUB_WORKSPACE}/claude-stream-*.jsonl \
                ${GITHUB_WORKSPACE}/claude-stderr-*.txt

          # Attempt 2 takes its own baseline in Prepare retry, once
          # the tree has been reset and attempt 1's refused files
          # deleted -- otherwise it would be judged against a snapshot
          # taken before the verify build and test run, and refused for
          # their output rather than for anything Claude did.
          tools/ci/stage-autofix-changes.sh \
            --snapshot ${GITHUB_WORKSPACE}/pre-run-ignored.txt

          # stream-json emits one JSON object per line as the run
          # proceeds, so `tee` keeps live output in the CI log and a
          # run killed by the job timeout still leaves a usable prefix.
          # Plain `--output-format json` gives neither: it is written
          # atomically at exit, and on turn exhaustion -- the dominant
          # outcome for a run capped by --max-turns -- it omits
          # `.result` entirely.
          # --verbose is mandatory, not decorative: under --print the
          # CLI refuses stream-json without it. stderr is captured to
          # its own file rather than folded into stdout, both so it
          # cannot corrupt the stream and because a pre-flight CLI
          # error writes there and nowhere else -- that is the file the
          # helper falls back to.
          #
          # The pipe makes the exit status `tee`'s rather than
          # `claude`'s. Nothing here reads it (the step is
          # continue-on-error and ends `|| true`), so there is
          # deliberately no `pipefail`.
          claude -p "$(cat ${GITHUB_WORKSPACE}/autofix-prompt.txt)" \
            --dangerously-skip-permissions \
            --max-turns ${MAX_TURNS} \
            --output-format stream-json \
            --verbose \
            2> ${GITHUB_WORKSPACE}/claude-stderr-1.txt \
            | tee ${GITHUB_WORKSPACE}/claude-stream-1.jsonl || true

          # Reduce the stream back to the text file everything
          # downstream reads -- `Extract commit summary` greps it for
          # the COMMIT_SUMMARY markers, and it is what a human opens in
          # the uploaded artifacts -- so that filename must not change.
          # The helper reconstructs the assistant text, appends a
          # diagnostic block when the run reported an error or the
          # stream has no result line, and prints the stderr file
          # verbatim when the stream holds nothing usable at all: a
          # pre-flight CLI refusal writes only to stderr, and losing it
          # would leave the failure with no explanation anywhere.
          tools/ci/claude-result.sh \
            --text ${GITHUB_WORKSPACE}/claude-stream-1.jsonl \
            --raw-fallback ${GITHUB_WORKSPACE}/claude-stderr-1.txt \
            > ${GITHUB_WORKSPACE}/claude-output-1.txt
          cat ${GITHUB_WORKSPACE}/claude-output-1.txt

          mkdir -p ${GITHUB_WORKSPACE}/claude-logs
          find ~/.claude/projects -name "*.jsonl" -newermt "@${start_time}" \
            -exec cp {} ${GITHUB_WORKSPACE}/claude-logs/ \; 2>/dev/null || true

          # Stage what Claude changed before anything inspects the
          # tree. The complexity and verification steps below read
          # `git diff --cached`, so an unstaged fix reads as no fix at
          # all. Exit 3 means the attempt created a file that cannot be
          # staged safely, so it is refused rather than committed as a
          # partial fix; the verify step reads the code below. The
          # script holds the rationale and is tested by
          # tools/ci/test-stage-autofix-changes.sh.
          set +e
          tools/ci/stage-autofix-changes.sh \
            --baseline ${GITHUB_WORKSPACE}/pre-run-ignored.txt \
            --refused-file ${GITHUB_WORKSPACE}/stager-refused-1.txt \
            > ${GITHUB_WORKSPACE}/stager-1.txt 2>&1
          echo "$?" > ${GITHUB_WORKSPACE}/stager-rc-1.txt
          set -e
          cat ${GITHUB_WORKSPACE}/stager-1.txt

          echo "=== Git Status ===" > ${GITHUB_WORKSPACE}/claude-changes-1.txt
          git status >> ${GITHUB_WORKSPACE}/claude-changes-1.txt 2>&1
          echo "" >> ${GITHUB_WORKSPACE}/claude-changes-1.txt
          echo "=== Staged Changes ===" >> ${GITHUB_WORKSPACE}/claude-changes-1.txt
          git diff --cached >> ${GITHUB_WORKSPACE}/claude-changes-1.txt 2>&1
          echo "" >> ${GITHUB_WORKSPACE}/claude-changes-1.txt
          # Last, because `Report failure` quotes the tail of this file
          # and a refusal is the first thing a reader needs.
          echo "=== Stager ===" >> ${GITHUB_WORKSPACE}/claude-changes-1.txt
          cat ${GITHUB_WORKSPACE}/stager-1.txt \
            >> ${GITHUB_WORKSPACE}/claude-changes-1.txt 2>&1

      - name: Check complexity (attempt 1)
        id: complexity1
        if: steps.find_issue.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.issue_number }}
        run: |
          cd ${GITHUB_WORKSPACE}/instar

          # A refused attempt has staged tracked edits it will never
          # commit. Counting them here can label the issue
          # autofix-complex and stop the run, so the real reason -- a
          # file that cannot reach the pull request -- would reach
          # neither the retry prompt nor the human.
          STAGER_RC=$(cat ${GITHUB_WORKSPACE}/stager-rc-1.txt 2>/dev/null || echo 0)
          # Anything other than 0 or 3 is a usage error -- a mistyped
          # flag, a REPO_DIR that is not a work tree. The index is then
          # empty, which reads downstream as "Claude changed nothing"
          # and labels the issue autofix-failed: a wiring bug wearing
          # the costume of a Claude failure, which is the exact
          # misattribution this workflow spent four months inside.
          if [ "${STAGER_RC}" != "0" ] && [ "${STAGER_RC}" != "3" ]; then
            echo "Stager failed with ${STAGER_RC}; this is a workflow bug, not a fix failure"
            cat ${GITHUB_WORKSPACE}/stager-1.txt || true
            exit 1
          fi

          if [ "${STAGER_RC}" = "3" ]; then
            echo "Stager refused the attempt; leaving the verdict to the verify step"
            echo "changed_files=0" >> $GITHUB_OUTPUT
            echo "too_complex=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Count changed source files (exclude docs, tests, manifests)
          CHANGED_SRC=$(git diff --cached --name-only \
            | grep -vE '(\.md$|^tests/|^docs/|manifest\.json$)' \
            || true)

          if [ -z "$CHANGED_SRC" ]; then
            echo "changed_files=0" >> $GITHUB_OUTPUT
            echo "too_complex=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED_FILES=$(echo "$CHANGED_SRC" | grep -c '.' || true)

          # Check for cross-crate changes (multiple dirs under src/crates/)
          CRATE_DIRS=$(echo "$CHANGED_SRC" \
            | grep '^src/crates/' \
            | cut -d'/' -f1-3 \
            | sort -u \
            | wc -l)
          # Also check if both VMM and a parser crate are touched
          HAS_VMM=$(echo "$CHANGED_SRC" | grep -c '^src/vmm/' || true)

          echo "changed_files=${CHANGED_FILES}" >> $GITHUB_OUTPUT

          REASON=""
          if [ "$CHANGED_FILES" -gt 3 ]; then
            REASON="too many files (${CHANGED_FILES}, max 3)"
          elif [ "$CRATE_DIRS" -gt 1 ]; then
            REASON="cross-crate changes (${CRATE_DIRS} crates)"
          elif [ "$HAS_VMM" -gt 0 ] && [ "$CRATE_DIRS" -gt 0 ]; then
            REASON="spans VMM and parser crate"
          fi

          # Check for Cargo.toml changes (possible new dependencies)
          if [ -z "$REASON" ]; then
            if echo "$CHANGED_SRC" | grep -q 'Cargo\.toml'; then
              REASON="Cargo.toml modified (possible new dependency)"
            fi
          fi

          if [ -n "$REASON" ]; then
            echo "Complexity guardrail: $REASON"
            echo "too_complex=true" >> $GITHUB_OUTPUT
            gh issue edit "$ISSUE_NUMBER" \
              --add-label "autofix-complex" \
              --remove-label "autofix-attempted"
            WFRUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue comment "$ISSUE_NUMBER" --body \
              "Autofix exceeded complexity limit: ${REASON}. Needs human attention.

              Workflow: $WFRUN"
          else
            echo "too_complex=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify fix (attempt 1)
        id: verify1
        if: |
          steps.find_issue.outputs.found == 'true' &&
          steps.complexity1.outputs.too_complex != 'true'
        run: |
          cd ${GITHUB_WORKSPACE}/instar

          # Check if there are any staged changes at all
          # Exit 3 from the stager means the attempt created a file
          # that cannot be staged safely -- a new source file, a
          # fixture .gitignore hides, a workflow edit that could not be
          # pushed. The tree it built against is not the tree the
          # commit would contain, so verifying it would prove nothing.
          STAGER_RC=$(cat ${GITHUB_WORKSPACE}/stager-rc-1.txt 2>/dev/null || echo 0)
          # Anything other than 0 or 3 is a usage error -- a mistyped
          # flag, a REPO_DIR that is not a work tree. The index is then
          # empty, which reads downstream as "Claude changed nothing"
          # and labels the issue autofix-failed: a wiring bug wearing
          # the costume of a Claude failure, which is the exact
          # misattribution this workflow spent four months inside.
          if [ "${STAGER_RC}" != "0" ] && [ "${STAGER_RC}" != "3" ]; then
            echo "Stager failed with ${STAGER_RC}; this is a workflow bug, not a fix failure"
            cat ${GITHUB_WORKSPACE}/stager-1.txt || true
            exit 1
          fi

          if [ "${STAGER_RC}" = "3" ]; then
            echo "Refused: the attempt created files that cannot reach the pull request"
            cat ${GITHUB_WORKSPACE}/stager-1.txt || true
            echo "fix_succeeded=false" >> $GITHUB_OUTPUT
            echo "failure_reason=newfiles" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "Claude modified no tracked file"
            echo "fix_succeeded=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Rebuild if Rust files changed
          if git diff --cached --name-only | grep -q '\.rs$'; then
            echo "Rust files changed, rebuilding..."
            make instar 2>&1 | tee ${GITHUB_WORKSPACE}/verify-build-1.txt
            if [ ${PIPESTATUS[0]} -ne 0 ]; then
              echo "Build failed"
              echo "fix_succeeded=false" >> $GITHUB_OUTPUT
              echo "failure_reason=build" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # Run core tests
          echo "Running core tests..."
          make test-container-core 2>&1 | tee ${GITHUB_WORKSPACE}/verify-test-1.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Tests failed"
            echo "fix_succeeded=false" >> $GITHUB_OUTPUT
            echo "failure_reason=tests" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "fix_succeeded=true" >> $GITHUB_OUTPUT

      - name: Prepare retry (attempt 2)
        id: prep_retry
        if: |
          steps.find_issue.outputs.found == 'true' &&
          steps.complexity1.outputs.too_complex != 'true' &&
          steps.verify1.outputs.fix_succeeded != 'true'
        env:
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.find_issue.outputs.issue_title }}
          FAILURE_REASON: ${{ steps.verify1.outputs.failure_reason }}
        run: |
          cd ${GITHUB_WORKSPACE}/instar

          # Save the failed diff for context
          git diff --cached > ${GITHUB_WORKSPACE}/attempt1-diff.txt 2>&1

          # Reset to clean state
          git reset HEAD -- . 2>/dev/null || true
          git checkout -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true

          # `git clean -fd` has no -x on purpose -- -x would delete
          # src/target/ and force a full rebuild -- so an ignored file
          # attempt 1 created survives it, and the stager would refuse
          # attempt 2 for that file whatever attempt 2 did. Delete just
          # the paths it named.
          if [ -s ${GITHUB_WORKSPACE}/stager-refused-1.txt ]; then
            while IFS= read -r REFUSED_PATH; do
              [ -n "${REFUSED_PATH}" ] || continue
              rm -rf -- "${REFUSED_PATH}"
            done < ${GITHUB_WORKSPACE}/stager-refused-1.txt
          fi

          # Baseline for attempt 2, taken here rather than reused from
          # before attempt 1: the tree now holds whatever the verify
          # build and test run wrote, and nothing attempt 1 created --
          # `git clean -fd` took the untracked files and the loop above
          # took the ignored ones. CI_OUTPUT_DIRS covers the build
          # output known today, but it is a denylist, and this keeps
          # attempt 2 from depending on it being complete.
          tools/ci/stage-autofix-changes.sh \
            --snapshot ${GITHUB_WORKSPACE}/pre-retry-ignored.txt

          # Shared prompt template (same as attempt 1)
          cd ${GITHUB_WORKSPACE}/instar
          cp tools/autofix-prompt-base.txt ${GITHUB_WORKSPACE}/autofix-prompt-2.txt

          # Prepend retry-specific context: previous attempt diff and
          # failure output. Uses echo/cat to avoid shell injection from
          # crash logs or issue body metacharacters.
          RETRY_PREAMBLE=$(mktemp)
          {
            echo "## Previous attempt FAILED"
            echo ""
            echo "A previous fix attempt did not work. Here is the diff:"
            echo ""
            sed 's/^/    /' ${GITHUB_WORKSPACE}/attempt1-diff.txt
            echo ""
            echo "The failure was: $FAILURE_REASON"
            echo ""
            if [ "$FAILURE_REASON" = "build" ]; then
              tail -50 ${GITHUB_WORKSPACE}/verify-build-1.txt 2>/dev/null \
                | sed 's/^/    /' || true
            elif [ "$FAILURE_REASON" = "tests" ]; then
              tail -50 ${GITHUB_WORKSPACE}/verify-test-1.txt 2>/dev/null \
                | sed 's/^/    /' || true
            elif [ "$FAILURE_REASON" = "newfiles" ]; then
              sed 's/^/    /' ${GITHUB_WORKSPACE}/stager-1.txt || true
            else
              echo "    The previous attempt changed no files at all."
            fi
            echo ""
            echo "Try a DIFFERENT approach. Do not repeat the same fix."
            echo ""
          } > "$RETRY_PREAMBLE"

          # Insert preamble before the shared template content
          cat "$RETRY_PREAMBLE" ${GITHUB_WORKSPACE}/autofix-prompt-2.txt \
            > ${GITHUB_WORKSPACE}/autofix-prompt-2.tmp
          mv ${GITHUB_WORKSPACE}/autofix-prompt-2.tmp \
            ${GITHUB_WORKSPACE}/autofix-prompt-2.txt
          rm -f "$RETRY_PREAMBLE"

          # Append issue context from validated JSON fields only
          IJSON=${GITHUB_WORKSPACE}/issue-body.json
          F_TARGET=$(jq -r '.target' "$IJSON")
          F_SIG=$(jq -r '.signature' "$IJSON")
          F_REPRO=$(jq -r '.reproducer' "$IJSON")
          F_LOG=$(jq -r '.log_excerpt // empty' "$IJSON")
          F_SIZE=$(jq -r '.crash_input_size // empty' "$IJSON")

          {
            echo ""
            echo "## Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
            echo ""
            echo "Fuzz target: ${F_TARGET}"
            echo "Crash signature: ${F_SIG}"
            echo "Crash input size: ${F_SIZE}"
            echo ""
            echo "Reproduction command:"
            echo "    ${F_REPRO}"
            if [ -n "$F_LOG" ]; then
              echo ""
              echo "Log excerpt:"
              echo "$F_LOG" | sed 's/^/    /'
            fi
          } >> ${GITHUB_WORKSPACE}/autofix-prompt-2.txt

          echo "retry_ready=true" >> $GITHUB_OUTPUT

      - name: Run Claude Code (attempt 2)
        id: attempt2
        if: steps.prep_retry.outputs.retry_ready == 'true'
        continue-on-error: true
        run: |
          cd ${GITHUB_WORKSPACE}/instar

          start_time=$(date +%s)

          # stream-json emits one JSON object per line as the run
          # proceeds, so `tee` keeps live output in the CI log and a
          # run killed by the job timeout still leaves a usable prefix.
          # Plain `--output-format json` gives neither: it is written
          # atomically at exit, and on turn exhaustion -- the dominant
          # outcome for a run capped by --max-turns -- it omits
          # `.result` entirely.
          # --verbose is mandatory, not decorative: under --print the
          # CLI refuses stream-json without it. stderr is captured to
          # its own file rather than folded into stdout, both so it
          # cannot corrupt the stream and because a pre-flight CLI
          # error writes there and nowhere else -- that is the file the
          # helper falls back to.
          #
          # The pipe makes the exit status `tee`'s rather than
          # `claude`'s. Nothing here reads it (the step is
          # continue-on-error and ends `|| true`), so there is
          # deliberately no `pipefail`.
          claude -p "$(cat ${GITHUB_WORKSPACE}/autofix-prompt-2.txt)" \
            --dangerously-skip-permissions \
            --max-turns ${MAX_TURNS} \
            --output-format stream-json \
            --verbose \
            2> ${GITHUB_WORKSPACE}/claude-stderr-2.txt \
            | tee ${GITHUB_WORKSPACE}/claude-stream-2.jsonl || true

          # Reduce the stream back to the text file everything
          # downstream reads -- `Extract commit summary` greps it for
          # the COMMIT_SUMMARY markers, and it is what a human opens in
          # the uploaded artifacts -- so that filename must not change.
          # The helper reconstructs the assistant text, appends a
          # diagnostic block when the run reported an error or the
          # stream has no result line, and prints the stderr file
          # verbatim when the stream holds nothing usable at all: a
          # pre-flight CLI refusal writes only to stderr, and losing it
          # would leave the failure with no explanation anywhere.
          tools/ci/claude-result.sh \
            --text ${GITHUB_WORKSPACE}/claude-stream-2.jsonl \
            --raw-fallback ${GITHUB_WORKSPACE}/claude-stderr-2.txt \
            > ${GITHUB_WORKSPACE}/claude-output-2.txt
          cat ${GITHUB_WORKSPACE}/claude-output-2.txt

          find ~/.claude/projects -name "*.jsonl" -newermt "@${start_time}" \
            -exec cp {} ${GITHUB_WORKSPACE}/claude-logs/ \; 2>/dev/null || true

          # Stage what Claude changed before anything inspects the
          # tree. The complexity and verification steps below read
          # `git diff --cached`, so an unstaged fix reads as no fix at
          # all. Exit 3 means the attempt created a file that cannot be
          # staged safely, so it is refused rather than committed as a
          # partial fix; the verify step reads the code below. The
          # script holds the rationale and is tested by
          # tools/ci/test-stage-autofix-changes.sh.
          set +e
          tools/ci/stage-autofix-changes.sh \
            --baseline ${GITHUB_WORKSPACE}/pre-retry-ignored.txt \
            --refused-file ${GITHUB_WORKSPACE}/stager-refused-2.txt \
            > ${GITHUB_WORKSPACE}/stager-2.txt 2>&1
          echo "$?" > ${GITHUB_WORKSPACE}/stager-rc-2.txt
          set -e
          cat ${GITHUB_WORKSPACE}/stager-2.txt

          echo "=== Git Status ===" > ${GITHUB_WORKSPACE}/claude-changes-2.txt
          git status >> ${GITHUB_WORKSPACE}/claude-changes-2.txt 2>&1
          echo "" >> ${GITHUB_WORKSPACE}/claude-changes-2.txt
          echo "=== Staged Changes ===" >> ${GITHUB_WORKSPACE}/claude-changes-2.txt
          git diff --cached >> ${GITHUB_WORKSPACE}/claude-changes-2.txt 2>&1
          echo "" >> ${GITHUB_WORKSPACE}/claude-changes-2.txt
          # Last, because `Report failure` quotes the tail of this file
          # and a refusal is the first thing a reader needs.
          echo "=== Stager ===" >> ${GITHUB_WORKSPACE}/claude-changes-2.txt
          cat ${GITHUB_WORKSPACE}/stager-2.txt \
            >> ${GITHUB_WORKSPACE}/claude-changes-2.txt 2>&1

      - name: Check complexity (attempt 2)
        id: complexity2
        if: steps.prep_retry.outputs.retry_ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.issue_number }}
        run: |
          cd ${GITHUB_WORKSPACE}/instar

          # A refused attempt has staged tracked edits it will never
          # commit. Counting them here can label the issue
          # autofix-complex and stop the run, so the real reason -- a
          # file that cannot reach the pull request -- would reach
          # neither the retry prompt nor the human.
          STAGER_RC=$(cat ${GITHUB_WORKSPACE}/stager-rc-2.txt 2>/dev/null || echo 0)
          # Anything other than 0 or 3 is a usage error -- a mistyped
          # flag, a REPO_DIR that is not a work tree. The index is then
          # empty, which reads downstream as "Claude changed nothing"
          # and labels the issue autofix-failed: a wiring bug wearing
          # the costume of a Claude failure, which is the exact
          # misattribution this workflow spent four months inside.
          if [ "${STAGER_RC}" != "0" ] && [ "${STAGER_RC}" != "3" ]; then
            echo "Stager failed with ${STAGER_RC}; this is a workflow bug, not a fix failure"
            cat ${GITHUB_WORKSPACE}/stager-2.txt || true
            exit 1
          fi

          if [ "${STAGER_RC}" = "3" ]; then
            echo "Stager refused the attempt; leaving the verdict to the verify step"
            echo "changed_files=0" >> $GITHUB_OUTPUT
            echo "too_complex=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED_SRC=$(git diff --cached --name-only \
            | grep -vE '(\.md$|^tests/|^docs/|manifest\.json$)' \
            || true)

          if [ -z "$CHANGED_SRC" ]; then
            echo "changed_files=0" >> $GITHUB_OUTPUT
            echo "too_complex=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED_FILES=$(echo "$CHANGED_SRC" | grep -c '.' || true)
          CRATE_DIRS=$(echo "$CHANGED_SRC" \
            | grep '^src/crates/' \
            | cut -d'/' -f1-3 \
            | sort -u \
            | wc -l)
          HAS_VMM=$(echo "$CHANGED_SRC" | grep -c '^src/vmm/' || true)
          echo "changed_files=${CHANGED_FILES}" >> $GITHUB_OUTPUT

          REASON=""
          if [ "$CHANGED_FILES" -gt 3 ]; then
            REASON="too many files (${CHANGED_FILES}, max 3)"
          elif [ "$CRATE_DIRS" -gt 1 ]; then
            REASON="cross-crate changes (${CRATE_DIRS} crates)"
          elif [ "$HAS_VMM" -gt 0 ] && [ "$CRATE_DIRS" -gt 0 ]; then
            REASON="spans VMM and parser crate"
          fi

          if [ -z "$REASON" ]; then
            if echo "$CHANGED_SRC" | grep -q 'Cargo\.toml'; then
              REASON="Cargo.toml modified (possible new dependency)"
            fi
          fi

          if [ -n "$REASON" ]; then
            echo "too_complex=true" >> $GITHUB_OUTPUT
            gh issue edit "$ISSUE_NUMBER" \
              --add-label "autofix-complex" \
              --remove-label "autofix-attempted"
            WFRUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue comment "$ISSUE_NUMBER" --body \
              "Autofix exceeded complexity limit on attempt 2: ${REASON}. Needs human attention.

              Workflow: $WFRUN"
          else
            echo "too_complex=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify fix (attempt 2)
        id: verify2
        if: |
          steps.prep_retry.outputs.retry_ready == 'true' &&
          steps.complexity2.outputs.too_complex != 'true'
        run: |
          cd ${GITHUB_WORKSPACE}/instar

          # Exit 3 from the stager means the attempt created a file
          # that cannot be staged safely -- a new source file, a
          # fixture .gitignore hides, a workflow edit that could not be
          # pushed. The tree it built against is not the tree the
          # commit would contain, so verifying it would prove nothing.
          STAGER_RC=$(cat ${GITHUB_WORKSPACE}/stager-rc-2.txt 2>/dev/null || echo 0)
          # Anything other than 0 or 3 is a usage error -- a mistyped
          # flag, a REPO_DIR that is not a work tree. The index is then
          # empty, which reads downstream as "Claude changed nothing"
          # and labels the issue autofix-failed: a wiring bug wearing
          # the costume of a Claude failure, which is the exact
          # misattribution this workflow spent four months inside.
          if [ "${STAGER_RC}" != "0" ] && [ "${STAGER_RC}" != "3" ]; then
            echo "Stager failed with ${STAGER_RC}; this is a workflow bug, not a fix failure"
            cat ${GITHUB_WORKSPACE}/stager-2.txt || true
            exit 1
          fi

          if [ "${STAGER_RC}" = "3" ]; then
            echo "Refused: the attempt created files that cannot reach the pull request"
            cat ${GITHUB_WORKSPACE}/stager-2.txt || true
            echo "fix_succeeded=false" >> $GITHUB_OUTPUT
            echo "failure_reason=newfiles" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "Claude modified no tracked file"
            echo "fix_succeeded=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git diff --cached --name-only | grep -q '\.rs$'; then
            echo "Rust files changed, rebuilding..."
            make instar 2>&1 | tee ${GITHUB_WORKSPACE}/verify-build-2.txt
            if [ ${PIPESTATUS[0]} -ne 0 ]; then
              echo "Build failed"
              echo "fix_succeeded=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "Running core tests..."
          make test-container-core 2>&1 | tee ${GITHUB_WORKSPACE}/verify-test-2.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Tests failed"
            echo "fix_succeeded=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "fix_succeeded=true" >> $GITHUB_OUTPUT

      - name: Determine success
        id: result
        if: steps.find_issue.outputs.found == 'true'
        run: |
          if [ "${{ steps.verify1.outputs.fix_succeeded }}" == "true" ]; then
            echo "succeeded=true" >> $GITHUB_OUTPUT
            echo "attempt=1" >> $GITHUB_OUTPUT
          elif [ "${{ steps.verify2.outputs.fix_succeeded }}" == "true" ]; then
            echo "succeeded=true" >> $GITHUB_OUTPUT
            echo "attempt=2" >> $GITHUB_OUTPUT
          else
            echo "succeeded=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract commit summary
        id: extract_summary
        if: steps.result.outputs.succeeded == 'true'
        run: |
          ATTEMPT=${{ steps.result.outputs.attempt }}
          OUTPUT_FILE="${GITHUB_WORKSPACE}/claude-output-${ATTEMPT}.txt"

          if grep -q "COMMIT_SUMMARY_START" "$OUTPUT_FILE"; then
            sed -n '/COMMIT_SUMMARY_START/,/COMMIT_SUMMARY_END/p' \
              "$OUTPUT_FILE" | \
              grep -v "COMMIT_SUMMARY_START" | \
              grep -v "COMMIT_SUMMARY_END" | \
              sed 's/^```$//' | \
              cat -s > ${GITHUB_WORKSPACE}/commit-summary.txt

            if [ -s ${GITHUB_WORKSPACE}/commit-summary.txt ]; then
              echo "summary_found=true" >> $GITHUB_OUTPUT
            else
              echo "summary_found=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "summary_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit, push, and create PR
        if: steps.result.outputs.succeeded == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.find_issue.outputs.issue_title }}
        run: |
          cd ${GITHUB_WORKSPACE}/instar

          # Already staged after each Claude attempt; repeated here so
          # this step does not depend on that having happened.
          # --tracked-only because the checks have already run: the
          # verify build and test run have since written to the tree,
          # so a full check here would refuse on their output. It still
          # keeps .github/workflows/ out of the index, because a commit
          # touching one cannot be pushed with the token CI holds.
          #
          # `git add -u` runs downstream of the complexity guardrail,
          # so a tracked file modified by the verify build between the
          # gate and here is committed without having been counted
          # against the 3-file limit. Not new -- the old net was a bare
          # `git add -u` -- but newly reachable, since the flow never
          # got this far before.
          tools/ci/stage-autofix-changes.sh --tracked-only

          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No changes staged"
            exit 0
          fi

          # Build commit message. The trailer is derived from the
          # winning attempt's own stream rather than hardcoded: this
          # workflow named a hardcoded Opus release long after the CLI
          # stopped resolving to it, and the two other Claude
          # automations had drifted to a different stale name again.
          # The helper reads the model and context window the run
          # itself reported, and emits an unqualified
          # `Co-Authored-By: Claude` if the stream does not say.
          # Both branches write a message file and
          # use `git commit -F`, so the two derived lines can be
          # appended without fighting a heredoc's baked-in indentation.
          ATTEMPT=${{ steps.result.outputs.attempt }}
          STREAM="${GITHUB_WORKSPACE}/claude-stream-${ATTEMPT}.jsonl"

          if [ "${{ steps.extract_summary.outputs.summary_found }}" == "true" ] && \
             [ -s ${GITHUB_WORKSPACE}/commit-summary.txt ]; then
            {
              cat ${GITHUB_WORKSPACE}/commit-summary.txt
              echo ""
              tools/ci/claude-result.sh --trailer "${STREAM}"
            } > ${GITHUB_WORKSPACE}/commit-message.txt
          else
            {
              echo "Fix fuzzer crash in issue #${ISSUE_NUMBER}."
              echo ""
              echo "Automated fix for security-audit issue."
              echo ""
              echo "Fixes #${ISSUE_NUMBER}"
              echo ""
              tools/ci/claude-result.sh --trailer "${STREAM}"
            } > ${GITHUB_WORKSPACE}/commit-message.txt
          fi
          git commit -F ${GITHUB_WORKSPACE}/commit-message.txt

          # Push and create PR
          BRANCH="autofix/issue-${ISSUE_NUMBER}"
          git push -u origin "${BRANCH}"
          sleep 5

          # Determine PR title and body
          if [ "${{ steps.extract_summary.outputs.summary_found }}" == "true" ] && \
             [ -s ${GITHUB_WORKSPACE}/commit-summary.txt ]; then
            PR_TITLE=$(head -1 ${GITHUB_WORKSPACE}/commit-summary.txt | sed 's/\.$//')
            COMMIT_BODY=$(tail -n +3 ${GITHUB_WORKSPACE}/commit-summary.txt)
          else
            PR_TITLE="Fix fuzzer crash: ${ISSUE_TITLE}"
            COMMIT_BODY="Automated fix for security-audit finding."
          fi

          # Extract reproducer from validated JSON
          REPRODUCER=$(jq -r '.reproducer // "See issue for details"' \
            ${GITHUB_WORKSPACE}/issue-body.json)

          {
            echo "## Summary"
            echo ""
            echo "Automated fix for #${ISSUE_NUMBER}."
            echo ""
            echo "$COMMIT_BODY"
            echo ""
            echo "## Verification"
            echo ""
            echo "- Build succeeded (make instar)"
            echo "- Core tests passed (make test-container-core)"
            echo ""
            echo "## Reproduction"
            echo ""
            echo '```bash'
            echo "$REPRODUCER"
            echo '```'
            echo ""
            echo "Fixes #${ISSUE_NUMBER}"
            echo ""
            echo "---"
            echo "Generated with [Claude Code](https://claude.com/claude-code)"
          } > /tmp/pr-body.txt

          gh pr create \
            --assignee mikalstill \
            --reviewer mikalstill \
            --title "${PR_TITLE}" \
            --body-file /tmp/pr-body.txt

          # Clean up the in-progress label
          gh issue edit "$ISSUE_NUMBER" --remove-label "autofix-attempted"

      - name: Report failure
        if: |
          steps.find_issue.outputs.found == 'true' &&
          steps.result.outputs.succeeded != 'true' &&
          steps.complexity1.outputs.too_complex != 'true' &&
          steps.complexity2.outputs.too_complex != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.issue_number }}
        run: |
          cd ${GITHUB_WORKSPACE}/instar

          # Label as failed
          gh issue edit "$ISSUE_NUMBER" \
            --add-label "autofix-failed" \
            --remove-label "autofix-attempted"

          # Build failure summary
          ATTEMPT1_SUMMARY="No output captured."
          if [ -f ${GITHUB_WORKSPACE}/claude-changes-1.txt ]; then
            ATTEMPT1_SUMMARY=$(tail -30 ${GITHUB_WORKSPACE}/claude-changes-1.txt)
          fi

          ATTEMPT2_SUMMARY="No second attempt (first attempt produced no changes)."
          if [ -f ${GITHUB_WORKSPACE}/claude-changes-2.txt ]; then
            ATTEMPT2_SUMMARY=$(tail -30 ${GITHUB_WORKSPACE}/claude-changes-2.txt)
          fi

          WORKFLOW_RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## Automated fix failed (2 attempts)"
            echo ""
            echo "Both fix attempts were unsuccessful. This issue needs human attention."
            echo ""
            echo "### Attempt 1"
            echo ""
            echo "$ATTEMPT1_SUMMARY" | sed 's/^/    /'
            echo ""
            echo "### Attempt 2"
            echo ""
            echo "$ATTEMPT2_SUMMARY" | sed 's/^/    /'
            echo ""
            echo "Workflow run: $WORKFLOW_RUN"
          } > /tmp/fail-comment.txt

          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/fail-comment.txt

      - name: Gzip Claude streams
        if: always()
        run: |
          # claude-logs/ already holds the CLI's own session transcript
          # in a different format, but claude-stream-N.jsonl is the raw
          # bytes tools/ci/claude-result.sh actually parsed -- including
          # every tool result (file contents, diffs, build output) --
          # which is genuinely useful when debugging the helper itself,
          # so it stays, just compressed: over a 30-turn run on this
          # Rust tree it easily runs tens of megabytes uncompressed,
          # against a 14-day retention.
          #
          # This has to run after `Commit, push, and create PR`, which
          # is the last step to read a raw stream (it derives the
          # commit trailer from claude-stream-${ATTEMPT}.jsonl) --
          # gzipping any earlier would break that read.
          #
          # `if` rather than `[ -f ... ] && gzip`: steps run under
          # `bash -e`, an unmatched glob leaves the pattern literal,
          # and a trailing false test would make the loop -- and so
          # the step -- exit non-zero. Most runs of this workflow find
          # no eligible issue and write no stream at all, so that is
          # the common case, not the rare one.
          for f in ${GITHUB_WORKSPACE}/claude-stream-*.jsonl; do
            if [ -f "$f" ]; then
              gzip -f "$f"
            fi
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-autofix-logs-${{ github.run_id }}
          path: |
            build-log.txt
            claude-output-*.txt
            claude-changes-*.txt
            claude-logs/
            autofix-prompt*.txt
            attempt1-diff.txt
            pre-run-ignored.txt
            pre-retry-ignored.txt
            claude-stream-*.jsonl.gz
            claude-stderr-*.txt
            stager-*.txt
            verify-build-*.txt
            verify-test-*.txt
            commit-summary.txt
            commit-message.txt
            issue-body.json
          retention-days: 14
