# Lints the agent context -- AGENTS.md, the Claude Code settings and
# the skills under .claude/ -- for malformed frontmatter, smuggled
# instructions, embedded credentials and dangerous hook or settings
# configuration.
#
# The job runs the pre-commit hook rather than invoking skillsaw
# directly, so .pre-commit-config.yaml's rev is the only place the
# skillsaw version is written down. skillsaw's rule set moves between
# releases, and Renovate's pre-commit manager raises the hook bump as
# its own reviewable pull request (automerge is off for minor and patch
# here), so a second pin in this workflow would drift without anyone
# choosing it. pre-commit itself is pinned, in
# tools/ci/pre-commit-requirements.txt: the harness that enforces the
# hook rev should not be the one floating thing in the job.
#
# This is its own workflow rather than a job in lint.yml because that
# workflow's path filter is the Rust tree: sharing it would either run
# the half-hour containerised clippy build on a documentation change,
# or leave this job unable to trigger on one.
#
# Living in its own file has one consequence worth stating, because it
# is an exception to a convention AGENTS.md records: this job can fail a
# pull request but is named in neither automated_reviewer's needs: list
# nor can_enqueue's, since needs: cannot cross workflow files. It is not
# a required check on the develop ruleset either -- see the note on the
# push trigger below for why a path-filtered required check is a trap.
# So a red Agent context is visible on the pull request and blocks
# nothing automatically. Both lists in functional-tests.yml name this
# workflow as the second deliberate omission.
#
# CLAUDE.md appears in the path filters below and this repository has no
# such file. That is on purpose: the filter is what makes one linted
# from its very first commit, rather than from whenever somebody
# remembered to add it here.

name: Agent context

on:
  # Also on push, because a commit that lands on develop without a pull
  # request -- an admin push, a bot commit -- would otherwise never be
  # linted, and AGENTS.md and .claude/ are exactly the files where an
  # unreviewed change is worth catching late if it was not caught early.
  # There is deliberately no merge_group trigger: this is not a required
  # check, and a path-filtered workflow made required reports pending
  # forever on the pull requests it filters out.
  push:
    branches:
      - develop
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.claude/**'
      - '.pre-commit-config.yaml'
      - '.github/workflows/agent-context.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.claude/**'
      - '.pre-commit-config.yaml'
      - '.github/workflows/agent-context.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skillsaw:
    name: skillsaw
    runs-on: [self-hosted, vm, debian-12, s]
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-skillsaw
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      # Into a venv, not the system python: the runners enforce PEP
      # 668, so a bare `pip install` is refused with "error:
      # externally-managed-environment". pre-commit then builds the
      # skillsaw hook its own environment from the pinned rev.
      - name: Install pre-commit
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv-skillsaw"
          "${RUNNER_TEMP}/venv-skillsaw/bin/pip" install --quiet \
              --disable-pip-version-check \
              -r tools/ci/pre-commit-requirements.txt
          echo "${RUNNER_TEMP}/venv-skillsaw/bin" >> "${GITHUB_PATH}"

      # Just this hook. The others have jobs of their own, and running
      # them again here would report the same failure under two names
      # while holding a second runner to do it.
      - name: Lint agent context
        run: pre-commit run skillsaw --all-files
