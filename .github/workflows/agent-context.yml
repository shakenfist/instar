# Lints the agent context -- AGENTS.md, the Claude Code settings and
# the skills under .claude/ -- for malformed frontmatter, smuggled
# instructions, embedded credentials and dangerous hook or settings
# configuration.
#
# The job runs the pre-commit hook rather than invoking skillsaw
# directly, so .pre-commit-config.yaml's rev is the only place the
# version is written down. skillsaw's rule set moves between releases,
# and Renovate's pre-commit manager bumps the hook on its own, so a
# second pin in this workflow would drift without anyone choosing it.
#
# This is its own workflow rather than a job in lint.yml because that
# workflow's path filter is the Rust tree: sharing it would either run
# the half-hour containerised clippy build on a documentation change,
# or leave this job unable to trigger on one.

name: Agent context

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.claude/**'
      - '.pre-commit-config.yaml'
      - '.github/workflows/agent-context.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skillsaw:
    name: skillsaw
    runs-on: [self-hosted, vm, debian-12, s]
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-skillsaw
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      # Into a venv, not the system python: the runners enforce PEP
      # 668, so a bare `pip install` is refused with "error:
      # externally-managed-environment". pre-commit then builds the
      # skillsaw hook its own environment from the pinned rev.
      - name: Install pre-commit
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv-skillsaw"
          "${RUNNER_TEMP}/venv-skillsaw/bin/pip" install --quiet \
              --disable-pip-version-check pre-commit
          echo "${RUNNER_TEMP}/venv-skillsaw/bin" >> "${GITHUB_PATH}"

      # Just this hook. The others have jobs of their own, and running
      # them again here would report the same failure under two names
      # while holding a second runner to do it.
      - name: Lint agent context
        run: pre-commit run skillsaw --all-files
