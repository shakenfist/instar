name: Fix test suite drift with Claude Code

# SECURITY CONSIDERATIONS:
# This workflow can be triggered in two ways:
#
# 1. workflow_dispatch (manual): Safe - only users with write access can trigger
# 2. workflow_call (from pr-fix-tests.yml): Requires careful consideration
#
# When called from issue_comment-triggered workflows:
# - Code from the PR is checked out and tests are executed
# - This intentionally runs untrusted code in a privileged context
# - Security is enforced by:
#   a) Authorization check in the calling workflow (pr-fix-tests.yml)
#      Only repository maintainers can trigger via shakenfist/actions/pr-bot-trigger
#   b) Self-hosted runners provide isolation from production systems
#   c) GITHUB_TOKEN scope is limited to this repository
#   d) The runner is ephemeral/disposable
#
# Risk acceptance: The benefit of automated test fixes outweighs the risk
# because only trusted maintainers can trigger execution.
#
# See: https://securitylab.github.com/research/github-actions-preventing-pwn-requests/

# audit-ok: merge-group-cancellation -- this workflow is reusable, but
# its only caller is pr-fix-tests.yml on issue_comment, so it can never
# run under a merge_group event and has no queue entry to supersede.

on:
  workflow_dispatch:
    inputs:
      max_turns:
        description: 'Maximum Claude turns'
        required: false
        default: '200'
        type: string
      dry_run:
        description: 'Dry run (test only, no PR)'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        description: 'Branch to checkout (for PR-triggered runs)'
        required: false
        type: string
      pr_number:
        description: 'PR number (for PR-triggered runs)'
        required: false
        type: string
      max_turns:
        description: 'Maximum Claude turns'
        required: false
        default: '50'
        type: string
  schedule:
    # Run weekly on Monday at 6am UTC
    - cron: '0 6 * * 1'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  test-and-fix:
    runs-on: [self-hosted, claude-code]
    timeout-minutes: 180
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.pr_number || github.ref }}
      cancel-in-progress: true

    env:
      # Set mode based on whether this is a PR-triggered run
      IS_PR_RUN: ${{ inputs.pr_number != '' }}
      PR_NUMBER: ${{ inputs.pr_number }}
      PR_REF: ${{ inputs.ref }}

    steps:
      - name: Clear stale Claude stream files
        if: always()
        run: |
          # actions/checkout below uses `path: instar`, so it cleans
          # only the checkout -- claude-stream.jsonl and
          # claude-stderr.txt, written at the workspace root by `Run
          # Claude Code to fix issues`, survive into the next run on
          # this self-hosted runner.
          #
          # Extract commit summary, Verify fixes, and Commit changes
          # all gate on steps.claude_fix.outputs.claude_available,
          # which is only set when the Claude step actually ran, so a
          # stale file is never read as this run's output. What IS
          # reachable is `Upload artifacts` below, which runs
          # unconditionally (`if: always()`): a run whose Claude step
          # is skipped (initial tests passed and no prior CI failures)
          # would otherwise upload the *previous* run's
          # claude-stream.jsonl and claude-stderr.txt under this run's
          # artifact name, misleading anyone who opens it. Placed as
          # the first step, ahead of the Claude step's own `if:` gate,
          # so the cleanup happens whether or not that step runs.
          rm -f ${{ github.workspace }}/claude-stream.jsonl \
                ${{ github.workspace }}/claude-stderr.txt

      - name: Set environment variables
        run: |
          {
            echo "DATESTAMP=$(date '+%Y%m%d')"
            echo "DATEPRETTY=$(date '+%-d %B %Y')"
          } >> $GITHUB_ENV

      - name: Checkout instar
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          path: instar
          fetch-depth: 0

      - name: Prepare instar-testdata
        env:
          TESTDATA_TOKEN: ${{ secrets.GITLAB_TESTDATA_TOKEN }}
        run: ${GITHUB_WORKSPACE}/instar/tools/ci/prepare-testdata.sh

      - name: Resparsify test images
        run: |
          # Git operations (clone or pull) fill sparse holes with zeros,
          # affecting qemu-img disk_size output. Restore sparseness with
          # cp --sparse=always. This is fast and idempotent on already-sparse
          # files from the cache.
          cd ${TESTDATA_PATH}
          find downloaded/ -type f \( \
            -name "*.qcow2" -o \
            -name "*.vmdk" -o \
            -name "*.vhd" -o \
            -name "*.vhdx" -o \
            -name "*.img" \
          \) -print0 | while IFS= read -r -d '' file; do
            cp --sparse=always "$file" "$file.sparse"
            mv "$file.sparse" "$file"
          done

      - name: Fetch prior CI failure logs from PR
        id: prior_failures
        if: env.IS_PR_RUN == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching failure details from PR #${PR_NUMBER}..."

          # Get the head SHA of the PR
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" \
            --jq '.head.sha')
          echo "PR head SHA: ${HEAD_SHA}"

          # Find failed check runs on that commit
          FAILED_RUNS=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.conclusion == "failure") | {name, id}]')
          echo "Failed check runs: ${FAILED_RUNS}"

          FAILURE_FILE="${GITHUB_WORKSPACE}/prior-ci-failures.txt"
          echo "" > "${FAILURE_FILE}"

          # For each failed check run, fetch logs and extract failure lines
          for RUN_ID in $(echo "${FAILED_RUNS}" | jq -r '.[].id'); do
            RUN_NAME=$(echo "${FAILED_RUNS}" | jq -r ".[] | select(.id == ${RUN_ID}) | .name")
            echo "=== Failures from check run: ${RUN_NAME} (${RUN_ID}) ===" >> "${FAILURE_FILE}"

            # Fetch job logs and extract FAILED tests with tracebacks
            gh api "repos/${{ github.repository }}/actions/jobs/${RUN_ID}/logs" 2>/dev/null | \
              grep -E "FAILED|Traceback|MismatchError|AssertionError|Error:|Failed [0-9]+ test|Passed:|make:.*Error" \
              >> "${FAILURE_FILE}" 2>/dev/null || true

            echo "" >> "${FAILURE_FILE}"
          done

          if [ -s "${FAILURE_FILE}" ] && grep -q "FAILED\|Error" "${FAILURE_FILE}"; then
            echo "has_prior_failures=true" >> $GITHUB_OUTPUT
            echo "Prior CI failures found:"
            cat "${FAILURE_FILE}"
          else
            echo "has_prior_failures=false" >> $GITHUB_OUTPUT
            echo "No prior CI failures found on this PR."
          fi

      - name: Configure git
        run: |
          git config --global user.name "shakenfist-bot"
          git config --global user.email "bot@shakenfist.com"

      - name: Create working branch
        if: env.IS_PR_RUN != 'true'
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          # Delete local branch if it exists from previous run
          git branch -D test-drift-fix-${DATESTAMP} 2>/dev/null || true
          git checkout -b test-drift-fix-${DATESTAMP}

      - name: Remove previous devcontainers, if any
        run: |
          docker image rm -f instar-build instar-release 2>/dev/null || true

      - name: Build instar
        env:
          DOCKER_BUILDKIT: 1
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          set +e
          make instar 2>&1 | tee ${GITHUB_WORKSPACE}/build-log.txt
          build_exit_code=${PIPESTATUS[0]}
          set -e
          if [ ${build_exit_code} -ne 0 ]; then
            echo "Build failed with exit code ${build_exit_code}"
            exit ${build_exit_code}
          fi

      - name: Run initial tests
        id: initial_test
        continue-on-error: true
        run: |
          cd ${GITHUB_WORKSPACE}/instar

          set +e
          # Run tests inside container for consistent environment
          # Container mounts testdata at /testdata for path consistency
          make test-container TESTDATA_PATH=${TESTDATA_PATH} 2>&1 | tee ${GITHUB_WORKSPACE}/test-output.txt
          test_exit_code=${PIPESTATUS[0]}
          set -e

          if [ ${test_exit_code} -eq 0 ]; then
            echo "tests_passed=true" >> $GITHUB_OUTPUT
          else
            echo "tests_passed=false" >> $GITHUB_OUTPUT
          fi

          exit ${test_exit_code}

      - name: Exit early if nothing to do
        if: |
          steps.initial_test.outputs.tests_passed == 'true' &&
          steps.prior_failures.outputs.has_prior_failures != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "All tests pass and no new images found. Nothing to do."
          if [ "${IS_PR_RUN}" == "true" ]; then
            gh pr comment ${PR_NUMBER} \
              --repo ${{ github.repository }} \
              --body "✅ All tests pass! No fixes needed."
          fi
          exit 0

      - name: Prepare Claude prompt
        if: |
          steps.initial_test.outputs.tests_passed == 'false' ||
          steps.prior_failures.outputs.has_prior_failures == 'true'
        run: |
          cat > ${GITHUB_WORKSPACE}/claude-prompt.txt << 'PROMPT_EOF'
          The instar integration test suite needs attention. Please analyze and
          fix any issues.

          ## Context

          instar is a safe drop-in replacement for qemu-img. The test suite
          compares instar output against qemu-img output to verify compatibility.

          ## Before You Start

          1. Read AGENTS.md to understand the project structure and testing approach
          2. Read the /instar-add-test-image skill at .claude/skills/instar-add-test-image.md
          3. Read docs/quirks.md to understand known qemu-img compatibility quirks

          PROMPT_EOF

          # Add prior CI failure context if available (from the PR's failed check runs)
          if [ "${{ steps.prior_failures.outputs.has_prior_failures }}" == "true" ]; then
            cat >> ${GITHUB_WORKSPACE}/claude-prompt.txt << 'PROMPT_EOF'

          ## Prior CI Failures (from the PR's most recent CI run)

          The following test failures were observed in the PR's CI run. These
          failures triggered this fix attempt. Note: these failures may be
          intermittent — they may not reproduce when you re-run the tests
          locally. If so, investigate whether the tests are flaky (e.g.
          timeouts, resource-dependent) and fix the root cause.

          PROMPT_EOF
            cat ${GITHUB_WORKSPACE}/prior-ci-failures.txt >> ${GITHUB_WORKSPACE}/claude-prompt.txt
          fi

          # Add local test failure context if tests failed on this run
          if [ "${{ steps.initial_test.outputs.tests_passed }}" == "false" ]; then
            cat >> ${GITHUB_WORKSPACE}/claude-prompt.txt << 'PROMPT_EOF'

          ## Local Test Failures (from re-running tests on this runner)

          The following tests failed when re-run. Analyze the output
          differences and fix them:

          PROMPT_EOF
            cat ${GITHUB_WORKSPACE}/test-output.txt >> ${GITHUB_WORKSPACE}/claude-prompt.txt

          elif [ "${{ steps.prior_failures.outputs.has_prior_failures }}" == "true" ]; then
            cat >> ${GITHUB_WORKSPACE}/claude-prompt.txt << 'PROMPT_EOF'

          ## Local Test Results

          Note: All tests PASSED when re-run on this runner. The failures
          above were from the PR's CI run but did not reproduce here. This
          suggests the failures are intermittent. Please investigate the
          failing tests for flakiness (e.g. timeouts, resource sensitivity,
          race conditions) and fix the root cause so they are reliable.

          PROMPT_EOF
          fi

          cat >> ${GITHUB_WORKSPACE}/claude-prompt.txt << 'PROMPT_EOF'

          ## Your Task

          1. Diagnose what's causing test failures (if any)
          2. Fix instar code if needed (src/vmm/src/main.rs, src/operations/info/)
          3. If fixing reveals a new qemu-img quirk:
             - Document in docs/quirks.md
             - Create docs/image_notes/<image-id>.md
             - Update docs/image_notes/README.md
          4. Add any new images to the test suite
          5. Run `make test` to verify all fixes
          6. Run `pre-commit run --all-files` to check formatting
          7. Stage all changes with git add (do NOT commit)
          8. Output a commit summary (see below)

          ## REQUIRED: Commit Summary Output

          After completing your work and staging changes, you MUST output a commit
          summary in the following exact format. This will be used as the git commit
          message, so make it descriptive and specific to what you actually changed:

          ```
          COMMIT_SUMMARY_START
          <First line: 50 chars max, imperative mood, ends with period>

          <Body: Wrap at 72 chars. Explain WHAT changed and WHY. Be specific about
          which files were modified, what the root cause was, and how you fixed it.
          Do not use generic phrases like "fixed test failures" - describe the
          actual technical changes.>
          COMMIT_SUMMARY_END
          ```

          Example of a GOOD commit summary:
          ```
          COMMIT_SUMMARY_START
          Fix VMDK extent size calculation for split volumes.

          The streamOptimized VMDK parser was incorrectly summing extent sizes
          without accounting for descriptor overhead. This caused a 512-byte
          discrepancy in reported virtual size compared to qemu-img.

          Modified src/operations/info/vmdk.rs to subtract the descriptor
          length from the first extent's contribution to total size.
          COMMIT_SUMMARY_END
          ```

          Example of a BAD commit summary (too generic):
          ```
          COMMIT_SUMMARY_START
          Fix test failures.

          Fixed the failing tests so they pass now.
          COMMIT_SUMMARY_END
          ```

          ## STOP: Read These Rules First

          **NEVER run these commands directly - they create root-owned files:**

          - `cargo build`, `cargo test`, `cargo clippy`, `cargo fmt`
          - `docker build`, `docker run`
          - `rustc`, `rustfmt`

          **ALWAYS use these Makefile targets instead:**

          - Build: `make instar`
          - Test: `make test` or `make test-container`
          - Lint: `make lint` or `make lint-fix`

          The pre-built binary is at `src/target/release/instar` - use it directly
          for testing without rebuilding.

          ## Important Notes

          - The testdata is at $INSTAR_TESTDATA_PATH (set in environment)
          - For malicious images, NEVER run qemu-img - use instar only
          - Follow the quirk documentation patterns in existing image_notes files

          ## CRITICAL: Do NOT Build Prototypes

          The prototypes/ directory contains experimental code that is NOT relevant
          to this task. NEVER run any of these commands:

          - `make build-prototype`
          - `make build-all`
          - `make run-prototype`
          - Any command involving the prototypes/ directory

          Building prototypes creates root-owned files that break CI cleanup.
          Your task is ONLY to fix the main instar binary and tests.

          ## CRITICAL: Do NOT Modify instar-testdata

          The instar-testdata repository at $INSTAR_TESTDATA_PATH contains the
          authoritative test baselines. NEVER modify any files in this directory:

          - Do NOT edit files in expected-outputs/
          - Do NOT regenerate baselines or profiles
          - Do NOT run generate-baselines.py or detect-profiles.py

          If tests fail, the fix must be in the instar code (src/), NOT in the
          baseline data. The baselines represent what qemu-img actually outputs
          and must not be changed to match instar's current behavior.

          ## Reminder: Use Make Targets Only

          See "STOP: Read These Rules First" above. Running cargo/docker directly
          creates root-owned files that break CI cleanup. Use `make instar`,
          `make test`, and `make lint` exclusively.
          PROMPT_EOF

          echo "Prompt prepared:"
          cat ${GITHUB_WORKSPACE}/claude-prompt.txt

      - name: Run Claude Code to fix issues
        id: claude_fix
        if: |
          steps.initial_test.outputs.tests_passed == 'false' ||
          steps.prior_failures.outputs.has_prior_failures == 'true'
        continue-on-error: true
        env:
          INSTAR_TESTDATA_PATH: ${{ env.TESTDATA_PATH }}
        run: |
          cd ${GITHUB_WORKSPACE}/instar

          if ! command -v claude &> /dev/null; then
            echo "claude_available=false" >> $GITHUB_OUTPUT
            echo "Error: Claude Code CLI not found"
            exit 1
          fi

          echo "claude_available=true" >> $GITHUB_OUTPUT

          # Record start time to find conversation logs created during this run
          start_time=$(date +%s)

          # stream-json emits one JSON object per line as the run
          # proceeds, so `tee` keeps live output in the CI log and a
          # run killed by the job timeout still leaves a usable prefix.
          # Plain `--output-format json` gives neither: it is written
          # atomically at exit, and on turn exhaustion -- the dominant
          # outcome for a run capped by --max-turns -- it omits
          # `.result` entirely.
          # --verbose is mandatory, not decorative: under --print the
          # CLI refuses stream-json without it. stderr is captured to
          # its own file rather than folded into stdout, both so it
          # cannot corrupt the stream and because a pre-flight CLI
          # error writes there and nowhere else -- that is the file the
          # helper falls back to.
          #
          # The pipe makes the exit status `tee`'s rather than
          # `claude`'s. Nothing here reads it (the step is
          # continue-on-error and ends `|| true`), so there is
          # deliberately no `pipefail`.
          claude -p "$(cat ${GITHUB_WORKSPACE}/claude-prompt.txt)" \
            --dangerously-skip-permissions \
            --max-turns ${{ inputs.max_turns || '50' }} \
            --output-format stream-json \
            --verbose \
            2> ${GITHUB_WORKSPACE}/claude-stderr.txt \
            | tee ${GITHUB_WORKSPACE}/claude-stream.jsonl || true

          # Reduce the stream back to the text file everything
          # downstream reads -- `Extract commit summary` greps it for
          # the COMMIT_SUMMARY markers, and it is what a human opens in
          # the uploaded artifacts -- so that filename must not change.
          # The helper reconstructs the assistant text, appends a
          # diagnostic block when the run reported an error or the
          # stream has no result line, and prints the stderr file
          # verbatim when the stream holds nothing usable at all: a
          # pre-flight CLI refusal writes only to stderr, and losing it
          # would leave the failure with no explanation anywhere.
          tools/ci/claude-result.sh \
            --text ${GITHUB_WORKSPACE}/claude-stream.jsonl \
            --raw-fallback ${GITHUB_WORKSPACE}/claude-stderr.txt \
            > ${GITHUB_WORKSPACE}/claude-output.txt
          cat ${GITHUB_WORKSPACE}/claude-output.txt

          # Collect Claude Code conversation logs for artifacts
          mkdir -p ${GITHUB_WORKSPACE}/claude-logs
          find ~/.claude/projects -name "*.jsonl" -newermt "@${start_time}" \
            -exec cp {} ${GITHUB_WORKSPACE}/claude-logs/ \; 2>/dev/null || true

          # Capture git state for debugging failed attempts
          echo "=== Git Status ===" > ${GITHUB_WORKSPACE}/claude-changes.txt
          git status >> ${GITHUB_WORKSPACE}/claude-changes.txt 2>&1
          echo "" >> ${GITHUB_WORKSPACE}/claude-changes.txt
          echo "=== Staged Changes (git diff --cached) ===" >> ${GITHUB_WORKSPACE}/claude-changes.txt
          git diff --cached >> ${GITHUB_WORKSPACE}/claude-changes.txt 2>&1
          echo "" >> ${GITHUB_WORKSPACE}/claude-changes.txt
          echo "=== Unstaged Changes (git diff) ===" >> ${GITHUB_WORKSPACE}/claude-changes.txt
          git diff >> ${GITHUB_WORKSPACE}/claude-changes.txt 2>&1

      - name: Extract commit summary
        id: extract_summary
        if: steps.claude_fix.outputs.claude_available == 'true'
        run: |
          # Extract Claude's commit summary from output
          if grep -q "COMMIT_SUMMARY_START" ${GITHUB_WORKSPACE}/claude-output.txt; then
            # Extract text between markers, removing the markers themselves
            sed -n '/COMMIT_SUMMARY_START/,/COMMIT_SUMMARY_END/p' \
              ${GITHUB_WORKSPACE}/claude-output.txt | \
              grep -v "COMMIT_SUMMARY_START" | \
              grep -v "COMMIT_SUMMARY_END" | \
              sed 's/^```$//' | \
              sed '/^$/N;/^\n$/d' > ${GITHUB_WORKSPACE}/commit-summary.txt

            # Check if we got meaningful content
            if [ -s ${GITHUB_WORKSPACE}/commit-summary.txt ]; then
              echo "summary_found=true" >> $GITHUB_OUTPUT
              echo "Extracted commit summary:"
              cat ${GITHUB_WORKSPACE}/commit-summary.txt
            else
              echo "summary_found=false" >> $GITHUB_OUTPUT
              echo "Warning: COMMIT_SUMMARY markers found but content was empty"
            fi
          else
            echo "summary_found=false" >> $GITHUB_OUTPUT
            echo "Warning: No COMMIT_SUMMARY markers found in Claude output"
          fi

      - name: Verify fixes
        id: verify
        if: steps.claude_fix.outputs.claude_available == 'true'
        continue-on-error: true
        env:
          DOCKER_BUILDKIT: 1
        run: |
          cd ${GITHUB_WORKSPACE}/instar

          # Rebuild if code changed (test-container depends on instar target)
          if git diff --cached --name-only | grep -q "\.rs$"; then
            echo "Rust code changed, rebuilding..."
            make instar
          fi

          set +e
          # Run tests inside container for consistent environment
          make test-container TESTDATA_PATH=${TESTDATA_PATH} 2>&1 | tee ${GITHUB_WORKSPACE}/verify-output.txt
          verify_exit_code=${PIPESTATUS[0]}
          set -e

          if [ ${verify_exit_code} -eq 0 ]; then
            echo "fix_succeeded=true" >> $GITHUB_OUTPUT
          else
            echo "fix_succeeded=false" >> $GITHUB_OUTPUT
          fi

          exit ${verify_exit_code}

      - name: Commit changes
        if: |
          steps.verify.outputs.fix_succeeded == 'true' &&
          inputs.dry_run != true
        run: |
          cd ${GITHUB_WORKSPACE}/instar

          if [ -n "$(git status --porcelain)" ]; then
            git add -A

            # Build commit message. The trailer is derived from this
            # run's own stream rather than hardcoded: this workflow
            # named a hardcoded Opus release long after the CLI
            # stopped resolving to it. The helper reads the model and
            # context window the run itself reported, and emits an
            # unqualified `Co-Authored-By: Claude` if the stream does
            # not say. Every branch below writes a message file and a
            # single `git commit -F` after the branching applies it,
            # so the derived trailer can be appended without fighting
            # a heredoc's baked-in indentation.
            STREAM="${GITHUB_WORKSPACE}/claude-stream.jsonl"

            # Use Claude's commit summary if available, otherwise use fallback
            if [ "${{ steps.extract_summary.outputs.summary_found }}" == "true" ] && \
               [ -s ${GITHUB_WORKSPACE}/commit-summary.txt ]; then
              # Append attribution to Claude's summary
              {
                cat ${GITHUB_WORKSPACE}/commit-summary.txt
                echo ""
                if [ "${IS_PR_RUN}" == "true" ]; then
                  echo "Triggered-By: @shakenfist-bot please attempt to fix on PR #${PR_NUMBER}"
                fi
                tools/ci/claude-result.sh --trailer "${STREAM}"
              } > ${GITHUB_WORKSPACE}/commit-message.txt
            else
              # Fallback to generic message if no summary found
              if [ "${IS_PR_RUN}" == "true" ]; then
                {
                  echo "Fix test failures on PR #${PR_NUMBER}."
                  echo ""
                  echo "Claude Code automatically fixed test failures."
                  echo ""
                  echo "Triggered-By: @shakenfist-bot please attempt to fix on PR #${PR_NUMBER}"
                  tools/ci/claude-result.sh --trailer "${STREAM}"
                } > ${GITHUB_WORKSPACE}/commit-message.txt
              else
                {
                  echo "Fix test suite drift for ${DATESTAMP}."
                  echo ""
                  echo "Claude Code automatically fixed test failures and/or added new"
                  echo "test images to the integration test suite."
                  echo ""
                  tools/ci/claude-result.sh --trailer "${STREAM}"
                } > ${GITHUB_WORKSPACE}/commit-message.txt
              fi
            fi

            git commit -F ${GITHUB_WORKSPACE}/commit-message.txt
          fi

      - name: Push changes (PR mode)
        if: |
          env.IS_PR_RUN == 'true' &&
          steps.verify.outputs.fix_succeeded == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ${GITHUB_WORKSPACE}/instar
          git push origin ${PR_REF}

          gh pr comment ${PR_NUMBER} \
            --repo ${{ github.repository }} \
            --body "✅ Claude Code fixed the test failures and pushed the changes.

          Please review the new commits."

      - name: Push and create PR (scheduled/manual mode)
        if: |
          env.IS_PR_RUN != 'true' &&
          steps.verify.outputs.fix_succeeded == 'true' &&
          inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ${GITHUB_WORKSPACE}/instar

          git push -f origin test-drift-fix-${DATESTAMP}
          sleep 5

          # Determine PR title - use commit summary first line if available
          if [ "${{ steps.extract_summary.outputs.summary_found }}" == "true" ] && \
             [ -s ${GITHUB_WORKSPACE}/commit-summary.txt ]; then
            # Extract first line (commit title) and remove trailing period for PR title
            PR_TITLE=$(head -1 ${GITHUB_WORKSPACE}/commit-summary.txt | sed 's/\.$//')
            # Get the rest of the commit message for the body
            COMMIT_BODY=$(tail -n +3 ${GITHUB_WORKSPACE}/commit-summary.txt)
          else
            PR_TITLE="Fix test suite drift (${DATESTAMP})"
            COMMIT_BODY="Claude Code automatically fixed test failures and/or added new test images to the integration test suite."
          fi

          gh pr create \
            --assignee mikalstill \
            --reviewer mikalstill \
            --title "${PR_TITLE}" \
            --body "$(cat <<EOF
          ## Summary

          ${COMMIT_BODY}

          ## Changes

          $(git diff --stat HEAD~1)

          ## Verification

          All tests pass after these changes.

          ---
          🤖 Generated with [Claude Code](https://claude.com/claude-code)
          EOF
          )" \
            --head $(git branch --show-current)

      - name: Report failure (PR mode)
        if: |
          env.IS_PR_RUN == 'true' &&
          (steps.initial_test.outputs.tests_passed == 'false' ||
           steps.prior_failures.outputs.has_prior_failures == 'true') &&
          (steps.claude_fix.outputs.claude_available != 'true' ||
           steps.verify.outputs.fix_succeeded == 'false')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TEST_OUTPUT=$(tail -c 2000 ${GITHUB_WORKSPACE}/test-output.txt 2>/dev/null || echo "See workflow logs for details.")

          gh pr comment ${PR_NUMBER} \
            --repo ${{ github.repository }} \
            --body "❌ Claude Code was unable to fix the test failures automatically.

          [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          **Last 2KB of test output:**
          \`\`\`
          ${TEST_OUTPUT}
          \`\`\`"

      - name: Create issue for unfixable problems (scheduled/manual mode)
        if: |
          env.IS_PR_RUN != 'true' &&
          (steps.initial_test.outputs.tests_passed == 'false' ||
           steps.prior_failures.outputs.has_prior_failures == 'true') &&
          (steps.claude_fix.outputs.claude_available != 'true' ||
           steps.verify.outputs.fix_succeeded == 'false')
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let testOutput = 'See workflow logs for details.';
            try {
              testOutput = fs.readFileSync(
                process.env.GITHUB_WORKSPACE + '/test-output.txt', 'utf8'
              ).slice(-3000);  // Last 3KB
            } catch (e) {}

            const claudeAvailable =
              '${{ steps.claude_fix.outputs.claude_available }}' === 'true';
            const reason = claudeAvailable
              ? 'Claude Code was unable to fix them automatically'
              : 'Claude Code CLI was not available on the runner';

            const workflowUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The test suite has issues that ${reason}.`,
              '',
              '**Test output (last 3KB):**',
              '```',
              testOutput,
              '```',
              '',
              `See [workflow run](${workflowUrl}) for full details.`
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Test suite drift needs attention (${process.env.DATESTAMP})`,
              body: body,
              labels: ['test-failure', 'needs-attention']
            });

      - name: Gzip Claude stream
        if: always()
        run: |
          # claude-logs/ already holds the CLI's own session transcript
          # in a different format, but claude-stream.jsonl is the raw
          # bytes tools/ci/claude-result.sh actually parsed -- including
          # every tool result (file contents, diffs, build output) --
          # which is genuinely useful when debugging the helper itself,
          # so it stays, just compressed: over a run on this Rust tree
          # it easily runs tens of megabytes uncompressed, against a
          # 14-day retention.
          #
          # This has to run after `Commit changes`, which is the last
          # step to read the raw stream (it derives the commit trailer
          # from claude-stream.jsonl) -- gzipping any earlier would
          # break that read.
          if [ -f ${{ github.workspace }}/claude-stream.jsonl ]; then
            gzip -f ${{ github.workspace }}/claude-stream.jsonl
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.pr_number != '' && format('pr-fix-logs-{0}', inputs.pr_number) || format('test-drift-fix-logs-{0}', github.run_id) }}
          path: |
            ${{ github.workspace }}/build-log.txt
            ${{ github.workspace }}/test-output.txt
            ${{ github.workspace }}/verify-output.txt
            ${{ github.workspace }}/claude-output.txt
            ${{ github.workspace }}/claude-stream.jsonl.gz
            ${{ github.workspace }}/claude-stderr.txt
            ${{ github.workspace }}/claude-prompt.txt
            ${{ github.workspace }}/claude-changes.txt
            ${{ github.workspace }}/commit-summary.txt
            ${{ github.workspace }}/commit-message.txt
            ${{ github.workspace }}/new-images.txt
            ${{ github.workspace }}/claude-logs/
            ${{ github.workspace }}/fs-info.txt
            ${{ github.workspace }}/prior-ci-failures.txt
          retention-days: 14
