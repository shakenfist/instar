name: Sanity Checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'crates/**'
      - 'Makefile'
      - '.github/workflows/sanity-checks.yml'
  workflow_dispatch:

jobs:
  sanity-checks:
    runs-on: [self-hosted, debian-12, s]
    timeout-minutes: 30

    env:
      DOCKER_BUILDKIT: 1
      # Limit parallelism to reduce memory usage (s worker has 4GB RAM)
      CARGO_BUILD_JOBS: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo chmod 666 /var/run/docker.sock

      - name: Remove previous devcontainers, if any
        run: |
          docker image rm -f imago-build 2>/dev/null || true

      - name: Build and test via devcontainer
        run: |
          # Build the devcontainer and run cargo build + test inside it
          make imago
          # Run unit tests inside the container
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/build \
            -e CARGO_HOME=/build/.cargo \
            -e CARGO_BUILD_JOBS=2 \
            -v "$(pwd):/workspace" \
            -v "$(pwd)/.cargo-cache/registry:/build/.cargo/registry" \
            -v "$(pwd)/.cargo-cache/git:/build/.cargo/git" \
            -w "/workspace/src/vmm" \
            imago-build \
            cargo test --release

      - name: Test config commands in container
        run: |
          # Run all config tests inside the container to avoid glibc mismatch
          docker run --rm \
            -v "$(pwd):/workspace" \
            -w "/workspace" \
            imago-build \
            bash -c '
              set -e

              # Setup system config directory
              mkdir -p /etc/imago
              cat > /etc/imago/config << EOF
          # System-wide imago configuration for CI testing

          [global]
          verbose = false
          output = "human"

          [security]
          backing-path-allowlist = [
              "\$IMAGE_DIR",
              "/var/lib/libvirt/images",
          ]
          max-chain-depth = 16

          [convert]
          sparse = true
          progress = false

          [copy]
          skip-zeros = false
          verify = false
          EOF

              # Setup user config directory
              mkdir -p ~/.config/imago
              cat > ~/.config/imago/config << EOF
          # User imago configuration for CI testing

          [global]
          verbose = true

          [security]
          backing-path-allowlist = [
              "\$IMAGE_DIR",
              "\$CWD",
              "/tmp/test-images",
          ]

          [copy]
          skip-zeros = true
          EOF

              echo "=== Testing: imago config ==="
              ./src/target/release/imago config

              echo ""
              echo "=== Testing: imago config --show-sources ==="
              ./src/target/release/imago config --show-sources

              echo ""
              echo "=== Testing: imago config --validate ==="
              ./src/target/release/imago config --validate

              echo ""
              echo "=== Verifying config layering ==="
              OUTPUT=$(./src/target/release/imago config --show-sources)

              # Verify verbose=true comes from user config (overrides system false)
              if echo "$OUTPUT" | grep -q "verbose = true.*~/.config/imago/config"; then
                echo "PASS: User config overrides system config for verbose"
              else
                echo "FAIL: Expected verbose=true from user config"
                echo "$OUTPUT"
                exit 1
              fi

              # Verify backing-path-allowlist comes from user config
              if echo "$OUTPUT" | grep -q "backing-path-allowlist.*~/.config/imago/config"; then
                echo "PASS: User config overrides system config for backing-path-allowlist"
              else
                echo "FAIL: Expected backing-path-allowlist from user config"
                echo "$OUTPUT"
                exit 1
              fi

              # Verify skip-zeros comes from user config
              if echo "$OUTPUT" | grep -q "skip-zeros = true.*~/.config/imago/config"; then
                echo "PASS: User config overrides system config for skip-zeros"
              else
                echo "FAIL: Expected skip-zeros=true from user config"
                echo "$OUTPUT"
                exit 1
              fi

              # Verify sparse comes from system config (not overridden by user)
              if echo "$OUTPUT" | grep -q "sparse = true.*/etc/imago/config"; then
                echo "PASS: System config value preserved when not overridden"
              else
                echo "FAIL: Expected sparse=true from system config"
                echo "$OUTPUT"
                exit 1
              fi

              echo "All layering tests passed!"

              echo ""
              echo "=== Testing invalid config detection ==="
              cat > /tmp/bad-config << EOF
          [global
          verbose = true
          EOF

              mv ~/.config/imago/config ~/.config/imago/config.bak
              cp /tmp/bad-config ~/.config/imago/config

              set +e
              ./src/target/release/imago config --validate
              EXIT_CODE=$?
              set -e

              mv ~/.config/imago/config.bak ~/.config/imago/config

              if [ $EXIT_CODE -ne 0 ]; then
                echo "PASS: Invalid config correctly detected"
              else
                echo "FAIL: Invalid config was not detected"
                exit 1
              fi

              echo ""
              echo "All config tests passed!"
            '

  integration-tests:
    needs: sanity-checks
    runs-on: [self-hosted, debian-12, xl]
    timeout-minutes: 60

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout imago
        uses: actions/checkout@v4
        with:
          path: imago
          fetch-depth: 0

      - name: Checkout imago-testdata from GitLab
        run: |
          git clone --depth 1 \
            http://oauth2:${{ secrets.GITLAB_TESTDATA_TOKEN }}@gitlab.home.stillhq.com/private/imago-testdata.git \
            imago-testdata

      - name: Resparsify test images
        run: |
          # Git streaming fills sparse holes with zeros, affecting qemu-img
          # disk_size output. Restore sparseness using cp --sparse=always,
          # which is more robust than fallocate -d for files with partial
          # zero blocks or complex sparse patterns.
          cd ${GITHUB_WORKSPACE}/imago-testdata
          find downloaded/ -type f \( \
            -name "*.qcow2" -o \
            -name "*.vmdk" -o \
            -name "*.vhd" -o \
            -name "*.vhdx" -o \
            -name "*.img" \
          \) -print0 | while IFS= read -r -d '' file; do
            cp --sparse=always "$file" "$file.sparse"
            mv "$file.sparse" "$file"
          done

      - name: Check filesystem block size
        run: |
          # Baselines were generated with 4096-byte block size. Different block
          # sizes can affect qemu-img disk_size reporting due to allocation
          # rounding differences.
          EXPECTED_BLOCK_SIZE=4096
          ACTUAL_BLOCK_SIZE=$(stat -f -c '%S' ${GITHUB_WORKSPACE}/imago-testdata/downloaded/)

          echo "Filesystem block size: ${ACTUAL_BLOCK_SIZE} bytes"
          echo "Expected block size: ${EXPECTED_BLOCK_SIZE} bytes"

          if [ "${ACTUAL_BLOCK_SIZE}" != "${EXPECTED_BLOCK_SIZE}" ]; then
            echo ""
            echo "WARNING: Filesystem block size mismatch!"
            echo "Baselines were generated on a filesystem with ${EXPECTED_BLOCK_SIZE}-byte blocks."
            echo "This runner has ${ACTUAL_BLOCK_SIZE}-byte blocks."
            echo "This may cause disk_size mismatches in qemu-img output."
          else
            echo "Block size matches expected value."
          fi

      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo chmod 666 /var/run/docker.sock

      - name: Remove previous devcontainers, if any
        run: |
          docker image rm -f imago-build 2>/dev/null || true

      - name: Build imago
        run: |
          cd ${GITHUB_WORKSPACE}/imago
          set +e
          make imago 2>&1 | tee ${GITHUB_WORKSPACE}/build-log.txt
          build_exit_code=${PIPESTATUS[0]}
          set -e
          if [ ${build_exit_code} -ne 0 ]; then
            echo "Build failed with exit code ${build_exit_code}"
            exit ${build_exit_code}
          fi

      - name: Run integration tests
        run: |
          cd ${GITHUB_WORKSPACE}/imago
          make test-container TESTDATA_PATH=${GITHUB_WORKSPACE}/imago-testdata 2>&1 | tee ${GITHUB_WORKSPACE}/test-output.txt

      - name: Test --chain flag (backing chain discovery)
        run: |
          cd ${GITHUB_WORKSPACE}/imago
          TESTDATA=${GITHUB_WORKSPACE}/imago-testdata

          echo "=== Testing --chain with 2-level chain (shakenfist/vda) ==="
          OUTPUT=$(docker run --rm \
            --device /dev/kvm \
            -v "$(pwd)/src/target/release/imago:/imago:ro" \
            -v "${TESTDATA}/downloaded/shakenfist:/images:ro" \
            imago-build \
            /imago info --chain /images/vda 2>&1)
          echo "$OUTPUT"

          # Verify chain has 2 images
          COUNT=$(echo "$OUTPUT" | grep -c "^image:" || true)
          if [ "$COUNT" -eq 2 ]; then
            echo "PASS: 2-level chain detected correctly"
          else
            echo "FAIL: Expected 2 images in chain, got $COUNT"
            exit 1
          fi

          # Verify backing file is reported
          if echo "$OUTPUT" | grep -q "backing-file:"; then
            echo "PASS: backing-file field present"
          else
            echo "FAIL: backing-file field missing"
            exit 1
          fi

          echo ""
          echo "=== Testing --chain with 2-level chain (edge-cases/overlay) ==="
          OUTPUT=$(docker run --rm \
            --device /dev/kvm \
            -v "$(pwd)/src/target/release/imago:/imago:ro" \
            -v "${TESTDATA}/downloaded/edge-cases:/images:ro" \
            imago-build \
            /imago info --chain /images/overlay_chain.qcow2 2>&1)
          echo "$OUTPUT"

          COUNT=$(echo "$OUTPUT" | grep -c "^image:" || true)
          if [ "$COUNT" -eq 2 ]; then
            echo "PASS: 2-level chain detected correctly"
          else
            echo "FAIL: Expected 2 images in chain, got $COUNT"
            exit 1
          fi

          echo ""
          echo "=== Testing --chain with 3-level mixed-format chain ==="
          OUTPUT=$(docker run --rm \
            --device /dev/kvm \
            -v "$(pwd)/src/target/release/imago:/imago:ro" \
            -v "${TESTDATA}/custom/backing-layers-format-change:/images:ro" \
            imago-build \
            /imago info --chain /images/top.qcow2 2>&1)
          echo "$OUTPUT"

          COUNT=$(echo "$OUTPUT" | grep -c "^image:" || true)
          if [ "$COUNT" -eq 3 ]; then
            echo "PASS: 3-level chain detected correctly"
          else
            echo "FAIL: Expected 3 images in chain, got $COUNT"
            exit 1
          fi

          # Verify format changes are reported (qcow2 -> qcow2 -> vmdk)
          if echo "$OUTPUT" | grep -q "format: vmdk"; then
            echo "PASS: VMDK base format detected in mixed chain"
          else
            echo "FAIL: VMDK base format not detected"
            exit 1
          fi

          echo ""
          echo "=== Testing --chain with single image (no backing) ==="
          OUTPUT=$(docker run --rm \
            --device /dev/kvm \
            -v "$(pwd)/src/target/release/imago:/imago:ro" \
            -v "${TESTDATA}/downloaded/public-clouds:/images:ro" \
            imago-build \
            /imago info --chain /images/debian-12-genericcloud-amd64-20240507-1740.qcow2 2>&1)
          echo "$OUTPUT"

          COUNT=$(echo "$OUTPUT" | grep -c "^image:" || true)
          if [ "$COUNT" -eq 1 ]; then
            echo "PASS: Single image chain (no backing) detected correctly"
          else
            echo "FAIL: Expected 1 image in chain, got $COUNT"
            exit 1
          fi

          echo ""
          echo "All --chain tests passed!"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: |
            ${{ github.workspace }}/build-log.txt
            ${{ github.workspace }}/test-output.txt
          retention-days: 7
