name: Coverage-Guided Fuzzing

on:
  # Nightly: all targets, per-target durations tiered against a 450-min
  # budget (deep parser targets get the larger share; see the schedule
  # branch below and tools/ci/fuzz-tier.sh)
  schedule:
    - cron: '0 4 * * *'

  # PR validation: build + single-target smoke test
  pull_request:
    paths:
      - 'src/fuzz/**'
      - 'src/crates/**'
      - 'src/shared/**'
      - '.github/workflows/coverage-fuzz.yml'
      - 'scripts/extract-fuzz-corpus.py'
      - 'tools/ci/fuzz-tier.sh'
      - 'tools/ci/report-fuzz-crash.sh'
      - 'tools/ci/pick-fuzz-artifact.sh'

  # No push trigger, deliberately. There was a post-merge smoke run of
  # every target for 15s on each push to develop touching src/. It cost
  # about 75 minutes of an `xl` runner per merge -- the seeding and the
  # build, not the fuzzing -- taken from the pool the merge queue waits
  # on, and it was a strictly weaker copy of the nightly, which runs
  # the same targets for minutes each within a day. It last found
  # anything in August. A merged change that crashes a target is found
  # by the next nightly; one that breaks the fuzz build is found by the
  # pull_request run above when it touches fuzz or crate code.

  # Manual: configurable duration and target selection
  workflow_dispatch:
    inputs:
      duration:
        description: 'Fuzz duration per target (seconds)'
        required: false
        default: '1500'
        type: string
      targets:
        description: 'Comma-separated target names (empty = all)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  issues: write

jobs:
  coverage-fuzz:
    # `instar` asks the fleet for a runner carrying the pre-seeded
    # instar-testdata dependencies disk, which is what lets the step below
    # require the cache instead of cloning 7.46 GiB. The label is verified
    # alongside `debian-13` only -- see "Test Data Location" in
    # docs/testing.md.
    runs-on: [self-hosted, debian-13, xl, instar]
    timeout-minutes: 480

    env:
      DOCKER_BUILDKIT: 1

    steps:
      # First, so the deadline is measured from as near the job's own
      # start as a step can get. The fuzzing below is sized from it rather
      # than from a fixed budget: a fixed 450 minutes left 30 for
      # everything else in the job, and when seeding the corpus went from
      # two minutes to twenty-five on the testdata disk (cold reads of the
      # whole accumulated corpus, where a fresh clone had left it in the
      # page cache) the nightly was killed mid-fuzz on seven nights out of
      # nine, losing the corpus push after it (#519). 480 is the
      # timeout-minutes above; GitHub offers no way to read it back, so
      # change the two together.
      - name: Record the job's deadline
        run: echo "FUZZ_DEADLINE=$(( $(date +%s) + 480 * 60 ))" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare instar-testdata
        env:
          TESTDATA_TOKEN: ${{ secrets.GITLAB_TESTDATA_TOKEN }}
          # The job asked for the testdata disk above, so a cache that is not
          # there is an infrastructure fault and not a cue to clone.
          TESTDATA_REQUIRE_CACHE: '1'
        run: ${GITHUB_WORKSPACE}/tools/ci/prepare-testdata.sh

      - name: Verify corpus push token
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          PUSH_TOKEN: ${{ secrets.GITLAB_TESTDATA_PUSH_TOKEN }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::GITLAB_TESTDATA_PUSH_TOKEN is not set"
            exit 1
          fi
          # Verify write access using the cached testdata repo
          cd "${TESTDATA_PATH}"
          git remote set-url origin \
            "https://oauth2:${PUSH_TOKEN}@gitlab.home.stillhq.com/private/instar-testdata.git"
          mkdir -p custom/fuzz-corpus
          date -u '+%Y-%m-%dT%H:%M:%SZ' > custom/fuzz-corpus/last-coverage-run.txt
          git add custom/fuzz-corpus/last-coverage-run.txt
          git -c user.name="CI Fuzzer" \
              -c user.email="bot@shakenfist.com" \
              commit -m "Coverage fuzz run started $(date -u +%Y-%m-%d)"
          git push origin HEAD
          echo "Corpus push token is valid (write verified)"

      - name: Install Docker
        run: tools/ci/install-docker.sh

      - name: Remove previous devcontainers, if any
        run: |
          docker image rm -f instar-build 2>/dev/null || true

      - name: Build devcontainer
        run: |
          make instar-devcontainer

      - name: Install GitHub CLI on host
        run: tools/ci/install-gh-cli.sh

      - name: Ensure security-audit label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "security-audit" \
            --description "Findings from security audit and fuzzing" \
            --color "D93F0B" \
            2>/dev/null || true

      - name: Determine fuzz duration
        id: params
        env:
          INPUT_DURATION: ${{ inputs.duration }}
          INPUT_TARGETS: ${{ inputs.targets }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DURATION=${INPUT_DURATION}
            TARGETS=${INPUT_TARGETS}

            # Capped to what fits before the job's deadline in the run
            # step, once the build has taken what it takes.
            echo "duration=${DURATION}" >> $GITHUB_OUTPUT
            echo "targets=${TARGETS}" >> $GITHUB_OUTPUT
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            # Build + single target smoke test
            echo "duration=10" >> $GITHUB_OUTPUT
            echo "targets=fuzz_format_detect" >> $GITHUB_OUTPUT
          else
            # schedule (nightly) — per-target durations are tiered in the
            # run step via tools/ci/fuzz-tier.sh against NIGHTLY_BUDGET_SECONDS
            # (450 min), so this uniform `duration` is unused for nightly and
            # is emitted only as a defensive fallback. When the deep-tier
            # share drops near the fast-tier floor, shard across jobs rather
            # than cut further (see docs/testing.md, "CI integration").
            echo "duration=1000" >> $GITHUB_OUTPUT
            echo "targets=" >> $GITHUB_OUTPUT
          fi

      - name: Seed corpus from testdata
        run: |
          python3 scripts/extract-fuzz-corpus.py \
            --testdata "${TESTDATA_PATH}"

      - name: Run coverage-guided fuzzing
        env:
          FUZZ_DURATION: ${{ steps.params.outputs.duration }}
          FUZZ_TARGETS: ${{ steps.params.outputs.targets }}
          EVENT_NAME: ${{ github.event_name }}
          # Nightly per-target durations are tiered (see tools/ci/fuzz-tier.sh):
          # the deep parser targets split the wall-clock budget while the
          # fast-saturating targets take a short fixed slice. The budget is
          # whatever is left before FUZZ_DEADLINE once the targets are
          # built, less FUZZ_RESERVE_SECONDS, and never more than
          # NIGHTLY_BUDGET_SECONDS (450 min, which a quick setup reaches).
          NIGHTLY_BUDGET_SECONDS: '27000'
          FAST_TIER_SECONDS: '300'
          # What the steps after this one need: the corpus push's own
          # 20-minute timeout, plus ten minutes for crash reporting, a
          # container start per target, libFuzzer finishing its last
          # input, and the log upload. Crash minimisation is bounded on
          # its own, against FUZZ_DEADLINE, below.
          FUZZ_RESERVE_SECONDS: '1800'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p coverage-fuzz-logs .cargo-cache/registry .cargo-cache/git

          # Build fuzz targets inside container
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/build \
            -e CARGO_HOME=/build/.cargo \
            -v "$(pwd):/workspace" \
            -v "$(pwd)/.cargo-cache/registry:/build/.cargo/registry" \
            -v "$(pwd)/.cargo-cache/git:/build/.cargo/git" \
            -w "/workspace/src/fuzz" \
            instar-build \
            bash -c "
              set -o pipefail
              cargo fuzz build 2>&1 | tee /workspace/coverage-fuzz-logs/build.log
            "

          # Determine target list
          if [ -n "$FUZZ_TARGETS" ]; then
            IFS=',' read -ra TARGETS <<< "$FUZZ_TARGETS"
          else
            TARGETS=(
              fuzz_format_detect
              fuzz_qcow2_header
              fuzz_qcow2_l1l2
              fuzz_qcow2_refcount
              fuzz_qcow2_decompress
              fuzz_vmdk_header
              fuzz_vmdk_grain
              fuzz_vhd_footer
              fuzz_vhd_bat
              fuzz_vhd_parent
              fuzz_vhdx_header
              fuzz_vhdx_metadata
              fuzz_vhdx_parent
              fuzz_raw_partition
              fuzz_luks_header
              fuzz_measure_calc
              fuzz_measure_scan
              fuzz_map_iter
              fuzz_create_emitters
              fuzz_resize_planners
              fuzz_rebase_planners
              fuzz_commit_planners
              fuzz_amend_planners
              fuzz_snapshot_parse
              fuzz_snapshot_refcount
              fuzz_check_repair
              fuzz_bitmap_parse
              fuzz_bitmap_planners
              fuzz_dd_window
              fuzz_chs_rounded_size
              fuzz_dd_read
              fuzz_bench_schedule
              fuzz_qcow2_write
              fuzz_qcow2_write_growth
              fuzz_vdi_header
              fuzz_vdi_bat
              fuzz_parallels_header
              fuzz_parallels_bat
              fuzz_qcow1_header
              fuzz_qcow1_table
              fuzz_dmg_table
              fuzz_dmg_chunk
              fuzz_chain_compose
            )
          fi

          # What fits before the deadline, measured now that the build
          # is done rather than guessed at the top of the job.
          BUDGET=$(tools/ci/fuzz-tier.sh budget \
            "$FUZZ_DEADLINE" "$FUZZ_RESERVE_SECONDS" "$NIGHTLY_BUDGET_SECONDS")
          echo "Fuzzing budget: ${BUDGET}s of ${NIGHTLY_BUDGET_SECONDS}s"

          # Build the per-target run plan as "<target> <duration>" lines.
          # The nightly schedule tiers durations via tools/ci/fuzz-tier.sh
          # so the deep parser targets get most of the budget; every other
          # event type runs each target for the uniform params duration,
          # which a manual run may not stretch past the budget either.
          if [ "$EVENT_NAME" = "schedule" ]; then
            PLAN=$(tools/ci/fuzz-tier.sh plan \
              "$BUDGET" "$FAST_TIER_SECONDS" "${TARGETS[@]}")
          else
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              MAX_DURATION=$(( BUDGET / ${#TARGETS[@]} ))
              [ "$MAX_DURATION" -lt 1 ] && MAX_DURATION=1
              if [ "$FUZZ_DURATION" -gt "$MAX_DURATION" ]; then
                echo "::warning::Capping duration from ${FUZZ_DURATION}s to ${MAX_DURATION}s to fit timeout"
                FUZZ_DURATION=$MAX_DURATION
              fi
            fi
            PLAN=$(for T in "${TARGETS[@]}"; do echo "$T $FUZZ_DURATION"; done)
          fi
          echo "Run plan (target duration):"
          echo "$PLAN"

          CRASHES_FOUND=0
          REPORT_FAILURES=0
          NO_ARTIFACT=0

          while read -r TARGET DURATION; do
            [ -z "$TARGET" ] && continue
            echo "=== Fuzzing $TARGET for ${DURATION}s ==="

            # Run fuzzer inside container
            EXIT_CODE=0
            docker run --rm \
              -u "$(id -u):$(id -g)" \
              -e HOME=/build \
              -e CARGO_HOME=/build/.cargo \
              -v "$(pwd):/workspace" \
              -v "$(pwd)/.cargo-cache/registry:/build/.cargo/registry" \
              -v "$(pwd)/.cargo-cache/git:/build/.cargo/git" \
              -w "/workspace/src/fuzz" \
              instar-build \
              bash -c "
                set -o pipefail
                cargo fuzz run $TARGET \
                  -- -max_total_time=$DURATION \
                     -max_len=4194304 \
                     -rss_limit_mb=4096 \
                  2>&1 | tee /workspace/coverage-fuzz-logs/${TARGET}.log
              " || EXIT_CODE=$?

            if [ $EXIT_CODE -ne 0 ]; then
              # Not necessarily a crash: cargo fuzz also exits non-zero
              # for a build error or an OOM. Which it was is decided by
              # whether an artifact turned up, below.
              echo "!!! $TARGET exited non-zero (code $EXIT_CODE) !!!"
              CRASHES_FOUND=$((CRASHES_FOUND + 1))

              # Which artifact to report is a decision with its own
              # failure modes, and it used to live here as inline YAML
              # with no test -- which is how it shipped a bug that could
              # report a 0-byte file as the reproducer. See
              # tools/ci/pick-fuzz-artifact.sh.
              CRASH_FILE=$(tools/ci/pick-fuzz-artifact.sh crash \
                "src/fuzz/artifacts/$TARGET/")
              if [ -n "$CRASH_FILE" ]; then
                # Minimisation is the one thing after the fuzzing whose
                # length is set by the input rather than by us, once per
                # crashing target. Each gets at most two minutes, and no
                # more than leaves the corpus push its 20 (plus five for
                # the rest) before FUZZ_DEADLINE, so a night with several
                # crashes reports some unminimised rather than losing the
                # push. The timeout is on the docker client, with --init
                # so the signal it forwards ends the whole container; one
                # inside would kill cargo and leave libFuzzer holding the
                # tee open. A partly minimised input is still used below.
                TMIN_SECONDS=$(tools/ci/fuzz-tier.sh budget "$FUZZ_DEADLINE" 1500 120)
              fi
              if [ -n "$CRASH_FILE" ] && [ "$TMIN_SECONDS" -gt 0 ]; then
                echo "Minimizing crash: $CRASH_FILE (at most ${TMIN_SECONDS}s)"
                # No -max_len here: cargo fuzz tmin passes its own, and
                # a second one trips libFuzzer's
                # `assert(MaxInputLen == 0)` so minimization always fails.
                timeout -k 30 "$TMIN_SECONDS" docker run --rm --init \
                  -u "$(id -u):$(id -g)" \
                  -e HOME=/build \
                  -e CARGO_HOME=/build/.cargo \
                  -v "$(pwd):/workspace" \
                  -v "$(pwd)/.cargo-cache/registry:/build/.cargo/registry" \
                  -v "$(pwd)/.cargo-cache/git:/build/.cargo/git" \
                  -w "/workspace/src/fuzz" \
                  instar-build \
                  bash -c "
                    set -o pipefail
                    cargo fuzz tmin $TARGET /workspace/$CRASH_FILE \
                      2>&1 | tee /workspace/coverage-fuzz-logs/${TARGET}-tmin.log
                  " || true

                # Report the minimized input when tmin produced one:
                # otherwise the issue quotes the size of, and the
                # reproducer points at, the original large artifact,
                # and minimization costs CI time for nothing.
                MIN_FILE=$(tools/ci/pick-fuzz-artifact.sh minimized \
                  "src/fuzz/artifacts/$TARGET/")
                if [ -n "$MIN_FILE" ]; then
                  echo "Minimized to: $MIN_FILE"
                  CRASH_FILE=$MIN_FILE
                fi
              fi

              if [ -n "$CRASH_FILE" ]; then
                # Reporting must never end the run: the remaining targets
                # still have to be fuzzed. Failures are counted and turned
                # into a failure in the final step, so a fuzz run that
                # could not tell anyone about a crash is never silently
                # green.
                if ! tools/ci/report-fuzz-crash.sh "$TARGET" "$CRASH_FILE" \
                    "coverage-fuzz-logs/${TARGET}.log"; then
                  echo "::warning::Could not file an issue for the" \
                    "$TARGET crash; the crash input and logs are in" \
                    "this run's artifacts."
                  REPORT_FAILURES=$((REPORT_FAILURES + 1))
                fi
              else
                # `cargo fuzz run` also exits non-zero for build errors
                # and container/OOM failures, which leave no artifact
                # behind. Counted separately so the run says "check the
                # build" rather than blaming the crash reporter.
                echo "::warning::$TARGET exited non-zero but left no" \
                  "crash artifact."
                NO_ARTIFACT=$((NO_ARTIFACT + 1))
              fi
            fi

            echo "=== Completed $TARGET ==="
          done <<< "$PLAN"

          echo "Total crashes found: $CRASHES_FOUND"
          echo "crashes_found=$CRASHES_FOUND" >> $GITHUB_ENV

          # A run where every crash was filed successfully is green, so
          # put the counts somewhere a reader sees without opening the
          # step log.
          {
            echo "### Coverage fuzz"
            echo ""
            echo "- targets fuzzed: $(echo "$PLAN" | grep -c .)"
            echo "- fuzzing budget: ${BUDGET}s of ${NIGHTLY_BUDGET_SECONDS}s"
            echo "- non-zero exits: $CRASHES_FOUND"
            echo "- could not be reported: $REPORT_FAILURES"
            echo "- exited without an artifact: $NO_ARTIFACT"
          } >> $GITHUB_STEP_SUMMARY

          # Deliberately does NOT fail here. Failing this step would skip
          # the corpus push below, throwing away the night's new corpus
          # -- one of the three harms the original bug caused. The counts
          # are handed to the final step instead, which runs with
          # always() after everything that persists work.
          echo "report_failures=$REPORT_FAILURES" >> $GITHUB_ENV
          echo "no_artifact_targets=$NO_ARTIFACT" >> $GITHUB_ENV

      # This step is the point of the nightly run, not its epilogue:
      # coverage-guided fuzzing only gets deeper if the corpus survives
      # the run that produced it. It is also the step the job used to
      # die on -- five of six scheduled runs in August were killed by
      # `timeout-minutes: 480` here, after the fuzzing had finished
      # (#519). The budget could not have worked: NIGHTLY_BUDGET_SECONDS
      # is 450 minutes, leaving 30 for setup and this push, and this
      # push alone measured 22. In October setup grew instead and the
      # job died in the fuzzing step before reaching this one, which is
      # why the fuzzing is now sized from the job's deadline with this
      # step's 20 minutes held back (FUZZ_RESERVE_SECONDS above).
      #
      # The timeout below is what keeps that honest. The script now does
      # a trees-only clone and touches only genuinely new entries, so 20
      # minutes is many times what it should need; if it ever exceeds
      # that, the step fails and says so instead of silently eating the
      # job and discarding the night's corpus.
      - name: Push corpus to instar-testdata
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 20
        env:
          PUSH_TOKEN: ${{ secrets.GITLAB_TESTDATA_PUSH_TOKEN }}
        run: tools/ci/push-fuzz-corpus.sh

      - name: Upload fuzzing logs and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-fuzz-logs
          path: |
            coverage-fuzz-logs/
            src/fuzz/artifacts/
          retention-days: 90

      # Last, and with always(), so a crash nobody could report still
      # turns the run red -- but only after the corpus push and the log
      # upload have run. When issue filing is the thing that broke, the
      # uploaded artifacts are how the crash reaches a human, so they
      # must not be collateral damage of failing the run.
      #
      # crashes_found is deliberately NOT consulted. A crash that was
      # successfully filed as an issue has already reached a human, and
      # going red on every recurring known crash would leave the nightly
      # permanently red and therefore ignored. Only crashes nobody was
      # told about fail the run.
      - name: Fail on unreported crashes
        if: always()
        run: |
          STATUS=0
          if [ "${report_failures:-0}" -ne 0 ]; then
            echo "::error::${report_failures} crash(es) could not be" \
              "reported as issues"
            STATUS=1
          fi
          if [ "${no_artifact_targets:-0}" -ne 0 ]; then
            echo "::error::${no_artifact_targets} target(s) exited" \
              "non-zero with no crash artifact -- check for build or" \
              "container failures"
            STATUS=1
          fi
          exit $STATUS
