# Release workflow for Instar
#
# Triggers on version tags (v*), which tools/tag-release.sh pushes once
# the version bump from tools/propose-release.sh has merged through the
# merge queue. Nothing is signed or published unless CI passed on the
# tagged commit and a reviewer approves the 'release' environment.
# Releases go to GitHub Releases only, as pre-compiled binaries and
# packages; there is no registry to publish to.
#
# Every job outside the marked build section is the same in every Rust
# repository. The build section holds this repository's own build job.
# See the template's README for the invariants the fixed jobs keep.
#
# Template source: shakenfist/development/templates/release-automation-rust/

name: Release

permissions: {}

on:
  push:
    tags:
      - 'v*'

  # A dry run of the build, on any ref: it runs check-version and the
  # build jobs, and every job with an effect outside the run is skipped.
  workflow_dispatch:

# One run per ref at a time, never cancelled part way: a release that has
# signed its tag or begun publishing must finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fails the release unless the named CI workflows succeeded on the
  # tagged commit, so that nothing is signed or published from code CI
  # did not pass. It carries the same push and tag guard as the
  # publishing jobs, so a workflow_dispatch dry run skips it and still
  # exercises the build. See "Releases" in docs/development.md for what
  # counts as CI, and
  # https://github.com/shakenfist/actions/blob/main/docs/actions.md
  # (the require-ci-success section) for how the gate works.
  ci-gate:
    name: Require CI success on the tagged commit
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, static]

    permissions:
      actions: read
      contents: read

    steps:
      - name: Require CI success
        uses: shakenfist/actions/require-ci-success@main
        # A few API calls per commit, at most 21 commits, and up to
        # five pages of the default branch's history.
        timeout-minutes: 5
        with:
          workflows: |
            functional-tests.yml

  # The root of the build graph: every other job needs this one, directly
  # or through a job that does, so the gate sits upstream of all of them.
  # A skipped ci-gate would otherwise skip this job too, so the guard lets
  # a skipped gate through, but only on a run that publishes nothing. A
  # tag push always runs the gate, and this job then needs its success. A
  # workflow_dispatch skips the gate by design, and never reaches a
  # publishing job. The ${{ }} wrapper is required: YAML reads a bare
  # value starting with "!" as a tag.
  #
  # The tag must name the version the tree carries. instar commits no
  # Cargo.lock, so there is no lockfile to compare. On a dry run with no
  # tag there is nothing to compare with, and the script only reads the
  # version.
  check-version:
    name: Check the version matches the tag
    needs: ci-gate
    if: >-
      ${{ !cancelled() && (needs.ci-gate.result == 'success' ||
      (github.event_name != 'push' && needs.ci-gate.result == 'skipped')) }}
    runs-on: [self-hosted, static]
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the version
        run: tools/release-version.sh check "${GITHUB_REF}"

  # ---------------------------------------------------------------------
  # BEGIN repository build and publish jobs.
  #
  # instar has one build job and no publishing job of its own: its
  # release is the GitHub release, which github-release below creates.
  # Any job added here must need check-version, directly or through
  # another build job; carry if: !cancelled() && every need's result ==
  # 'success', so a dry run reaches it and a failed or skipped
  # dependency still stops it; be listed in sign-tag's needs; and, if it
  # publishes, need sign-tag and carry the push and tag guard.
  # ---------------------------------------------------------------------

  # The if: is needed for the workflow_dispatch dry run. A job with no
  # if: of its own runs only if every job upstream of it succeeded, not
  # just the ones it names in needs, so the skipped ci-gate would skip
  # this job even though check-version ran. Testing check-version's
  # result alone lets it run then, and on a tag push check-version
  # succeeds only after the gate did.
  build:
    name: Build Linux binaries
    needs: check-version
    if: ${{ !cancelled() && needs.check-version.result == 'success' }}
    runs-on: [self-hosted, debian-13, s]
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      DOCKER_BUILDKIT: 1
      CARGO_BUILD_JOBS: 2

    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          # Add later if there is demand:
          # - x86_64-unknown-linux-musl
          # - aarch64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Docker
        run: tools/ci/install-docker.sh

      - name: Remove previous devcontainers, if any
        run: |
          docker image rm -f instar-build instar-release 2>/dev/null || true

      - name: Build instar (VMM + guest binaries)
        run: make instar

      # The only build path that produces user-facing binaries, and the
      # one place the floor is the shipped artifact rather than a CI
      # property. build-and-test checks the same thing, but a tag can be
      # cut from a commit that never went through it.
      - name: Check the release binary's glibc floor
        run: tools/ci/check-glibc-floor.sh

      - name: Package tarball
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          # For workflow_dispatch without a tag, use "dev"
          if [ -z "${TAG_NAME}" ] || [ "${TAG_NAME}" = "${GITHUB_REF}" ]; then
            TAG_NAME="dev"
          fi
          ARCHIVE="instar-${TAG_NAME}-${{ matrix.target }}.tar.gz"
          mkdir staging
          cp src/target/release/instar staging/
          cp src/target/release/*.bin staging/
          cp LICENSE README.md staging/
          tar -czf "${ARCHIVE}" -C staging .
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Build .deb and .rpm packages
        # x86_64-linux-gnu only -- packaging is Linux-specific and we
        # do not currently build for other architectures.
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: make package

      - name: Stage Linux packages
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          # Move the .deb and .rpm next to the tarball for a single
          # upload-artifact pattern.
          cp src/target/debian/instar_*.deb .
          cp src/target/generate-rpm/instar-*.rpm .

      # Multi-line `path:` is OR-semantics in upload-artifact@v7
      # (the action uploads the union of files matched by any
      # pattern, and `if-no-files-found: error` only fires when
      # zero files match across all patterns). Non-Linux matrix
      # entries therefore upload just the tarball; the deb/rpm
      # globs match nothing and that's fine. Filename-prefixed
      # globs avoid pulling in unrelated artifacts that may exist
      # in the working directory. The release- prefix is what
      # github-release attaches to the GitHub release.
      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            instar_*.deb
            instar-*.rpm
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # END repository build and publish jobs.
  # ---------------------------------------------------------------------

  # Keyless Sigstore signing of the tag, gated on approval of the release
  # environment. Every publishing job needs this one, so nothing is
  # published until a reviewer approves, and it needs every build job, so
  # the tag is never re-pushed while a build is running or after one has
  # failed.
  #
  # The event is tested as well as the ref because a dispatch can be
  # aimed at a tag: the ref test alone passes there, and the run re-signs
  # and force-pushes a tag that already exists, rewriting a signed object
  # someone may already have verified. Nothing is lost by requiring push:
  # re-running a failed release goes through "Re-run jobs", which keeps
  # the original push event.
  sign-tag:
    name: Sign release tag with Sigstore
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # The script installs gitsign with sudo and writes global git config,
    # so this job needs a throwaway runner rather than the shared static
    # pool, which grants no passwordless sudo and would carry the global
    # git config into whatever lands on it next. vm is what insists on a
    # throwaway runner; s because the job is small.
    runs-on: [self-hosted, vm, debian-13, s]
    timeout-minutes: 15
    environment: release

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sign and push the release tag
        run: tools/sign-release-tag.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}"

  # This job does not check out, and does not need to:
  # action-gh-release is a JavaScript action running on the host, so it
  # reads an absolute path happily. The static pool persists between jobs
  # and download-artifact extracts into its target rather than replacing
  # it, so the artefacts go to the per-job runner.temp, where nothing an
  # earlier job left can join the release.
  #
  # fail_on_unmatched_files is the other half: action-gh-release treats a
  # glob that matches nothing as a warning, so without it a release that
  # attached no files at all still reported success.
  github-release:
    name: Create GitHub Release
    needs: [build, sign-tag]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, static]
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Download release artefacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: ${{ runner.temp }}/dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: ${{ runner.temp }}/dist/*
          fail_on_unmatched_files: true
